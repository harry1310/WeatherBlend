# WeatherBlend canonical active-phase registry.
#
# Single source of truth for "which model phases is the codebase actively
# shipping right now?". Consumed by:
#   - .NET site rendering (Models.PhaseRegistry loads at startup;
#     ActivePhasePolicy is a thin static wrapper over it for back-compat),
#   - WeatherProbabilistic's retrain-python.yml (fetches via R2,
#     derives the run-list — defaults to "all impl=python phases"),
#   - retrain-blenders.yml (slice 4) for the .NET phases.
#
# Adding a new phase = edit ONLY this file. Champion-first ordering per
# target drives Models page sort order and the ActivePhasePolicy.Priority
# scalar.
#
# Roles (one of):
#   champion    — first-in-list per target; predict/site treat as Current
#   challenger  — competing model that gets a card alongside champion
#   confidence  — trained + predicted but renders only as a credible-band
#                 overlay on top of another phase's prediction line
#                 (Phase 5a fits this — Bayesian P(wet) CI overlay on 4a)
#
# Impls (one of):
#   dotnet      — trained by WeatherBlend (Microsoft.ML / LightGBM)
#   python      — trained by WeatherProbabilistic (rpy2 / pymc / blackjax)
#
# locations (optional list): per-phase location filter (Phase B). Absent
#   means "every configured location". A non-empty list scopes the phase
#   to exactly those locations — e.g. the exact-runtime 2d/3d phases are
#   bonehill_rocks-only until a Membury-cell S3 archive backfill lands.
#   Read via PhaseRegistry.ByTargetAndLocation / PhaseEntry.AppliesToLocation;
#   the per-location retrain fanout skips a phase a location can't train.
#
# IsActive() / Models-page filtering EXCLUDES role=confidence so 5a doesn't
# render as a prediction line. Train workflows include role=confidence so
# the Sunday auto-retrain catches it.

targets:
  temperature:
    phases:
      # 2d ships as champion at lead 12h only (per-lead champion in
      # TemperatureManifest.ChampionByLead); 2b stays Current for 24/48/
      # 72/96/120 where 2d isn't trained. 2c keeps its challenger slot.
      - id: "2b"
        role: champion
        impl: dotnet
      - id: "2c"
        role: challenger
        impl: dotnet
      - id: "2d"
        role: challenger
        impl: dotnet
        # Exact-runtime (raw S3 cycle archive) — bonehill_rocks only until
        # a Membury-cell S3 archive backfill lands.
        locations: ["bonehill_rocks"]

  precipitation:
    phases:
      # 3d ships as champion at lead 12h only (per-station ChampionByLead in
      # StationEntry); 3a stays Current for 24/48/72/96/120 where 3d isn't
      # trained. 3c keeps its challenger slot. 4a (dbarts BART, trained +
      # predicted in WeatherProbabilistic, written to the same predictions
      # tree) added 2026-05-09 as a cross-lead challenger; beats deployed
      # 3a in all 9 (station × lead) cells tested (avg −5.7% Brier). 5a
      # (Bayesian logreg) is role=confidence — overlays as a credible
      # band on the 4a line, no separate Models card.
      - id: "3a"
        role: champion
        impl: dotnet
      - id: "3c"
        role: challenger
        impl: dotnet
      - id: "3d"
        role: challenger
        impl: dotnet
        # Exact-runtime (raw S3 cycle archive) — bonehill_rocks only until
        # a Membury-cell S3 archive backfill lands.
        locations: ["bonehill_rocks"]
      # 3e (TorchSharp MLP) added 2026-05-11 as the first .NET-native
      # tabular-NN bake-off vs 3a/3c. Same 59-feat rich input as 3c so
      # the comparison is GBT-vs-MLP-on-identical-data; per-station,
      # per-lead, same bundle dir layout. Predict dispatches by
      # metadata.Phase == "3e" to MlpPredictor (TorchSharp libtorch
      # CPU-only).
      - id: "3e"
        role: challenger
        impl: dotnet
        # Bonehill-only — Membury 3e not yet trained.
        locations: ["bonehill_rocks"]
      # 4a became per-cell on 2026-05-11 (lead-pooled flavour
      # retired). One BART per (station, lead), matching 3a's
      # architecture. Aligned-row bake-off 2026-05-10 showed per-cell
      # beats per-cell 3a by -4.0% Brier aggregate.
      - id: "4a"
        role: challenger
        impl: python
        # Bonehill-only — Membury 4a/5a not yet trained or wired in
        # WeatherProbabilistic. retrain-python reads this filter.
        locations: ["bonehill_rocks"]
      # 4b is the arithmetic mean of 4a + 3e — not a trained model,
      # the 2026-05-12 LightGBM-meta bake-off identified it as the
      # best production stack at current data scale (Brier 0.0830,
      # wins 14/15 (station,lead) cells vs the best single). The
      # bundle is minted post-retrain by Phase4bMintCommand and the
      # cycle predictions synthesised by Phase4bPredictCommand — both
      # .NET (the Python 4b scripts were retired 2026-05-13), so
      # impl=dotnet and the mint runs in retrain-blenders.yml.
      - id: "4b"
        role: challenger
        impl: dotnet
        # Bonehill-only — minted from 4a + 3e, both Bonehill-only.
        locations: ["bonehill_rocks"]
      - id: "5a"
        role: confidence
        impl: python
        # Bonehill-only — Membury 5a not yet trained.
        locations: ["bonehill_rocks"]

  dry_window:
    phases:
      # 3g (parameter-free MC over Phase 3a hourly P(wet) marginals) is the
      # 3b challenger; cross-window monotonicity P(N=3) ≥ P(N=4) ≥ P(N=6)
      # holds by construction. 3d-shape, the legacy 3e cascade, and the
      # legacy 3f attempt were retired 2026-05-04 (a separate 3f train
      # path exists in DryWindowTrainCommand for local bake-off use but
      # isn't on the site — no DryWindowPhases entry, not in this list).
      # 3j (Gaussian copula MC, added 2026-05-13) wins 3h windows by 4.7%
      # vs 3g but loses 6h by 11.3%; included as a site-rendered
      # challenger so the weekly retrain refits Σ on the latest train slice.
      # Dry-window is Bonehill-only — Membury has no dry-window truth /
      # blenders trained yet, so every dry_window phase is pinned.
      - id: "3b"
        role: champion
        impl: dotnet
        locations: ["bonehill_rocks"]
      - id: "3g"
        role: challenger
        impl: dotnet
        locations: ["bonehill_rocks"]
      - id: "3j"
        role: challenger
        impl: dotnet
        locations: ["bonehill_rocks"]
      - id: "3n"
        role: challenger
        impl: dotnet
        locations: ["bonehill_rocks"]
      # 3s (added 2026-05-15) — 3g's iid MC, marginals from the Phase 3e
      # MLP instead of 3a. Occurrence Brier ties 3g by design; its value
      # is the start-hour curve (2026-05-15 start-hour bake-off: 6h
      # start-hour Brier −4.5% / Top-1 +2.7pt vs 3g, gain at every window).
      - id: "3s"
        role: challenger
        impl: dotnet
        locations: ["bonehill_rocks"]

  # Element per-variable blenders — wind / humidity / shortwave radiation /
  # cloud cover — feed the UTCI / feels-like derivation. One lean blender
  # per variable, so each is its own target with a single champion phase.
  # Bonehill-only: Membury element blenders aren't trained yet. Listed here
  # so the per-location retrain fan-out scopes them from the same registry
  # as every other model — no hardcoded location list in the workflow.
  wind:
    phases:
      - id: "wind"
        role: champion
        impl: dotnet
        locations: ["bonehill_rocks"]
  humidity:
    phases:
      - id: "humidity"
        role: champion
        impl: dotnet
        locations: ["bonehill_rocks"]
  shortwave_radiation:
    phases:
      - id: "shortwave_radiation"
        role: champion
        impl: dotnet
        locations: ["bonehill_rocks"]
  cloud_cover:
    phases:
      - id: "cloud_cover"
        role: champion
        impl: dotnet
        locations: ["bonehill_rocks"]
