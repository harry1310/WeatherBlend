# WeatherBlend canonical active-phase registry.
#
# Single source of truth for "which model phases is the codebase actively
# shipping right now?". Consumed by:
#   - .NET site rendering (Models.PhaseRegistry loads at startup;
#     ActivePhasePolicy is a thin static wrapper over it for back-compat),
#   - WeatherProbabilistic's retrain-python.yml (fetches via R2,
#     derives the run-list — defaults to "all impl=python phases"),
#   - retrain-blenders.yml (slice 4) for the .NET phases.
#
# This file is the REGISTRY, not the whole wiring. Adding a new phase
# touches, in practice:
#   1. this file (the L1 gate — id / role / impl / locations / retrain,
#      PLUS the per-phase `display:` presentation block — the old separate
#      Site presentation tables (PrecipPhase.cs / TempPhase.cs /
#      DryWindowPhase.cs) are now thin lookups over this file, so a new
#      phase's colour/titles are part of this same entry);
#   2. .github/workflows/retrain-blenders.yml — a train step gated on
#      run_<id> (dotnet phases with a retrain step; python phases get the
#      equivalent in WeatherProbabilistic's retrain-python.yml);
#   3. scripts/sync_train_data.sh — a case-table entry declaring the data
#      trees the phase trains on (it exits 3 on unknown ids);
#   4. the predict handled-set (e.g. PrecipPredictCommand.HandledPrecipPhases
#      / ElementPredictCommand.HandledElementPhases — the L2 gate) or a
#      dedicated predict command for synthesised phases;
#   5. possibly cloudflare/scheduler-worker (a new workflow hop if the
#      phase predicts outside the existing chains).
# PhaseWiringConsistencyTests (tests/WeatherBlend.Tests) enforces 1-4
# against this registry, so a missing hook fails at PR time instead of on
# the next Sunday retrain. Champion-first ordering per target drives
# Models page sort order, the ActivePhasePolicy.Priority scalar, AND the
# per-phase render order on the site (the old presentation tables' "canonical
# render order" is now simply this file's order).
#
# Roles (one of):
#   champion    — first-in-list per target; predict/site treat as Current
#   challenger  — competing model that gets a card alongside champion
#
# Impls (one of):
#   dotnet      — trained by WeatherBlend (Microsoft.ML / LightGBM)
#   python      — trained by WeatherProbabilistic (dbarts / ngboost)
#
# locations (optional list): per-phase location filter (Phase B). Absent
#   means "every configured location". A non-empty list scopes the phase
#   to exactly those locations — e.g. the exact-runtime 2d/3d phases are
#   bonehill_rocks-only until a Membury-cell S3 archive backfill lands.
#   Read via PhaseRegistry.ByTargetAndLocation / PhaseEntry.AppliesToLocation;
#   the per-location retrain fanout skips a phase a location can't train.
#
# retrain (optional): retrain semantics. Absent = trained by this phase's
#   impl engine (dotnet → retrain-blenders, python → retrain-python). A phase
#   that is COMPOSED at predict time and has no retrain step (train or mint)
#   MUST set `retrain: none` — otherwise the "train = every impl=dotnet phase"
#   fanout tries to train it and fails (this broke the 2026-05-31 retrain when
#   wind_blend was added without it). The phases-consistency test
#   (PhaseWiringConsistencyTests) enforces that every retrained dotnet phase
#   has both a sync_train_data.sh entry and a retrain-blenders run step.
#
# display (REQUIRED on every phase — PhaseWiringConsistencyTests enforces it):
#   per-phase presentation, consumed by the Site lookups (PrecipPhases /
#   TempPhases / DryWindowPhases read this via PhaseRegistry):
#     color                 — REQUIRED. SVG/chart colour for every line/series
#                             keyed by this phase. The cross-target palette
#                             convention: purple champion, teal rich
#                             challenger, red exact-runtime, amber BART —
#                             aligned 2026-05-10 so a phase reads the same
#                             colour wherever it appears.
#     title                 — long heading where space allows the full
#                             feature-count gloss (precip / dry-window cards).
#     shortTitle            — heading where the chart title also names the phase.
#     description           — skill-line paragraph under the heading.
#     label                 — series label for champion-vs-challenger overlays.
#     startHourCurveVersion — dry-window MC phases only: on-disk model_version
#                             of the phase's start-hour curve under
#                             data/predictions/dry_window_start_hour/…; keep in
#                             sync with DryWindowPredictCommand.Phase3pStartHourVersion.
#   Targets without a phase-keyed render path (the element blenders, 3f,
#   wind_*) carry a minimal block (color + shortTitle) so the "every phase
#   has display" invariant stays uniform; their colours are not yet consumed
#   anywhere. Python-side consumers (retrain-python.yml's yq) select
#   id/impl/locations/retrain explicitly, so display is additive-safe.

targets:
  temperature:
    phases:
      # minValidTime: 2024-01-01 added 2026-05-26 after the JMA-extension
      # surfaced that GFS / ICON / ECMWF / MF / GEM / AIFS only have valid
      # forecast data from 2024 onward in our archive — pre-2024 rows are
      # NULL-padded and dilute the LightGBM signal at the rich-feature
      # phases. 3o is the sole exception (terrain + non-precip aux stay
      # informative pre-2024). 2d not flagged because exact-runtime uses
      # a different (raw S3) tree.
      #
      # 2d ships as champion at lead 12h only (per-lead champion in
      # TemperatureManifest.ChampionByLead); 2b stays Current for 24/48/
      # 72/96/120 where 2d isn't trained. 2c keeps its challenger slot.
      # Temperature display: colour-only — the temp pages key series colour
      # by phase but render no per-phase cards, so titles aren't consumed.
      # Palette mirrors the precipitation side (3a→2b purple, 3c→2c teal,
      # 3d→2d red) so a reader cross-referencing the temp + rain skill pages
      # doesn't have to remap colours in their head. Temperature has no
      # equivalent of 4a (BART) yet, so the amber slot is reserved for
      # whenever a fourth active temp phase appears.
      # 2c is champion (2026-06-15): the rich blender wins test MAE at every
      # lead AND carries the lead-0 nowcast + <24hr per-lead policy, so it's the
      # headline forecast. Champion resolution falls back 2c → 2b per station
      # (ResolveStationChampionVersion walks this lineup), mirroring precip's
      # 3o → 3c → 3a chain — so a station with no Active 2c still resolves to 2b.
      - id: "2c"
        role: champion
        impl: dotnet
        minValidTime: "2024-01-01"
        display:
          shortTitle: "Phase 2c (rich)"
          color: "#26a69a"   # teal — rich-feature champion (carries the nowcast policy)
      - id: "2b"
        role: challenger
        impl: dotnet
        minValidTime: "2024-01-01"
        display:
          shortTitle: "Phase 2b (lean)"
          color: "#7c4dff"   # purple — lean blender (champion fallback when 2c absent)
      - id: "2d"
        role: challenger
        impl: dotnet
        # Exact-runtime (raw S3 cycle archive) — bonehill_rocks only until
        # a Membury-cell S3 archive backfill lands.
        locations: ["bonehill_rocks"]
        display:
          shortTitle: "Phase 2d (exact-runtime)"
          color: "#ef5350"   # red — exact-runtime, +12h champion

  precipitation:
    phases:
      # Champion = 3o where it exists, falling back down the lineup per
      # station: 3o → 3c → 3a. ResolveStationChampionVersion walks this
      # list in order and returns the first phase the station has an Active
      # bundle of, so Bonehill resolves to 3o, Membury to 3c (no Bonehill-
      # only 3o), and Sennen / any new location to 3a (the universal floor).
      # Lineup ORDER below is therefore the fallback preference — keep
      # 3o, 3c, 3a contiguous and first, specialised challengers after.
      #
      # 3o (3c-oro, 4-station Bonehill pool: Bellever + Bovey + Hexworthy
      # + Princetown) added 2026-05-25 in cleanup Phase 2. Rich (59) +
      # 9 terrain + 42 upper-air = 110 features (multi-level pressure added
      # in-place 2026-06-02; the decorrelated UA-route member of the 3-way 4b).
      # Trained pooled across all 4 stations to give the terrain features
      # cross-station diversity; bundle is saved per-station so predict-time
      # plumbing matches 3a / 3c exactly. Bonehill-only — Membury 3o was
      # rejected at the 2026-05-25 stage-1 bake-off (Membury terrain pool too
      # homogeneous, +0.36% CRPS vs 3a — see project_3f_stage1_membury_
      # bakeoff_2026-05-25.md). Promoted champion 2026-06-06: conservative on
      # the 0.1mm trace-precip threshold that made 3a over-read P(wet).
      # Precipitation display: full card metadata (title/shortTitle/
      # description/label) — the rain pages render per-phase sections.
      # Colours are aligned with the rolling-Brier panel on the rain skill
      # page (purple, teal, red exact-runtime, amber BART) so a phase reads
      # the same colour wherever it appears: vs-truth eyeball, +24h phase
      # comparison, rolling Brier per lead. Aligned 2026-05-10.
      - id: "3o"
        role: champion
        impl: dotnet
        locations: ["bonehill_rocks"]
        display:
          title: "Phase 3o — rich + orographic (pooled, 4 Bonehill stations)"
          shortTitle: "Phase 3o (rich+oro)"
          description: "55-feature rich set plus 9 terrain features (elevation, slope, aspect, ruggedness, upwind gain, uplift, station id), trained pooled across the 4 Bonehill rainfall gauges to give the terrain features cross-station diversity. Replaces 3c on Bonehill (3c stays as a Membury reference)."
          label: "Phase 3o (rich+oro)"
          # Blue (material 600) — was #26a69a, identical to 3c's teal-green, so
          # the two lines were indistinguishable on the rolling-Brier chart.
          # Blue is well clear of 3c (teal), 3a (violet), 3d (red), 4a (amber).
          color: "#1e88e5"
      # 3c runs at THREE locations. Membury: the only rich-precip challenger
      # (3o was rejected there at the 2026-05-25 stage-1 bake-off), so it is
      # the champion-by-fallback for Membury. Bonehill: re-added 2026-05-31,
      # kept active alongside 3o (its bundles were still live in the manifest,
      # so this keeps them retrained rather than going stale). Sennen: added
      # 2026-06-06 after the local bake-off — 3c (rich, incl UKMO) marginally
      # beat 3a on Sennen's 3 inland gauges (aggregate Brier 0.1175 vs 0.1181,
      # 11/15 station-leads). With no Bonehill-only 3o for Sennen, the
      # fallback chain makes 3c Sennen's precip champion.
      - id: "3c"
        role: challenger
        impl: dotnet
        locations: ["bonehill_rocks", "membury_devon", "sennen_cove"]
        minValidTime: "2024-01-01"
        display:
          title: "Phase 3c — rich (55 features)"
          shortTitle: "Phase 3c (rich)"
          description: "55-feature rich (adds humidity, pressure, EA persistence). Challenger."
          label: "Phase 3c (challenger)"
          color: "#26a69a"
      # 3a (lean P(wet ≥ 0.1mm)) — demoted from champion 2026-06-06; remains
      # the universal fallback (no locations filter → trains at every
      # location), so any location without a richer bundle (Sennen, new
      # sites) still gets a precipitation champion.
      - id: "3a"
        role: challenger
        impl: dotnet
        minValidTime: "2024-01-01"
        display:
          title: "Phase 3a — lean (27 features)"
          shortTitle: "Phase 3a (lean)"
          description: "27-feature lean. Champion."
          label: "Phase 3a (champion)"
          color: "#7c4dff"
      - id: "3d"
        role: challenger
        impl: dotnet
        # Exact-runtime (raw S3 cycle archive) — bonehill_rocks only until
        # a Membury-cell S3 archive backfill lands. Lead-12h specialist;
        # never a whole-cell champion, so it sits after 3a in the lineup.
        locations: ["bonehill_rocks"]
        display:
          title: "Phase 3d — exact-runtime (lead 12 champion)"
          shortTitle: "Phase 3d (exact-runtime)"
          description: "Exact-runtime blender (GFS + IFS oper + AIFS + MO Global + UKV from raw S3). Champion at +12h, challenger at +24h. Per-station EA gauge truth."
          label: "Phase 3d (exact-runtime)"
          color: "#ef5350"
      # 4a became per-cell on 2026-05-11 (lead-pooled flavour
      # retired). One BART per (station, lead), matching 3a's
      # architecture. Aligned-row bake-off 2026-05-10 showed per-cell
      # beats per-cell 3a by -4.0% Brier aggregate.
      - id: "4a"
        role: challenger
        impl: python
        # Bonehill-only — Membury 4a not yet trained or wired in
        # WeatherProbabilistic. retrain-python reads this filter.
        locations: ["bonehill_rocks"]
        minValidTime: "2024-01-01"
        display:
          title: "Phase 4a — dbarts BART (Bayesian additive regression trees)"
          shortTitle: "Phase 4a (BART)"
          description: "Bayesian Additive Regression Trees blender (R dbarts via rpy2). Same 22-feature 3a base + 3 synoptic flow features. Trained + predicted in WeatherProbabilistic, written to the same predictions tree as 3a/3c/3d."
          label: "Phase 4a (BART)"
          # The light amber-200 shade for 4a's q05/q95 credible-interval
          # bracket lines is derived in code (PrecipPhases.Phase4aBand) —
          # it's a per-panel styling constant, not a phase identity.
          color: "#ffa726"
      # 4b: arithmetic mean of 4a + 3o + 3c (3-way since 2026-06-02 — 3c+UA
      # joined as a decorrelated member, ~−3% Brier vs the old 2-way). Mint
      # inner-joins the latest 4a + 3o + 3c test_predictions; live predict
      # means today's 4a + freshest 3o + freshest 3c per (valid, lead).
      - id: "4b"
        role: challenger
        impl: dotnet
        # Bonehill-only — minted from 4a + 3o, both Bonehill-only.
        locations: ["bonehill_rocks"]
        display:
          title: "Phase 4b — 2-way mean of Phase 4a + Phase 3o"
          shortTitle: "Phase 4b (mean)"
          description: "Arithmetic mean of Phase 4a (BART) and Phase 3o (rich+oro). Not a trained model — synthesised at predict time from the freshest 4a and 3o rows per (ValidTime, LeadHours)."
          label: "Phase 4b (mean)"
          color: "#ec407a"
      # 3oni — 3o MINUS oro_station_id (no-station-id variant, 2026-06-13).
      # Same 4-Bonehill pooled rich+oro+UA training, but dropping the per-station
      # identity feature lets the pooled model be evaluated at the UNGAUGED
      # Bonehill tor's terrain vector (an unseen station id would otherwise route
      # down a gauge's default split). Placed LAST in the lineup deliberately:
      # it's a Bonehill-only experimental challenger and 3o (priority 0) is
      # always present at the gauges, so 3oni never affects champion resolution
      # there; its position only needs to not perturb the real phases' order.
      # The actual product is the tor line (predicted at bonehill_rocks's
      # terrain, wired later); gauge predictions are a credibility check only.
      # A little worse than 3o at the gauges — accepted; the gauges keep 3o.
      - id: "3oni"
        role: challenger
        impl: dotnet
        locations: ["bonehill_rocks"]
        display:
          title: "Phase 3oni — rich + orographic, no station id (tor extrapolation)"
          shortTitle: "Phase 3oni (oro, no-id)"
          description: "3o minus oro_station_id — the pooled rich+orographic model with the per-station identity feature removed, so it can be evaluated at the ungauged Bonehill tor's terrain vector. Experimental tor point-of-interest line; not gauge-verified."
          label: "Phase 3oni (oro/no-id)"
          color: "#6a1b9a"

  rainfall_amount:
    # Membury-only NGBoost-LogNormal regressor over the wet hours of
    # the day, gated at predict time by Phase 3a's hourly P(wet).
    # Two-stage distributional forecast: π · LogNormal(μ_log, σ_log)
    # mixed with (1-π) · δ_0. Source binding (3f -> 3a) is hardcoded
    # in IntensityModelSources.cs, not in phases.yaml — same
    # discipline DryWindowMcSources established before its 2026-05-25
    # retirement. Plan: docs/RAINFALL_AMOUNT_3F_PLAN.md. Bonehill
    # rollout deferred (the original 2026-05-22/23 bake-off was a
    # Membury exploration; Bonehill 3f is a separate decision once
    # 3f Membury has clean verify history).
    phases:
      - id: "3f"
        role: champion
        impl: python
        locations: ["membury_devon"]
        # Minimal display: the rainfall-amount page isn't phase-keyed yet
        # (single phase); colour reserved for a future overlay.
        display:
          shortTitle: "Phase 3f (NGBoost LogNormal)"
          color: "#5c6bc0"

  dry_window:
    phases:
      # 3b LightGBM champion; 3p / 3q Gaussian copula MC challengers.
      # 3b remains champion until the user promotes a challenger after
      # enough clean verify data lands. Membury has no dry-window truth /
      # blenders trained yet. Sennen added 2026-06-13 (3b standalone, plus
      # 3q below) — its inland EA gauges + the global 09–18 daytime window
      # give 3b everything it needs; no dependency on 3o (which Sennen lacks).
      - id: "3b"
        role: champion
        impl: dotnet
        locations: ["bonehill_rocks", "sennen_cove"]
        minValidTime: "2024-01-01"
        display:
          title: "Phase 3b — lean (53 features)"
          shortTitle: "Phase 3b (lean)"
          description: "53-feature LightGBM. Champion."
          label: "Phase 3b (champion)"
          color: "#90a4ae"
      # 3p — Gaussian copula MC over 3o hourly P(wet) marginals.
      # Single empirical Σ per station from train-split observed_wet
      # daytime sequences (lead-independent — truth doesn't move with
      # forecast horizon, so pooling across leads gives a tighter Σ).
      # Bake-off Brier 0.1064 aggregate on post-JMA-backfill data; see
      # project_phase2_dry_window_bakeoff_2026-05-25.md.
      - id: "3p"
        role: challenger
        impl: dotnet
        locations: ["bonehill_rocks"]
        display:
          title: "Phase 3p — Gaussian copula MC over Phase 3o hourly P(wet)"
          shortTitle: "Phase 3p (copula MC/3o)"
          description: "Gaussian copula MC over the rich+orographic Phase 3o's hourly P(wet) marginals. Single empirical Σ per station, fit on train-split observed daytime wet/dry binary sequences (daytime-shape autocorrelation is lead-independent for truth, so per-lead Σs pool into one). Captures within-day wet/dry autocorrelation that an iid sampler misses. Bake-off Brier 0.1064 aggregate on the 9 (station, lead) Bonehill cells."
          label: "Phase 3p (copula MC/3o)"
          color: "#7e57c2"
          # On-disk model_version of 3p's start-hour curve under
          # data/predictions/dry_window_start_hour/…. Keep in sync with
          # DryWindowPredictCommand.Phase3pStartHourVersion. Only MC phases
          # have a curve — the renderer routes each phase's "best start"
          # column + start-hour chart via this key so phases never read
          # each other's curve.
          startHourCurveVersion: "v3-3p"
      # 3q — the SAME copula-MC engine as 3p, bound to Phase 3c's marginals
      # instead of 3o's. For Sennen (added 2026-06-13): the flat 35m coastal
      # cell makes 3o's orographic features pointless, so 3c is the rich
      # precip champion there and 3q is the natural MC challenger. Runs
      # head-to-head with the 3b champion at Sennen to settle which
      # dry-window approach wins at the coast. Distinct phase (not a silent
      # 3o-else-3c fallback) so verify scores it on its own line and the
      # stage-1 source stays part of the model identity. Source binding +
      # the "v3-3q" curve version live in DryWindow3pPredictor.SourceFor.
      - id: "3q"
        role: challenger
        impl: dotnet
        locations: ["sennen_cove"]
        display:
          title: "Phase 3q — Gaussian copula MC over Phase 3c hourly P(wet)"
          shortTitle: "Phase 3q (copula MC/3c)"
          description: "Gaussian copula MC over Phase 3c's hourly P(wet) marginals — the 3p engine bound to the rich (non-orographic) 3c instead of 3o, for coastal locations without a 3o model. Single empirical Σ per station from train-split observed daytime wet/dry sequences. Captures within-day wet/dry autocorrelation an iid sampler misses; scored against the 3b champion at Sennen."
          label: "Phase 3q (copula MC/3c)"
          color: "#5e35b1"
          startHourCurveVersion: "v3-3q"

  # Element per-variable blenders — wind / humidity / shortwave radiation /
  # cloud cover — feed the UTCI / feels-like derivation. One lean blender
  # per variable, so each is its own target with a single champion phase.
  # Bonehill-only: Membury element blenders aren't trained yet. Listed here
  # so the per-location retrain fan-out scopes them from the same registry
  # as every other model — no hardcoded location list in the workflow.
  # Element-target display blocks are minimal (shortTitle + color): the
  # wind/element pages aren't phase-colour-keyed through these lookups yet,
  # but the "every registry phase has display" invariant stays uniform so
  # a future phase-comparison chart needs no schema change.
  wind:
    phases:
      - id: "wind"
        role: champion
        impl: dotnet
        # sennen_cove added 2026-06-11 (Harry: "basic lean wind speed one
        # for now") — the ERA5-truth element blender is location-generic
        # and Sennen's ERA5 + previous-runs archives landed 2026-06-05.
        # Feeds the sea-state wind-spray term. wind_speed_lgb / wind_mvn /
        # wind_blend stay Bonehill-only (Dunkeswell-SYNOP truth doesn't
        # transfer); direction for Sennen comes later per Harry.
        locations: ["bonehill_rocks", "sennen_cove"]
        display:
          shortTitle: "Wind (ERA5-truth element blender)"
          color: "#039be5"
      # Phase 2/3 of WIND_BLENDER_PLAN, 2026-05-27 production-scope lock.
      # Both ship as CHALLENGERS to the existing ERA5-truth element
      # blender above. wind_speed_lgb is the Dunkeswell-SYNOP-truth wind
      # speed model — Python since 2026-06-10 (Option B cutover:
      # quantile-LGB + cross-conformal CQR in WeatherProbabilistic's
      # train/predict_wind_speed_pi.py, so one model owns the q50 point
      # AND a calibrated 90% band; ML.NET LightGbm has no quantile
      # objective). Trains in retrain-python, predicts in
      # predict-wind (Hop C). The .NET WindSpeedLgbBlender /
      # PredictPipeline were removed at the flip.
      - id: "wind_speed_lgb"
        role: challenger
        impl: python
        # Sennen added 2026-06-16 (Harry): coastal cliff has ERA5 wind truth +
        # NWP wind + its own static/orographic/sennen_cove.json, so train_wind_
        # speed_pi.py --location sennen_cove resolves. Trains in retrain-python's
        # sennen matrix job; activates on the next R2 phases.yaml publish (noon
        # previous-runs-refresh) → retrain-python.
        locations: ["bonehill_rocks", "sennen_cove"]
        display:
          shortTitle: "Wind speed (quantile-LGB + CQR band)"
          color: "#8d6e63"
      - id: "wind_blend"
        role: challenger
        impl: dotnet
        locations: ["bonehill_rocks"]
        # Composed live at predict time (wind-blend-predict: equal-weight
        # mean of champion wind + wind_speed_lgb). No trainer / no bundle —
        # exclude from the train fanout.
        retrain: none
        display:
          shortTitle: "Wind blend (wind + wind_speed_lgb mean)"
          color: "#43a047"
  humidity:
    phases:
      - id: "humidity"
        role: champion
        impl: dotnet
        # Sennen added 2026-06-16 (Harry): unblocks UTCI/feels-like at Sennen —
        # it already has wind/shortwave/cloud elements; humidity was the missing
        # 5th input the feels-like pipeline hard-requires. Sennen has ERA5 RH
        # truth + NWP humidity, so the element harness trains it in retrain-
        # blenders' sennen matrix job.
        locations: ["bonehill_rocks", "sennen_cove"]
        display:
          shortTitle: "Humidity (element blender)"
          color: "#00897b"
  shortwave_radiation:
    phases:
      - id: "shortwave_radiation"
        role: champion
        impl: dotnet
        # sennen_cove added 2026-06-12 — rock-surface input for the sea-cliff
        # extension (docs/SENNEN_ROCK_TEMP_PLAN.md S1). Same location-generic
        # ERA5-truth harness as wind; Sennen archives reach back to 2024.
        locations: ["bonehill_rocks", "sennen_cove"]
        display:
          shortTitle: "Shortwave radiation (element blender)"
          color: "#fdd835"
  cloud_cover:
    phases:
      - id: "cloud_cover"
        role: champion
        impl: dotnet
        # sennen_cove added 2026-06-12 — rock-surface input (LW↓ cloud
        # enhancement), docs/SENNEN_ROCK_TEMP_PLAN.md S1.
        locations: ["bonehill_rocks", "sennen_cove"]
        display:
          shortTitle: "Cloud cover (element blender)"
          color: "#78909c"

  # Wind gust — separate target from wind (speed/direction), trained on
  # ERA5 WindGusts10m. Single champion phase: LightGBM over 4 production
  # NWPs (GFS/ICON/GEM required, UKMO optional). Membury gust not yet
  # evaluated. Phase id keeps the `_lgb` algorithm suffix so a future
  # MVN/MLP challenger slots in alongside without re-keying the manifest
  # (matches the plan in docs/WIND_BLENDER_PLAN.md).
  wind_gust:
    phases:
      - id: "wind_gust_lgb"
        role: champion
        impl: dotnet
        # sennen_cove added 2026-06-12 — rock-surface convective forcing is
        # mean(wind, gust); the Bonehill IR-gun validation (2026-06-07)
        # showed gust closes ~2°C of warm bias. docs/SENNEN_ROCK_TEMP_PLAN.md S1.
        locations: ["bonehill_rocks", "sennen_cove"]
        display:
          shortTitle: "Wind gust (LightGBM)"
          color: "#f4511e"

  # Wind direction (Phase 2 of WIND_BLENDER_PLAN, locked 2026-05-27).
  # Single phase: a PyTorch MLP bivariate-normal trained in WP on
  # Dunkeswell SYNOP (u, v) truth — predicts μ_u, μ_v, σ_u, σ_v, ρ over
  # the wind vector. Direction comes from atan2(-μ_u, -μ_v); the same
  # bundle's speed magnitude feeds the wind_blend composition under
  # the `wind` target below. Bonehill-only — Membury Dunkeswell paired
  # rows not yet validated (plan open-item #4).
  wind_direction:
    phases:
      - id: "wind_mvn"
        role: champion
        impl: python
        # sennen_cove added 2026-06-12 — trains on ERA5 (u,v) truth at the
        # Sennen cell, NOT Dunkeswell (the exposure-analogue argument runs
        # the other way for an exposed clifftop; decision + reasoning in
        # docs/SENNEN_SEA_STATE_PLAN.md Phase 4). Bonehill stays Dunkeswell.
        locations: ["bonehill_rocks", "sennen_cove"]
        display:
          shortTitle: "Wind direction (MVN MLP)"
          color: "#7b1fa2"

  # Significant wave height at the location's pinned marine cell (Sennen
