# WeatherBlend canonical active-phase registry.
#
# Single source of truth for "which model phases is the codebase actively
# shipping right now?". Consumed by:
#   - .NET site rendering (Models.PhaseRegistry loads at startup;
#     ActivePhasePolicy is a thin static wrapper over it for back-compat),
#   - WeatherProbabilistic's retrain-python.yml (fetches via R2,
#     derives the run-list — defaults to "all impl=python phases"),
#   - retrain-blenders.yml (slice 4) for the .NET phases.
#
# Adding a new phase = edit ONLY this file. Champion-first ordering per
# target drives Models page sort order and the ActivePhasePolicy.Priority
# scalar.
#
# Roles (one of):
#   champion    — first-in-list per target; predict/site treat as Current
#   challenger  — competing model that gets a card alongside champion
#
# Impls (one of):
#   dotnet      — trained by WeatherBlend (Microsoft.ML / LightGBM)
#   python      — trained by WeatherProbabilistic (dbarts / ngboost)
#
# locations (optional list): per-phase location filter (Phase B). Absent
#   means "every configured location". A non-empty list scopes the phase
#   to exactly those locations — e.g. the exact-runtime 2d/3d phases are
#   bonehill_rocks-only until a Membury-cell S3 archive backfill lands.
#   Read via PhaseRegistry.ByTargetAndLocation / PhaseEntry.AppliesToLocation;
#   the per-location retrain fanout skips a phase a location can't train.
#
# retrain (optional): retrain semantics. Absent = trained by this phase's
#   impl engine (dotnet → retrain-blenders, python → retrain-python). A phase
#   that is COMPOSED at predict time and has no retrain step (train or mint)
#   MUST set `retrain: none` — otherwise the "train = every impl=dotnet phase"
#   fanout tries to train it and fails (this broke the 2026-05-31 retrain when
#   wind_blend was added without it). The phases-consistency test
#   (PhaseWiringConsistencyTests) enforces that every retrained dotnet phase
#   has both a sync_train_data.sh entry and a retrain-blenders run step.

targets:
  temperature:
    phases:
      # minValidTime: 2024-01-01 added 2026-05-26 after the JMA-extension
      # surfaced that GFS / ICON / ECMWF / MF / GEM / AIFS only have valid
      # forecast data from 2024 onward in our archive — pre-2024 rows are
      # NULL-padded and dilute the LightGBM signal at the rich-feature
      # phases. 3o is the sole exception (terrain + non-precip aux stay
      # informative pre-2024). 2d not flagged because exact-runtime uses
      # a different (raw S3) tree.
      #
      # 2d ships as champion at lead 12h only (per-lead champion in
      # TemperatureManifest.ChampionByLead); 2b stays Current for 24/48/
      # 72/96/120 where 2d isn't trained. 2c keeps its challenger slot.
      - id: "2b"
        role: champion
        impl: dotnet
        minValidTime: "2024-01-01"
      - id: "2c"
        role: challenger
        impl: dotnet
        minValidTime: "2024-01-01"
      - id: "2d"
        role: challenger
        impl: dotnet
        # Exact-runtime (raw S3 cycle archive) — bonehill_rocks only until
        # a Membury-cell S3 archive backfill lands.
        locations: ["bonehill_rocks"]

  precipitation:
    phases:
      # Champion = 3o where it exists, falling back down the lineup per
      # station: 3o → 3c → 3a. ResolveStationChampionVersion walks this
      # list in order and returns the first phase the station has an Active
      # bundle of, so Bonehill resolves to 3o, Membury to 3c (no Bonehill-
      # only 3o), and Sennen / any new location to 3a (the universal floor).
      # Lineup ORDER below is therefore the fallback preference — keep
      # 3o, 3c, 3a contiguous and first, specialised challengers after.
      #
      # 3o (3c-oro, 4-station Bonehill pool: Bellever + Bovey + Hexworthy
      # + Princetown) added 2026-05-25 in cleanup Phase 2. Rich (59) +
      # 9 terrain + 42 upper-air = 110 features (multi-level pressure added
      # in-place 2026-06-02; the decorrelated UA-route member of the 3-way 4b).
      # Trained pooled across all 4 stations to give the terrain features
      # cross-station diversity; bundle is saved per-station so predict-time
      # plumbing matches 3a / 3c exactly. Bonehill-only — Membury 3o was
      # rejected at the 2026-05-25 stage-1 bake-off (Membury terrain pool too
      # homogeneous, +0.36% CRPS vs 3a — see project_3f_stage1_membury_
      # bakeoff_2026-05-25.md). Promoted champion 2026-06-06: conservative on
      # the 0.1mm trace-precip threshold that made 3a over-read P(wet).
      - id: "3o"
        role: champion
        impl: dotnet
        locations: ["bonehill_rocks"]
      # 3c runs at THREE locations. Membury: the only rich-precip challenger
      # (3o was rejected there at the 2026-05-25 stage-1 bake-off), so it is
      # the champion-by-fallback for Membury. Bonehill: re-added 2026-05-31,
      # kept active alongside 3o (its bundles were still live in the manifest,
      # so this keeps them retrained rather than going stale). Sennen: added
      # 2026-06-06 after the local bake-off — 3c (rich, incl UKMO) marginally
      # beat 3a on Sennen's 3 inland gauges (aggregate Brier 0.1175 vs 0.1181,
      # 11/15 station-leads). With no Bonehill-only 3o for Sennen, the
      # fallback chain makes 3c Sennen's precip champion.
      - id: "3c"
        role: challenger
        impl: dotnet
        locations: ["bonehill_rocks", "membury_devon", "sennen_cove"]
        minValidTime: "2024-01-01"
      # 3a (lean P(wet ≥ 0.1mm)) — demoted from champion 2026-06-06; remains
      # the universal fallback (no locations filter → trains at every
      # location), so any location without a richer bundle (Sennen, new
      # sites) still gets a precipitation champion.
      - id: "3a"
        role: challenger
        impl: dotnet
        minValidTime: "2024-01-01"
      - id: "3d"
        role: challenger
        impl: dotnet
        # Exact-runtime (raw S3 cycle archive) — bonehill_rocks only until
        # a Membury-cell S3 archive backfill lands. Lead-12h specialist;
        # never a whole-cell champion, so it sits after 3a in the lineup.
        locations: ["bonehill_rocks"]
      # 4a became per-cell on 2026-05-11 (lead-pooled flavour
      # retired). One BART per (station, lead), matching 3a's
      # architecture. Aligned-row bake-off 2026-05-10 showed per-cell
      # beats per-cell 3a by -4.0% Brier aggregate.
      - id: "4a"
        role: challenger
        impl: python
        # Bonehill-only — Membury 4a not yet trained or wired in
        # WeatherProbabilistic. retrain-python reads this filter.
        locations: ["bonehill_rocks"]
        minValidTime: "2024-01-01"
      # 4b: arithmetic mean of 4a + 3o + 3c (3-way since 2026-06-02 — 3c+UA
      # joined as a decorrelated member, ~−3% Brier vs the old 2-way). Mint
      # inner-joins the latest 4a + 3o + 3c test_predictions; live predict
      # means today's 4a + freshest 3o + freshest 3c per (valid, lead).
      - id: "4b"
        role: challenger
        impl: dotnet
        # Bonehill-only — minted from 4a + 3o, both Bonehill-only.
        locations: ["bonehill_rocks"]

  rainfall_amount:
    # Membury-only NGBoost-LogNormal regressor over the wet hours of
    # the day, gated at predict time by Phase 3a's hourly P(wet).
    # Two-stage distributional forecast: π · LogNormal(μ_log, σ_log)
    # mixed with (1-π) · δ_0. Source binding (3f -> 3a) is hardcoded
    # in IntensityModelSources.cs, not in phases.yaml — same
    # discipline DryWindowMcSources established before its 2026-05-25
    # retirement. Plan: docs/RAINFALL_AMOUNT_3F_PLAN.md. Bonehill
    # rollout deferred (the original 2026-05-22/23 bake-off was a
    # Membury exploration; Bonehill 3f is a separate decision once
    # 3f Membury has clean verify history).
    phases:
      - id: "3f"
        role: champion
        impl: python
        locations: ["membury_devon"]

  dry_window:
    phases:
      # 3b LightGBM champion; 3p Gaussian copula MC challenger.
      # 3b remains champion until the user promotes 3p after enough
      # clean verify data lands. Bonehill-only — Membury has no
      # dry-window truth / blenders trained yet.
      - id: "3b"
        role: champion
        impl: dotnet
        locations: ["bonehill_rocks"]
        minValidTime: "2024-01-01"
      # 3p — Gaussian copula MC over 3o hourly P(wet) marginals.
      # Single empirical Σ per station from train-split observed_wet
      # daytime sequences (lead-independent — truth doesn't move with
      # forecast horizon, so pooling across leads gives a tighter Σ).
      # Bake-off Brier 0.1064 aggregate on post-JMA-backfill data; see
      # project_phase2_dry_window_bakeoff_2026-05-25.md.
      - id: "3p"
        role: challenger
        impl: dotnet
        locations: ["bonehill_rocks"]

  # Element per-variable blenders — wind / humidity / shortwave radiation /
  # cloud cover — feed the UTCI / feels-like derivation. One lean blender
  # per variable, so each is its own target with a single champion phase.
  # Bonehill-only: Membury element blenders aren't trained yet. Listed here
  # so the per-location retrain fan-out scopes them from the same registry
  # as every other model — no hardcoded location list in the workflow.
  wind:
    phases:
      - id: "wind"
        role: champion
        impl: dotnet
        locations: ["bonehill_rocks"]
      # Phase 2/3 of WIND_BLENDER_PLAN, 2026-05-27 production-scope lock.
      # Both ship as CHALLENGERS to the existing ERA5-truth element
      # blender above. wind_speed_lgb is the Dunkeswell-SYNOP-truth wind
      # speed model — Python since 2026-06-10 (Option B cutover:
      # quantile-LGB + cross-conformal CQR in WeatherProbabilistic's
      # train/predict_wind_speed_pi.py, so one model owns the q50 point
      # AND a calibrated 90% band; ML.NET LightGbm has no quantile
      # objective). Trains in retrain-python, predicts in
      # predict-wind-direction (Hop C). The .NET WindSpeedLgbBlender /
      # PredictPipeline were removed at the flip.
      - id: "wind_speed_lgb"
        role: challenger
        impl: python
        locations: ["bonehill_rocks"]
      - id: "wind_blend"
        role: challenger
        impl: dotnet
        locations: ["bonehill_rocks"]
        # Composed live at predict time (wind-blend-predict: equal-weight
        # mean of champion wind + wind_speed_lgb). No trainer / no bundle —
        # exclude from the train fanout.
        retrain: none
  humidity:
    phases:
      - id: "humidity"
        role: champion
        impl: dotnet
        locations: ["bonehill_rocks"]
  shortwave_radiation:
    phases:
      - id: "shortwave_radiation"
        role: champion
        impl: dotnet
        locations: ["bonehill_rocks"]
  cloud_cover:
    phases:
      - id: "cloud_cover"
        role: champion
        impl: dotnet
        locations: ["bonehill_rocks"]

  # Wind gust — separate target from wind (speed/direction), trained on
  # ERA5 WindGusts10m. Single champion phase: LightGBM over 4 production
  # NWPs (GFS/ICON/GEM required, UKMO optional). Bonehill-only — Membury
  # gust not yet evaluated. Phase id keeps the `_lgb` algorithm suffix so
  # a future MVN/MLP challenger slots in alongside without re-keying the
  # manifest (matches the plan in docs/WIND_BLENDER_PLAN.md).
  wind_gust:
    phases:
      - id: "wind_gust_lgb"
        role: champion
        impl: dotnet
        locations: ["bonehill_rocks"]

  # Wind direction (Phase 2 of WIND_BLENDER_PLAN, locked 2026-05-27).
  # Single phase: a PyTorch MLP bivariate-normal trained in WP on
  # Dunkeswell SYNOP (u, v) truth — predicts μ_u, μ_v, σ_u, σ_v, ρ over
  # the wind vector. Direction comes from atan2(-μ_u, -μ_v); the same
  # bundle's speed magnitude feeds the wind_blend composition under
  # the `wind` target below. Bonehill-only — Membury Dunkeswell paired
  # rows not yet validated (plan open-item #4).
  wind_direction:
    phases:
      - id: "wind_mvn"
        role: champion
        impl: python
        locations: ["bonehill_rocks"]

