# WeatherBlend configuration
#
# Locations: primary is Bonehill Rocks, Dartmoor (a granite tor on the
# eastern edge of Dartmoor at 393m — orographic precipitation, frequent
# low cloud/fog, strong local wind effects). Secondary added 2026-05-11:
# Membury, a lowland East Devon village. Backfill + Collect iterate ALL
# locations; train/predict/site continue to operate on the FIRST (primary)
# location for now via AppConfig.Location's back-compat accessor — Membury
# historical data accumulates under data/forecasts/location=membury_devon/
# and data/truth/rainfall/location=membury_devon/ ready for a future
# per-location predict/site extension.

locations:
  - name: "bonehill_rocks"
    displayName: "Bonehill Rocks, Dartmoor"
    latitude: 50.5831
    longitude: -3.7931
    elevationMeters: 393

    # Manaton WeatherLink station (Davis, station 197218, ~4.2km N, real terrain
    # ~345m ≈ Bonehill's elevation): the closest real obs to the tor, a live
    # verification truth + wind/humidity/dew for the climbing index. Hourly rows
    # land under data/truth/weatherlink/. Creds are global (weatherLink: block).
    # Archive starts ~Nov 2024; solar present but uncalibrated by the owner (null).
    weatherLinkStationId: "197218"   # Manaton

    # Phase D nav tabs (2026-05-20). Bonehill is the full-stack location —
    # temperature, rain, dry-window forecasts, plus skill + models. Listed
    # order matches the site-nav left-to-right.
    tabs: [overview, temperature, rain, wind, dry_window, skill, models, element]

    # Climbing-conditions verdict strip on the overview tiles (idea #1,
    # 2026-06-13). Bonehill-first: it has every non-marine input live (rock
    # friction, wind, temp, rain, daylight). Sennen waits for its sea-state
    # factor + per-face split; Membury has no rock inputs. Curves are tuned
    # in Site/ClimbingConditions.cs (Harry's domain numbers).
    showClimbingConditions: true

    # Outdoor climbing window — sleep hours dropped from the Overview tile grid.
    # The "climbing range" (05:00–20:00 UTC; tightened from 04→05 / 21→20 on
    # 2026-05-07 per user feedback) now lives in ONE place — SitePages.ClimbingRange*
    # — and Bonehill + Sennen both use it (2026-06-16). A location opts out to the
    # full 24h day via overview.allHours (Membury). So: overview omitted here →
    # the shared climbing range.

    # METAR truth sources. Exeter is nearest but lowland (~30km SE, ~30m elev).
    # Yeovilton is further but more frequent reports.
    metar:
      primary: "EGTE"    # Exeter Airport
      fallback: "EGDY"   # RNAS Yeovilton

    # Environment Agency rainfall stations within ~10km of Bonehill Rocks, via the
    # EA Hydrology API (https://environment.data.gov.uk/hydrology). OGL v3, no auth.
    # 15-min tip totals; aggregate 4× for hourly. Bellever (7.5km W) and the gauge
    # near Hexworthy (9.6km SW, EA labels simply "Dartmoor") are the moorland
    # matches; Bovey Tracey (5.5km E, ~80m elevation) is the eastern valley
    # complement. `id` is the EA measure prefix — for versioned stations it
    # includes the wiskiID suffix (e.g. `_363307`).
    #
    # 2026-05-04: a more distant western-flank station was dropped in favour
    # of Bovey Tracey, which gives Bonehill near-equilateral triangulation
    # (~5-10km radius). Historical parquets + predictions for the dropped
    # station remain on disk for archival reference; not loaded by config so
    # live train/predict/verify ignore them.
    #
    # 2026-05-24: Princetown (14.6km WSW, 414m) re-added for the orographic
    # pooled-blender study (docs/OROGRAPHIC_BONEHILL_3C_PLAN.md) — it's the
    # only high-elevation central/west Dartmoor gauge in range and adds a
    # distinct upwind-geometry anchor to the 6-station pool that the three
    # existing Bonehill gauges + the three Membury gauges otherwise lack.
    # Side-effect: next Sunday auto-retrain picks Princetown up across every
    # per-station phase (3a/3c/3b/3d + Python 4a), producing
    # a per-station Princetown set alongside the pooled blender.
    rainfall:
      stations:
        - id: "723a8fc4-908b-4430-91c7-9990be86540a_363307"
          name: "Bellever Dartmoor"
        - id: "de3285a5-0abf-4c5b-8ee2-63187f9124ae"
          name: "Bovey Tracey"
        - id: "b69ee00c-aa73-49d0-bc62-ff4673094553"
          name: "Dartmoor nr Hexworthy"
        - id: "f0676423-f697-4dec-8958-440f335cce9a"
          name: "Princetown"

    # Rock surface modelled as a single SUNLIT VERTICAL face (2026-06-20). The
    # whole-crag horizontal mode ran ~4°C warm vs the vertical rock climbers are
    # actually on — IR-gun field check 18 Jun 12Z (docs/ROCK_IR_CALIBRATION.md):
    # horizontal-in-sun 25°C, vertical-in-sun 20°C, vertical-in-shade 18°C, vs the
    # model's whole-crag 23.6°C. A south-facing (180°) vertical wall is the
    # sunlit-aspect proxy until real per-route bearings are surveyed. fSky 0.5: a
    # vertical wall sees ~half sky / half ground, so it doesn't cool below air in
    # shade — matching the 18°C (≈ air+2) shaded reading, which the whole-crag
    # fSky 1.0 would over-cool. directBeamFactor is ignored in face mode (the
    # per-face projection handles beam geometry directly).
    rockSurface:
      fSky: 0.5
      # Drying model LIVE for Bonehill (2026-06-19): rain-wet rock hard-gates the
      # climbing verdict Off with a dry-by ETA, and the film's latent-heat feedback
      # cools the slab as it dries. Enabled now that the drying-rate coefficients are
      # literature-grounded (bulk-aerodynamic Dalton + latent-heat energy balance —
      # see RockSurfaceConfig); IR-gun + "stayed wet ~N h" field notes now VALIDATE
      # the drying timescale rather than block go-live. Sennen stays off (no spray
      # coefficient yet). Watch the first cycle's SurfaceWaterMm/RainWaterMm columns.
      surfaceWaterEnabled: true
      faces:
        - name: "sunlit"
          aspectDeg: 180   # south — sunlit vertical proxy; real bearings TODO
          slopeDeg: 90     # vertical wall (default, explicit)

  # Membury, East Devon — added 2026-05-11. Lowland village (~120m
  # elevation), valley climate (lower wet rate than Dartmoor's moor),
  # ~equilateral triangulation by 3 EA gauges at 6-7 km radius
  # (Chards Snowdon Hill N, Goren SW, Raymonds Hill S). Temperature
  # blender scope added 2026-05-14 (Phase 2b/2c only — exact-runtime
  # 2d uses the same UKV bake-off-validated approach but isn't trained
  # for Membury until the long-range bake-off catches up).
  - name: "membury_devon"
    displayName: "Membury, East Devon"
    latitude: 50.8254
    longitude: -3.0000
    elevationMeters: 120

    # Phase D nav tabs (2026-05-20). Membury has temperature + rain bundles
    # only — no dry-window modelling, no element blenders, no feels-like
    # (Bonehill-only for now). Skill + Models pages auto-filter their
    # internal sub-navs to {temperature, rain}.
    tabs: [overview, temperature, rain, skill, models]

    # User cares about rainfall around the clock at Membury — Overview
    # tile grid shows the full 24h day rather than dropping sleep hours.
    overview:
      # Membury is a lowland village, not a climbing crag — show the full 24h
      # day rather than the climbing range.
      allHours: true

    # METAR truth sources. EGTE (Exeter Airport) is ~25 km SW of Membury;
    # EGDY (Yeovilton) is ~35 km E. Same airports Bonehill uses — METAR
    # text is per-ICAO, not per-location, so TruthRepository.GetMetarTemperature
    # keys on Station only and a single EGTE/EGDY partition serves both.
    # Backfill does NOT re-pull METAR for Membury; the existing
    # data/truth/metar/location=bonehill_rocks/station=EGTE/... rows are
    # the same physical data and the read path is location-agnostic.
    metar:
      primary: "EGTE"    # Exeter Airport (same as Bonehill)
      fallback: "EGDY"   # RNAS Yeovilton
    rainfall:
      stations:
        - id: "d1803c5a-e461-404b-8750-7f946456a6c6"
          name: "Chards Snowdon Hill"
        - id: "0315fef3-ecc3-4a0d-a305-7bab91dd016f"
          name: "Goren"
        - id: "9cbfd7c3-d11f-4a5e-ac4c-99575bf18c86"
          name: "Raymonds Hill"

    # Village calibration (true-rainfall study 2026-06-10 —
    # MemburyDailyTruth/true_rainfall_study.md): NNLS-through-origin
    # weights mapping the 3 EA gauges onto 1,236 days of the on-site
    # manual gauge (Rock, Forge Farm; 09:00Z rain-day, snow excluded).
    # The rain pages compose the per-gauge 3f forecasts with these
    # weights into a "Membury village" estimate. Missing/empty block =
    # no village section. Refresh by re-running
    # membury_true_rainfall_study.py as new manual months land —
    # Chard's ratio is drifting year-on-year (0.98→1.09 over 2024→26),
    # which is also why Goren carries half the weight.
    villageRain:
      label: "Membury village"
      fittedOn: "2026-06-10"
      weights:
        "Chards Snowdon Hill": 0.309
        "Goren": 0.513
        "Raymonds Hill": 0.133

  # Sennen, Cornwall — added 2026-06-05. Granite SEA CLIFF at the far SW tip
  # (Sennen Cove / Land's End), ~35 m clifftop, full Atlantic exposure. The
  # "hardest yet" location: truth is sparse out here. Rain = the 3 nearest EA
  # gauges, but they're ALL 11-21 km inland to the E (none seaward), so a
  # west-facing cliff catching Atlantic bands is the worst case for gauge
  # representativeness — accepted for now. METAR = Culdrose (EGDR, ~32 km, the
  # nearest reliable issuer). Wind: ERA5 reanalysis via the era5 backfill for
  # now; the MIDAS SYNOP-truth path (Culdrose/Camborne) is a separate static
  # CEDA fetch done at train time, not part of collect/backfill (see backlog).
  # The truly representative site (NCI Gwennap Head Davis AWS, ~3 km, exposed)
  # is access-gated (WeatherLink Pro+ / WeatherFile licence) so it's a future
  # live cross-check only, not a trainable source.
  #
  # Surfaced on the site 2026-06-11 (Harry's ask): the 2026-06-07 Sunday
  # retrain minted temp 2b/2c + the 2026-06-10 manual retrain refreshed
  # precip 3c (Sennen's champion via the 3o→3c→3a fallback chain) for all
  # three gauges, and predict has been emitting since. Same tab shape as
  # Membury — no wind / dry-window / element models here, so those tabs
  # stay off and the skill/models pages auto-filter to {temperature, rain}.
  # Skill charts show their "no verify history yet" empty states until
  # verify accumulates Sennen weeks.
  - name: "sennen_cove"
    displayName: "Sennen, Cornwall"
    latitude: 50.0786
    longitude: -5.7044
    elevationMeters: 35

    # sea_state added 2026-06-11 (sea-state Phase 2): wave / tide / swell /
    # wind page fed by the wave_height_lgb predictions tree. Sennen-only —
    # it's the one location with a marine block + wave model.
    # wind added 2026-06-12 (Harry: own wind page like Bonehill's, not a
    # section on Sea state). Sennen has only the champion `wind` element
    # model — the page's wind_speed_lgb band / gust line / wind_mvn
    # direction wedges degrade to their absent/empty states.
    # dry_window added 2026-06-13: 3b champion + 3q challenger (copula MC over
    # 3c — Sennen has no 3o). The skill/models pages auto-include dry_window
    # once the tab is present; empty states show until verify accumulates.
    tabs: [overview, temperature, rain, wind, dry_window, sea_state, skill, models]

    # Climbing-conditions strip v1 (2026-06-13, Harry: ship now). Adds the
    # Sennen-specific SEA-STATE factor (tide / run-up / ONSHORE SPRAY — see
    # SeaConditions.cs) on top of dry / wind / temp / daylight. PROVISIONAL:
    # rock-temp is still gated off here (rockSurface.enabled=false), so the
    # friction sub-score falls back to AIR temp, not the sea-moderated rock —
    # upgrades to real per-face friction when the IR-gun calibration enables
    # rock-temp (S5). Single verdict per hour until then (per-face needs rock).
    showClimbingConditions: true

    # Wind-exposure multiplier for the climbing index (Harry 2026-06-20): the
    # wind-comfort curve is calibrated to the exposed Bonehill tor, but Sennen's
    # cove is far more sheltered — 20 mph here is comfortable. Scale the forecast
    # wind to ~⅔ before the comfort curve so wind stops being a false limiter.
    # DRAFT — tune against on-site feel. Bonehill omits this (default 1.0).
    windExposure: 0.65

    # overview: omitted → uses the shared "climbing range" (05:00–20:00 UTC),
    # aligned with Bonehill (was 06:00–21:00 here).

    # Rock-surface override (sea-cliff extension, 2026-06-12 —
    # docs/SENNEN_ROCK_TEMP_PLAN.md). ENABLED 2026-06-13: the cliff-aware
    # physics (S3 face-projected shortwave + S4 sea longwave) is in, which
    # was Harry's bar for showing output; first rows appear once the
    # 2026-06-14 retrain mints the radiation/cloud/gust/wind elements.
    # fSky 0.5 is the DRAFT vertical-face value (~half the view hemisphere
    # is sky, the rest is sea) — refine with the IR-gun calibration (S5).
    # All other knobs inherit the global (Bonehill-calibrated) block.
    #
    # faces (S3, Harry 2026-06-13): the three aspects that matter — W / SW /
    # S. Bearings are NOMINAL compass values (270/225/180) and slopeDeg
    # defaults to 90 (vertical wall) — refine per-crag when Harry confirms
    # real bearings/steepness. Each face is its own Force-Restore
    # integration + margin series (rows stamped Face=name).
    # greasyMarginC 1.5 (vs Bonehill's 3.0): maritime dew point sits close to
    # air temp here, so the Bonehill band would flag "greasy?" ~35% of visible
    # hours — meaningless. 1.5 flags the most-marginal ~10% (hindcast over 2y
    # of Sennen ERA5, scripts/sennen_rock_margin_sanity.py, 2026-06-13:
    # visible-hours amber 0.5C=1.5% / 1.0C=4.6% / 1.5C=10.4% / 3.0C=34.9%;
    # true condensation ~0.4% of hours once the sea-LW term is in). DRAFT —
    # refine with the IR-gun readings.
    rockSurface:
      enabled: true
      fSky: 0.5
      greasyMarginC: 1.5
      # Drying model LIVE for Sennen too (2026-06-19). The rain Off-gate + dew +
      # latent feedback are the same physics as Bonehill (no guessed numbers).
      # Spray-as-film-wetting is still NOT modelled (no deposition coefficient) —
      # but that's covered for the verdict by the index's separate Spray quality
      # factor (SeaConditions), so spray-soaked rock isn't falsely called "good";
      # it just won't trigger the rain Off-gate. Caveat: Sennen rock-temp isn't
      # IR-validated yet — tomorrow's readings validate the Ts the drying VPD rides on.
      surfaceWaterEnabled: true
      faces:
        - name: "west"
          aspectDeg: 270
        - name: "southwest"
          aspectDeg: 225
        - name: "south"
          aspectDeg: 180

    # Davis WeatherLink (api.weatherlink.com v2) station for close, real-
    # instrument truth (2026-06-19). NCI Gwennap Head sits on the cliff ~3 km
    # SSE of Sennen Cove — far nearer than Culdrose METAR (~32 km) or the
    # inland EA gauges (≥11 km). Hourly rows aggregated from the station's
    # 15-min archive land under data/truth/weatherlink/. Credentials are global
    # (see the weatherLink: block); only the station id is per-location.
    weatherLinkStationId: "115072"   # NCI Gwennap Head

    # Culdrose (RNAS) is the nearest reliable METAR issuer (~32 km E); Newquay
    # (St Mawgan) is the fallback. Land's End (EGHC) is closer but doesn't issue
    # reliable routine METAR. METAR is per-ICAO so these partitions are new.
    metar:
      primary: "EGDR"    # RNAS Culdrose
      fallback: "EGHQ"   # Newquay (St Mawgan)

    # 3 nearest EA Hydrology rainfall gauges (all inland-east; the SW tip has
    # none seaward). Trengwainton ~11 km NE, St Ives Towednack ~18 km NE,
    # St Erth ~21 km NE. Same 15-min EA Hydrology path as Bonehill/Membury.
    rainfall:
      stations:
        - id: "9bd58397-e67c-4007-aaf5-fd9dfa5d929b"
          name: "Trengwainton"
        - id: "26cd5df2-d1c3-438a-bcc2-4a2126f5b9d2"
          name: "St Ives Towednack"
        - id: "eb6c1930-b131-4d71-9ce2-3616abd6ea39_382133"
          name: "St Erth"

    # Sea-state collection (Sennen sea-state Phase 0, 2026-06-11 — see
    # docs/SENNEN_SEA_STATE_PLAN.md). The coordinate is the PINNED marine
    # grid cell, ~4 km SSW of the cliff: probing the marine API with the
    # cliff coordinate resolves to this cell (50.041664, -5.7083282,
    # elevation 0.0, real data). Pinned explicitly so an OM grid change
    # can't silently move our sea point. best_match is pulled implicitly
    # alongside these models — it alone serves the site extras
    # (variables.marineSite: tide height, SST, secondary swell).
    # Hindcast archive starts vary per model (MFWAM ≥2022-01, EWAM +
    # meteofrance_wave ≥2023-01, GWAM + ECMWF WAM by 2024-06, GFS Wave
    # live-only) — pre-archive backfill chunks log 0 rows, expected.
    marine:
      latitude: 50.0417
      longitude: -5.7083
      # era5_ocean truth cell — pinned SEPARATELY from the forecast point.
      # ERA5's wave grid is 0.5°; the cell nearest the forecast point
      # ((50.0, -5.5), SE of Land's End) is sheltered from W/NW Atlantic
      # swell and under-read the Sevenstones buoy by -0.31 m in the
      # dominant SW-W/W-NW direction bins (2026-06-11 truth-cell check,
      # WP scripts/wave_truth_cell_check.py). This coordinate snaps to
      # (50.0, -6.0), west of the peninsula: bias ~0.00 in those bins,
      # MAE 0.299 vs 0.362, r 0.953 vs 0.940. Easterly-bin over-read vs
      # the buoy is expected (both sensors shelter differently in E'lies)
      # and easterly sea is offshore/flat at the cliff anyway.
      truthLatitude: 50.0
      truthLongitude: -6.0
      models:
        - id: "meteofrance_wave"
          displayName: "Météo-France MFWAM"
        - id: "ecmwf_wam025"
          displayName: "ECMWF WAM 0.25°"
        - id: "gwam"
          displayName: "DWD GWAM (global)"
        - id: "ewam"
          displayName: "DWD EWAM (Europe 0.05°)"
        - id: "ncep_gfswave025"
          displayName: "NOAA GFS Wave 0.25°"
      # Verification-truth buoys (researched + endpoints verified 2026-06-11).
      # Sevenstones is the primary: the only fully Atlantic-exposed sensor
      # within ~30 km, directly up-swell (due W) of the cliff, 69 m water —
      # effectively the deep-water incident wave field. Reports Hs/Tz/SST
      # only (no direction/Tp). SW Scilly adds the directional suite from
      # deep open water (67 km SW — lag-match swell arrival when verifying).
      # Penzance is a Mount's Bay (S-facing) waverider: BLIND to W/NW
      # groundswell, kept as the southerly-swell / windsea cross-check.
      # Realtime = open WaveNet JSON API (no auth, non-QC'd, ≤10-90 min
      # latency); archive = EMODnet ERDDAP (CC-BY-SA, QC'd, floor 2018-01,
      # mirror lags days-weeks). Directions on waveriders are PEAK direction.
      # Overview-tile sea-state badge thresholds (amber = 1 trigger fired,
      # red = 2+). tideHighMsl = 67th percentile of one year's high waters
      # at the cell (computed 2026-06-12; recompute yearly). ALL values are
      # DRAFT pending calibration against real sessions. Delete the block
      # to turn the badge off entirely.
      seaStateBadge:
        tideHighMsl: 1.71        # m vs MSL — TideHeightMsl pass-through
        runUpProxy: 12.0         # √Hs(m) × swell period(s)
        windMinMph: 15.0
        windSectorFromDeg: 225   # onshore "from" sector, clockwise from→to
        windSectorToDeg: 335     # (may wrap 360)
      buoys:
        - slug: "sevenstones_62107"
          displayName: "Sevenstones Light Vessel"
          wavenetId: "4"
          wavenetSource: "EXT"
          platformCode: "6200107"
        - slug: "sw_scilly_6201054"
          displayName: "SW Isles of Scilly WaveNet"
          wavenetId: "SWSCILLYWN"
          wavenetSource: "INT"
          platformCode: "6201054"
        - slug: "penzance_6201000"
          displayName: "Penzance Waverider"
          wavenetId: "200"
          wavenetSource: "EXT"
          platformCode: "6201000"

# NWP models to collect via Open-Meteo.
# Open-Meteo exposes many models through one API with a consistent schema.
# See https://open-meteo.com/en/docs for the full list.
models:
  - id: "gfs_seamless"
    displayName: "NOAA GFS"
  - id: "ecmwf_ifs025"
    displayName: "ECMWF IFS 0.25°"
  - id: "icon_seamless"
    displayName: "DWD ICON"
  - id: "meteofrance_seamless"
    displayName: "Météo-France ARPEGE/AROME"
  - id: "ukmo_seamless"
    displayName: "UK Met Office"
  - id: "gem_seamless"
    displayName: "Environment Canada GEM"
  - id: "ecmwf_aifs025_single"
    displayName: "ECMWF AIFS 0.25° (AI/GNN)"
  # Backfilled 2026-04-28 for a future bake-off — different physics consortium
  # (HIRLAM AROME) and different national service (JMA) from the existing 7.
  # Not yet wired into any blender spec; data on disk only until bake-off decides.
  - id: "knmi_harmonie_arome_europe"
    displayName: "KNMI HARMONIE-AROME (HIRLAM, 2km Europe)"
  - id: "jma_seamless"
    displayName: "JMA Global Spectral Model (Japan)"
  - id: "dmi_harmonie_arome_europe"
    displayName: "DMI HARMONIE-AROME (HIRLAM, 2km Europe — sister of KNMI)"
# Raw Met Office UKV / Global partitions used to be backfilled here via
# Python scripts. Removed 2026-04-29 — the 4-way bake-off found they add zero
# signal (see memory/project_met_office_raw_negative_result.md), AND their
# Python parquet writer was the sole source of TIMESTAMPTZ schema in the
# forecast tree, which mis-aligned every forecast↔truth JOIN by 1–2h during
# BST. The DataHub Spot + Land Observations clients are unaffected and stay.

# Variables to pull. Two lists because Open-Meteo's per-model forecast endpoint
# and the ERA5 archive endpoint expose slightly different sets — keeping them
# separate avoids spurious "variable not available" warnings on either side.
# Pull everything we might want now — backfilling later is painful.
#
# Radiation triplet (shortwave / direct / diffuse) lands on both lists because
# UTCI / feels-like modelling needs an MRT input. Direct + diffuse split is
# kept for future flexibility; shortwave alone is enough for a simple MRT.
variables:
  forecast:
    - temperature_2m
    - dew_point_2m
    - relative_humidity_2m
    - precipitation
    - precipitation_probability
    - rain
    - showers
    - snowfall
    - cloud_cover
    - cloud_cover_low
    - cloud_cover_mid
    - cloud_cover_high
    - wind_speed_10m
    - wind_direction_10m
    - wind_gusts_10m
    - surface_pressure
    - pressure_msl
    - cape
    - visibility
    - shortwave_radiation
    - direct_radiation
    - diffuse_radiation
    # Multi-level (pressure-level) NWP inputs — added 2026-05-29 to start
    # the backfill window for the upper-air precip blender experiment.
    # Spans vertical temp profile (lapse rates), synoptic pattern (z500),
    # 850-500 thickness, vector shear, and low-level moisture. Not yet
    # consumed by any blender spec — data on disk only until a v4-style
    # upper-air feature builder lands. Open-Meteo handles missing levels
    # per-model gracefully (returns nulls).
    - temperature_850hPa
    - temperature_700hPa
    - temperature_500hPa
    - geopotential_height_850hPa
    - geopotential_height_500hPa
    - wind_speed_850hPa
    - wind_speed_500hPa
    - wind_direction_850hPa
    - wind_direction_500hPa
    - relative_humidity_850hPa
  era5:
    - temperature_2m
    - dew_point_2m
    - relative_humidity_2m
    - precipitation
    - rain
    - snowfall
    - cloud_cover
    - cloud_cover_low
    - cloud_cover_mid
    - cloud_cover_high
    - wind_speed_10m
    - wind_direction_10m
    - wind_gusts_10m
    - surface_pressure
    - pressure_msl
    - visibility
    - shortwave_radiation
    - direct_radiation
    - diffuse_radiation
    # Top-soil temperature (0-7cm) — surface-energy validation rail for the rock
    # surface-temp module (added 2026-06-03). Open-Meteo ERA5 has NO skin temp or
    # downwelling longwave (both null), so this damped subsurface temp is the best
    # available reanalysis comparator; skin/LW would need a Copernicus CDS pull.
    - soil_temperature_0_to_7cm
    # Multi-level (pressure-level) ERA5 reanalysis fields — mirror of the
    # forecast list above so train-truth and forecast inputs are aligned
    # on the same vertical structure. ERA5 has all pressure levels.
    - temperature_850hPa
    - temperature_700hPa
    - temperature_500hPa
    - geopotential_height_850hPa
    - geopotential_height_500hPa
    - wind_speed_850hPa
    - wind_speed_500hPa
    - wind_direction_850hPa
    - wind_direction_500hPa
    - relative_humidity_850hPa
  # Wave variables pulled per wave model (live + offset-day + hindcast) for
  # locations with a marine: block. height/period/direction × total /
  # wind-wave / swell — the swell triple is the run-up driver for the
  # wetting-elevation product.
  marine:
    - wave_height
    - wave_period
    - wave_direction
    - wind_wave_height
    - wind_wave_period
    - wind_wave_direction
    - swell_wave_height
    - swell_wave_period
    - swell_wave_direction
  # Marine variables ONLY best_match serves ("undefined" on per-model
  # requests) — ride on the best_match pull. sea_level_height_msl is the
  # tide+surge curve (hindcast ≥mid-2023); cross-check vs Newlyn harmonics
  # before the site chip trusts it.
  marineSite:
    - secondary_swell_wave_height
    - secondary_swell_wave_period
    - secondary_swell_wave_direction
    - sea_level_height_msl
    - sea_surface_temperature

# How far ahead to pull each run.
forecastDays: 7

# Storage root - relative paths are resolved from the repo root.
# Layout:
#   forecasts/   NWP model predictions (live + historical-forecast API, same schema)
#   truth/era5/  Open-Meteo ERA5 reanalysis - training truth (gapless, quantitative)
#   truth/metar/ Station observations - verification truth (gappy, real obs)
storage:
  forecastsPath: "data/forecasts"
  observationsPath: "data/truth/metar"
  era5Path: "data/truth/era5"
  rainfallPath: "data/truth/rainfall"
  predictionsPath: "data/predictions"
  reportsPath: "data/reports"
  metOfficeObsPath: "data/truth/met_office_obs"
  # Sea-state trees (Sennen sea-state Phase 0, 2026-06-11):
  #   marine/  wave-model forecasts (live + offset_day + hindcast), the
  #            sea-state sibling of forecasts/
  #   truth/waves/  era5_ocean reanalysis (training truth) + wave buoys
  #            (verification truth), distinguished by source= partition
  marinePath: "data/marine"
  wavesPath: "data/truth/waves"

# Met Office DataHub benchmark capture.
# Global Spot forecasts are written into the standard forecasts tree under
# model=met_office_spot so existing compare/verify tooling picks them up for free.
# Land Observations go to metOfficeObsPath (rolling 48h window, dedup on observed time).
# Keys live outside the repo; env var wins, file is the fallback (same pattern as R2).
# Free tier: 360 calls/day per product; one collect cycle uses ~1 call per product.
metOffice:
  enabled: true
  spotModelTag: "met_office_spot"
  spotKeyEnvVar: "MET_OFFICE_SPOT_API_KEY"
  # Relative to cwd (repo root). Keys live one level above the repo, outside git.
  # Env var wins over file; CI uses env vars only — the file fallback is purely
  # for local-dev convenience so you don't have to export vars in every shell.
  spotKeyFile: "../MetOfficeSpotKey.txt"
  obsKeyEnvVar: "MET_OFFICE_OBS_API_KEY"
  obsKeyFile: "../MetOfficeObsKey.txt"
  # Land Observations is geohash-addressed (API v1.0): GET /nearest?lat=...&lon=...
  # returned gcj0z3 for Bonehill (lat=50.58, lon=-3.79 at 2dp). Pinned here so
  # cycles skip the /nearest lookup — the spec asks callers to cache it.
  obsGeohash: "gcj0z3"
  obsArea: "Devon"

  # Supplemental Land Observations geohashes — collected alongside the
  # primary obsGeohash on every cycle, written to a sibling partition
  # under met_office_obs/location={label}/geohash={geohash}/ so the rows
  # can be distinguished from the primary site truth by either key.
  #
  # gcj9q6 = Dunkeswell Aerodrome (50.86, -3.24, 252 m). Added 2026-05-27
  # after the wind truth bake-off showed Dunkeswell-trained models
  # generalise best across truth sources for Bonehill wind — the hilltop
  # exposure regime at 252 m is closer to the 393 m tor than the lowland
  # Exeter Airport SYNOP at ~30 m. Live stream from DataHub bridges the
  # ~annual lag in MIDAS Open releases (historical 2009-2024 lives in
  # data/truth/midas/ from a separate CEDA backfill).
  supplementalObsGeohashes:
    - geohash: "gcj9q6"
      area: "Devon"
      label: "dunkeswell_aerodrome"

# Davis WeatherLink (api.weatherlink.com v2) — close, real-instrument truth.
# Per-location station ids live on each location's `weatherLinkStationId`
# (sennen_cove → NCI Gwennap Head 115072). These are the GLOBAL credentials.
# WeatherLink needs TWO secrets: api-key (a QUERY param) + X-Api-Secret (a
# request HEADER). Per value the env var wins, the file is the fallback (same
# pattern as Met Office / R2). The key file holds two lines:
#   key=<api-key>
#   secret=<api-secret>
weatherLink:
  enabled: true
  apiKeyEnvVar: "WEATHERLINK_API_KEY"
  apiSecretEnvVar: "WEATHERLINK_API_SECRET"
  # Relative to cwd (repo root). Lives one level above the repo, outside git.
  keyFile: "../WeatherLinkKey.txt"

# HTTP client settings.
http:
  userAgent: "WeatherBlend-PoC/0.1 (contact: you@example.com)"
  timeoutSeconds: 60
  retryCount: 3
  # Delay between consecutive Open-Meteo Previous Runs backfill chunks.
  # 15s ≈ 4 calls/min, comfortably under the hourly token bucket that bit us on
  # 2026-04-25. Bump if 429s reappear; lower at your own risk. ERA5 uses a
  # hardcoded 2s delay (its endpoint has plenty of headroom in observed runs).
  previousRunsBackfillDelaySeconds: 15

# Per-blender model membership. Single source of truth for "what models does
# this blender use at this lead". Drives:
#   * Training SQL: which model columns are pivoted, post-pivot row drop policy.
#   * Predict-time forecast pivot: only listed models are pulled.
#   * feature_schema.json on each artefact (per-lead).
#
# Three-bucket per-lead model membership:
#   requiredModels  — must be NOT NULL per row; row dropped otherwise.
#                     Use for models we want as load-bearing inputs.
#   optionalModels  — included as a feature, allowed to be NaN at the row level
#                     (LightGBM handles NaN natively via missing-value branches).
#                     Use for models with known intra-window gaps.
#   (anything else) — excluded entirely. No vector slot, no NaN sentinel.
#                     Use for models we deliberately don't want, or that have
#                     no data at all.
#
# Universal safety check (always on): even an all-optional spec drops rows
# where every listed model is silent — the feature vector would be all-NaN,
# contributing nothing to training.
#
# perLeadOverrides replaces both lists for a specific lead. Used where data
# availability differs (MF caps at 72h; UKMO data starts 2024-09; etc.).
#
# History note: the "lean" temperature blender excludes UKMO entirely (per the
# 2026-04-26 four-way bake-off — the 5-model + full-window variant beat the
# 6-model + restricted-window variant by 1-2% MAE). The "rich" temperature
# blender requires UKMO, which naturally restricts training to post-2024-09 —
# that's the deliberate design tradeoff captured by required-vs-excluded here.
blenders:
  items:
    # ---- Temperature ----
    # AIFS (ECMWF graph-NN model) added 2026-04-27. AIFS data on Open-Meteo
    # Previous Runs starts 2025-02-17 (~14 months at the time of writing).
    # In lean: optional (preserves the full training window from 2024-02-04;
    # AIFS slot is NaN pre-Feb-2025, valued post-Feb-2025).
    # In rich: optional (same rationale).
    # 2026-04-28 bake-off (scripts/aifs_bakeoff.py) tested AIFS-required as a
    # full alternative: required cost more training data than the cleaner AIFS
    # signal bought back for lean (blend MAE +14% at 24h), and was a wash for
    # rich. Revisit once AIFS history extends further back into 2024.
    - target: temperature
      featureSet: lean
      # Minimal required set — only the two load-bearing global models that
      # publish to 120h AND have the most reliable Open-Meteo ingestion. icon /
      # mf / gem / aifs are OPTIONAL: a single upstream feed outage can't
      # truncate predictions because LightGBM handles the NaN slot natively
      # (same lenient policy precipitation has always used).
      #
      # 2026-06-01: replaced the old 5-required policy. Open-Meteo's GEM
      # (cmc_gem_gdps) ingestion stalled — frozen at 2026-05-26 — and because
      # gem was REQUIRED the row-drop gate silently killed every 72/96/120h
      # temperature row site-wide (nothing on the overview / charts beyond +2
      # days), worsening by a day each day. MF was a latent second offender
      # (caps ~72h). Requiring only gfs+ecmwf removes the whole class of
      # "one short-horizon / lapsed feed truncates all long leads".
      #
      # No perLeadOverrides: both required models carry data at every lead
      # including 96/120h (precip's 96/120 specs already rely on this), so the
      # old MF-dropping overrides are unnecessary.
      requiredModels: [gfs_seamless, ecmwf_ifs025]
      optionalModels: [icon_seamless, meteofrance_seamless, gem_seamless, ecmwf_aifs025_single]

    - target: temperature
      featureSet: rich
      # Same minimal-required policy as lean (see the note above for the
      # 2026-06-01 GEM-outage rationale). NOTE: dropping ukmo from required
      # widens the rich training window back to the lean floor (~2024-02),
      # because ukmo's Open-Meteo history only starts 2024-09 and previously
      # gated rich's rows. The first retrain after this change may trip the
      # RetrainGuard row-count band ONCE as the baseline resets to the wider
      # window; that's expected, not a regression.
      requiredModels: [gfs_seamless, ecmwf_ifs025]
      optionalModels: [icon_seamless, meteofrance_seamless, ukmo_seamless, gem_seamless, ecmwf_aifs025_single]

    # ---- Precipitation ----
    # Lenient policy: precip rows kept where ANY model has data — models often
    # disagree about whether an hour is wet at all, so all 5 (or 6 for rich) sit
    # in optional and the universal at-least-one check provides the floor.
    - target: precipitation
      featureSet: lean
      requiredModels: []
      optionalModels: [gfs_seamless, ecmwf_ifs025, icon_seamless, meteofrance_seamless, gem_seamless, ecmwf_aifs025_single, jma_seamless]
      perLeadOverrides:
        - lead: 96
          requiredModels: []
          optionalModels: [gfs_seamless, ecmwf_ifs025, icon_seamless, gem_seamless, ecmwf_aifs025_single, jma_seamless]
        - lead: 120
          requiredModels: []
          optionalModels: [gfs_seamless, ecmwf_ifs025, icon_seamless, gem_seamless, ecmwf_aifs025_single, jma_seamless]

    - target: precipitation
      featureSet: rich
      requiredModels: []
      optionalModels: [gfs_seamless, ecmwf_ifs025, icon_seamless, meteofrance_seamless, ukmo_seamless, gem_seamless, ecmwf_aifs025_single, jma_seamless]
      perLeadOverrides:
        - lead: 96
          requiredModels: []
          optionalModels: [gfs_seamless, ecmwf_ifs025, icon_seamless, ukmo_seamless, gem_seamless, ecmwf_aifs025_single, jma_seamless]
        - lead: 120
          requiredModels: []
          optionalModels: [gfs_seamless, ecmwf_ifs025, icon_seamless, ukmo_seamless, gem_seamless, ecmwf_aifs025_single, jma_seamless]

    # ---- Dry-window ----
    - target: dry_window
      featureSet: base
      requiredModels: []
      optionalModels: [gfs_seamless, ecmwf_ifs025, icon_seamless, meteofrance_seamless, gem_seamless, ecmwf_aifs025_single, jma_seamless]
      perLeadOverrides:
        - lead: 120
          requiredModels: []
          optionalModels: [gfs_seamless, ecmwf_ifs025, icon_seamless, gem_seamless, ecmwf_aifs025_single, jma_seamless]

    - target: dry_window
      featureSet: shape
      requiredModels: []
      optionalModels: [gfs_seamless, ecmwf_ifs025, icon_seamless, meteofrance_seamless, gem_seamless, ecmwf_aifs025_single, jma_seamless]
      perLeadOverrides:
        - lead: 120
          requiredModels: []
          optionalModels: [gfs_seamless, ecmwf_ifs025, icon_seamless, gem_seamless, ecmwf_aifs025_single, jma_seamless]

    # ---- Element blenders (single-variant) ----
    # 2026-06-05: gem_seamless demoted required→optional across EVERY element
    # blender below, mirroring the 2026-06-01 temperature fix. Open-Meteo's GEM
    # (cmc_gem_gdps) ingestion stalled — frozen at 2026-05-26 — and because gem
    # was REQUIRED here, the row-drop gate silently zeroed out the wind /
    # humidity / radiation / cloud / gust / wind_speed_lgb blenders from 06-02,
    # which in turn starved the feels-like / UTCI derivation (no element inputs →
    # no feels-like). GEM stays an OPTIONAL feature everywhere (LightGBM handles
    # the NaN slot natively), so a single upstream feed outage degrades the blend
    # gracefully instead of killing it. The cloud note below (GEM as a useful
    # bracketing corrector) is preserved — optional keeps GEM in the vector when
    # present; it just no longer drops the row when GEM is absent. wind_mvn
    # (direction, Python) already median-imputes missing NWPs, so it's untouched.
    #
    # Wind: 3 strict + GEM/UKMO optional (UKMO wind has intra-2024-09+ gaps).
    # MF excluded everywhere — Open-Meteo Previous Runs ships no MF wind data.
    # AIFS optional (data starts 2025-02-17; preserves training window).
    - target: wind
      featureSet: default
      requiredModels: [gfs_seamless, ecmwf_ifs025, icon_seamless]
      optionalModels: [gem_seamless, ukmo_seamless, ecmwf_aifs025_single]

    # Humidity: UKMO excluded entirely in legacy (CAST NULL stamp).
    # MF excluded at 48/72h (live API horizon ~36h). AIFS optional everywhere.
    - target: humidity
      featureSet: default
      requiredModels: [gfs_seamless, ecmwf_ifs025, icon_seamless, meteofrance_seamless]
      optionalModels: [gem_seamless, ecmwf_aifs025_single]
      perLeadOverrides:
        - lead: 48
          requiredModels: [gfs_seamless, ecmwf_ifs025, icon_seamless]
          optionalModels: [gem_seamless, ecmwf_aifs025_single]
        - lead: 72
          requiredModels: [gfs_seamless, ecmwf_ifs025, icon_seamless]
          optionalModels: [gem_seamless, ecmwf_aifs025_single]

    # Cloud: UKMO restored everywhere; MF dropped at 48/72h. AIFS optional.
    # 2026-05-04: tested dropping GEM (bias −23) + MF (bias +9.4) outright,
    # cloud MAE regressed +1.2% / 0% / +1.3% per lead. Heavily-biased inputs
    # function as bracketing correctors — the blender uses GEM's systematic
    # under-prediction as a regime signal rather than a value to read off.
    # Conclusion: leave GEM + lead-24h MF in. Don't repeat this experiment.
    # UKMO demoted required→optional 2026-06-09 (all leads): with no UKMO row-gate +
    # no training-window floor, cloud trains back to ~2024-02 and beats the old
    # UKMO-required/floored cloud by −1.6..−2.6% per lead (floor bake-off). UKMO still
    # contributes when present; optional also means cloud survives UKMO outages (cf. GEM).
    - target: cloud
      featureSet: default
      requiredModels: [gfs_seamless, ecmwf_ifs025, icon_seamless, meteofrance_seamless]
      optionalModels: [gem_seamless, ecmwf_aifs025_single, ukmo_seamless]
      perLeadOverrides:
        - lead: 48
          requiredModels: [gfs_seamless, ecmwf_ifs025, icon_seamless]
          optionalModels: [gem_seamless, ecmwf_aifs025_single, ukmo_seamless]
        - lead: 72
          requiredModels: [gfs_seamless, ecmwf_ifs025, icon_seamless]
          optionalModels: [gem_seamless, ecmwf_aifs025_single, ukmo_seamless]

    # Radiation: UKMO permanently absent (74% null at 24h, 100% at 48/72h).
    # MF dropped at 48/72h. AIFS optional everywhere.
    - target: radiation
      featureSet: default
      requiredModels: [gfs_seamless, ecmwf_ifs025, icon_seamless, meteofrance_seamless]
      optionalModels: [gem_seamless, ecmwf_aifs025_single]
      perLeadOverrides:
        - lead: 48
          requiredModels: [gfs_seamless, ecmwf_ifs025, icon_seamless]
          optionalModels: [gem_seamless, ecmwf_aifs025_single]
        - lead: 72
          requiredModels: [gfs_seamless, ecmwf_ifs025, icon_seamless]
          optionalModels: [gem_seamless, ecmwf_aifs025_single]

    # NOTE: the wind_speed_lgb blender spec lived here until 2026-06-10 —
    # the model moved to Python (Option B CQR cutover) and its NWP scope is
    # now pinned in WeatherProbabilistic's train_wind_speed_pi.py
    # (REQUIRED_MODELS gfs/ecmwf/icon/jma + optional gem/ukmo, mirroring
    # the spec it replaced).

    # Wind gust (2026-05-27): only 4 production NWPs publish gust on
    # Open-Meteo Previous Runs (audited). GFS / ICON / GEM required; UKMO
    # optional — UKMO gust starts 2024-09 (same UkmoCleanWindowStart used
    # by the wind blender). ECMWF / MF / JMA / AIFS publish no gust on
    # Previous Runs and are excluded entirely. AIFS gust isn't included
    # even as optional because Open-Meteo AIFS has 0 gust rows
    # (90,923 rows across 2025-2026, every one null). Archive NWPs that
    # could add ~6.5% MAE (gfs_ncep + MO Global + MO UKV) are parked as
    # a broader cross-blender question — see
    # project_gust_production_scope_2026-05-27.md.
    - target: wind_gust
      featureSet: default
      requiredModels: [gfs_seamless, icon_seamless]
      optionalModels: [gem_seamless, ukmo_seamless]

# Dry-window blender — local-time daytime allowed-window. Both labels (truth)
# and per-NWP feature aggregates (longest dry run, has-dry-window indicator,
# wet hour count, precip sum, envelope covariates, shape features) restrict
# their per-day scan to this window. Stored in local hours + IANA tz so DST
# doesn't slide the window against wall-clock walking time twice a year.
# Default: 09–18 Europe/London = the realistic outdoor-walking window at
# Bonehill Rocks year-round, in BST or GMT.
dryWindow:
  allowedWindow:
    startLocalHour: 9
    endLocalHour: 18
    tz: "Europe/London"
  # Per-station PAV calibration opt-in. Bellever's raw blender ran with
  # frequency bias 1.2–1.5 (over-predicts dry); PAV corrects this and
  # delivers Brier −4 to −11% on every (window × lead). Other stations
  # started near bias 1.0 — applying PAV there overfits the
  # ~125-row validation set and makes Brier WORSE by +5 to +25% on
  # average. Empirically validated 2026-04-29.
  calibrationStations:
    - "Bellever Dartmoor"

# Rock surface temperature + condensation (Force-Restore, Phase P1 — derived).
# GLOBAL DEFAULTS, Bonehill-calibrated; a location can override any subset
# (and gate itself off) via its own rockSurface: block — see sennen_cove +
# docs/SENNEN_ROCK_TEMP_PLAN.md S2. Granite knobs = the validated P0 spike's
# PARAMS (scripts/rock_temp_spike.py); these defaults match the spike so the
# module is correct even if this block is removed. mu_scale /
# tau_long_seconds / f_sky are the free knobs P2 on-site calibration (IR gun
# / logger) will fit. lw_cloud_k was GFS-DLWRF-calibrated 2026-06-04
# (1.0→0.54; removed a ~22 W/m² warm bias). greasy_margin_c: flag
# "potentially greasy" when the rock gets within this many °C of dew point
# (not just on a strict Ts ≤ Td crossing) — Harry 2026-06-05; lowered
# 3.0→2.0 on 2026-06-13 (Harry: 3°C too conservative for Bonehill amber).
rockSurface:
  albedo: 0.30
  epsRock: 0.95
  lambda: 3.0
  rho: 2650.0
  cpRock: 790.0
  tauDaySeconds: 86400.0
  tauLongSeconds: 86400.0
  fSky: 1.0
  # Representative direct-beam factor (whole-crag horizontal mode only — Bonehill):
  # the fraction of the DIRECT solar beam the rock actually catches. 1.0 = full
  # horizontal SW (today's behaviour). Lower it (~0.3-0.5) to damp the clear-sky
  # daytime peak — boulder self-shading + the steep climbing faces rarely catch
  # the full noon beam — WITHOUT assuming a compass aspect. IR-gun calibration
  # target (set from field readings, not guessed). Ignored in cliff-face mode.
  directBeamFactor: 1.0
  lwClearK: 1.0
  lwCloudK: 0.54
  muScale: 0.3
  substeps: 6
  spinupHours: 48
  greasyMarginC: 2.0
