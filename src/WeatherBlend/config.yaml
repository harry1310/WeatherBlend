# WeatherBlend configuration
#
# Location: Bonehill Rocks, Dartmoor
# A granite tor on the eastern edge of Dartmoor, at 393m elevation.
# Expect orographic precipitation enhancement, frequent low cloud/fog,
# and strong local wind effects that lowland stations will not capture well.

location:
  name: "bonehill_rocks"
  displayName: "Bonehill Rocks, Dartmoor"
  latitude: 50.5831
  longitude: -3.7931
  elevationMeters: 393

  # METAR truth sources. Exeter is nearest but lowland (~30km SE, ~30m elev).
  # Yeovilton is further but more frequent reports.
  # TODO: replace with Met Office DataHub station closer to the moor
  #       (e.g. Princetown, 414m) for precip training in phase 2.
  metar:
    primary: "EGTE"    # Exeter Airport
    fallback: "EGDY"   # RNAS Yeovilton

  # Environment Agency rainfall stations within ~15km of Bonehill Rocks, via the
  # EA Hydrology API (https://environment.data.gov.uk/hydrology). OGL v3, no auth.
  # 15-min tip totals; aggregate 4× for hourly. Bellever is closest moorland match;
  # Princetown is higher/wetter (orographic crosscheck); the one near Hexworthy
  # (EA labels it simply "Dartmoor") is the WSW fallback. `id` is the EA measure
  # prefix — for versioned stations it includes the wiskiID suffix (e.g. `_363307`).
  rainfall:
    stations:
      - id: "723a8fc4-908b-4430-91c7-9990be86540a_363307"
        name: "Bellever Dartmoor"
      - id: "f0676423-f697-4dec-8958-440f335cce9a"
        name: "Princetown"
      - id: "b69ee00c-aa73-49d0-bc62-ff4673094553"
        name: "Dartmoor nr Hexworthy"

# NWP models to collect via Open-Meteo.
# Open-Meteo exposes many models through one API with a consistent schema.
# See https://open-meteo.com/en/docs for the full list.
models:
  - id: "gfs_seamless"
    displayName: "NOAA GFS"
  - id: "ecmwf_ifs025"
    displayName: "ECMWF IFS 0.25°"
  - id: "icon_seamless"
    displayName: "DWD ICON"
  - id: "meteofrance_seamless"
    displayName: "Météo-France ARPEGE/AROME"
  - id: "ukmo_seamless"
    displayName: "UK Met Office"
  - id: "gem_seamless"
    displayName: "Environment Canada GEM"

# Variables to pull. Two lists because Open-Meteo's per-model forecast endpoint
# and the ERA5 archive endpoint expose slightly different sets — keeping them
# separate avoids spurious "variable not available" warnings on either side.
# Pull everything we might want now — backfilling later is painful.
#
# Radiation triplet (shortwave / direct / diffuse) lands on both lists because
# UTCI / feels-like modelling needs an MRT input. Direct + diffuse split is
# kept for future flexibility; shortwave alone is enough for a simple MRT.
variables:
  forecast:
    - temperature_2m
    - dew_point_2m
    - relative_humidity_2m
    - precipitation
    - precipitation_probability
    - rain
    - showers
    - snowfall
    - cloud_cover
    - cloud_cover_low
    - cloud_cover_mid
    - cloud_cover_high
    - wind_speed_10m
    - wind_direction_10m
    - wind_gusts_10m
    - surface_pressure
    - cape
    - visibility
    - shortwave_radiation
    - direct_radiation
    - diffuse_radiation
  era5:
    - temperature_2m
    - dew_point_2m
    - relative_humidity_2m
    - precipitation
    - rain
    - snowfall
    - cloud_cover
    - cloud_cover_low
    - cloud_cover_mid
    - cloud_cover_high
    - wind_speed_10m
    - wind_direction_10m
    - wind_gusts_10m
    - surface_pressure
    - visibility
    - shortwave_radiation
    - direct_radiation
    - diffuse_radiation

# Lead times (hours ahead) we care about for evaluation.
# Collection pulls the full forecast; these are the horizons we train & score on.
leadHours: [1, 3, 6, 12, 24, 36, 48, 72, 96, 120, 144, 168]

# How far ahead to pull each run.
forecastDays: 7

# Storage root - relative paths are resolved from the repo root.
# Layout:
#   forecasts/   NWP model predictions (live + historical-forecast API, same schema)
#   truth/era5/  Open-Meteo ERA5 reanalysis - training truth (gapless, quantitative)
#   truth/metar/ Station observations - verification truth (gappy, real obs)
storage:
  forecastsPath: "data/forecasts"
  observationsPath: "data/truth/metar"
  era5Path: "data/truth/era5"
  rainfallPath: "data/truth/rainfall"
  predictionsPath: "data/predictions"
  reportsPath: "data/reports"
  metOfficeObsPath: "data/truth/met_office_obs"

# Met Office DataHub benchmark capture.
# Global Spot forecasts are written into the standard forecasts tree under
# model=met_office_spot so existing compare/verify tooling picks them up for free.
# Land Observations go to metOfficeObsPath (rolling 48h window, dedup on observed time).
# Keys live outside the repo; env var wins, file is the fallback (same pattern as R2).
# Free tier: 360 calls/day per product; one collect cycle uses ~1 call per product.
metOffice:
  enabled: true
  spotModelTag: "met_office_spot"
  spotKeyEnvVar: "MET_OFFICE_SPOT_API_KEY"
  # Relative to cwd (repo root). Keys live one level above the repo, outside git.
  # Env var wins over file; CI uses env vars only — the file fallback is purely
  # for local-dev convenience so you don't have to export vars in every shell.
  spotKeyFile: "../MetOfficeSpotKey.txt"
  obsKeyEnvVar: "MET_OFFICE_OBS_API_KEY"
  obsKeyFile: "../MetOfficeObsKey.txt"
  # Land Observations is geohash-addressed (API v1.0): GET /nearest?lat=...&lon=...
  # returned gcj0z3 for Bonehill (lat=50.58, lon=-3.79 at 2dp). Pinned here so
  # cycles skip the /nearest lookup — the spec asks callers to cache it.
  obsGeohash: "gcj0z3"
  obsArea: "Devon"

# HTTP client settings.
http:
  userAgent: "WeatherBlend-PoC/0.1 (contact: you@example.com)"
  timeoutSeconds: 60
  retryCount: 3
