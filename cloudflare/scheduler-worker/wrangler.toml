# Cloudflare Worker that fires GitHub Actions workflows on a cron schedule.
# Replaces the unreliable GitHub-side `schedule:` trigger on collect.yml — see
# the README in this directory for the full rationale.
#
# `name` MUST match the Worker created in the Cloudflare dashboard so
# `wrangler deploy` updates the existing Worker instead of trying to create a
# new one and fighting over the secrets that already exist on it.

name = "weatherblend-scheduler"
main = "src/index.ts"
compatibility_date = "2025-04-01"

# Cron triggers. Cloudflare cron is in UTC, same as GitHub Actions. Each cron
# string MUST match a key in WORKFLOW_FOR_CRON in src/index.ts exactly — the
# worker uses event.cron to look up which workflow(s) to dispatch.
#
# Per the 2026-05-05 audit: ALL scheduling for this project lives here. Never
# put a `schedule:` block in a GitHub Actions workflow — GitHub-side cron has
# been documented as 15+ min late with occasionally missed runs. Reliability
# is the whole reason this Worker exists.
#
#   "45 2,8,14,20 * * *"  → collect.yml      Open-Meteo + METAR + EA rainfall + MO DataHub
#   "5 3,9,15,21 * * *"   → s3-collect.yml   Raw S3 exact-runtime cycles (GFS / IFS / AIFS /
#                                            MO Global / UKV / GEFS) for the 2d/3d blenders
#   "0 12 * * *"          → truth-refresh.yml + previous-runs-refresh.yml  (daily 12:00 UTC;
#                                            run concurrently — disjoint R2 prefixes,
#                                            data/truth/era5 vs data/forecasts)
#   "30 9 * * MON,THU"    → verify.yml       twice-weekly Mon + Thu 09:30 UTC
#                                            (Cloudflare cron uses 1=Sunday, not POSIX
#                                            0=Sunday — day names avoid the off-by-one trap)
#
# Only 4 crons — predict-4a and predict-and-render are NOT cron'd.
# They are chained off workflow_run completions in src/index.ts
# (handleWorkflowRun, Hops C and D):
#
#   HH:45    collect       (cron)
#      └─ on success ─► predict-4a   (WeatherProbabilistic; consumes
#                                     collect's Open-Meteo forecasts)
#   HH+1:05  s3-collect    (cron)
#      └─ on completion ─► predict-and-render     (consumes the exact-runtime
#                                                  cycles s3-collect just landed)
#
# Why chained, not cron'd: predict-and-render genuinely depends on s3-collect,
# and predict-4a depends on collect. Chaining runs each the moment its input
# is ready rather than guessing a fixed offset, and it frees a cron (Cloudflare
# free tier caps at 5). collect, s3-collect and predict-and-render also share
# the GitHub Actions `weatherblend-data` concurrency group
# (cancel-in-progress: false), so even under the old cron timing the render
# could never start mid-collect — the chain just makes that ordering explicit.
#
# s3-collect is at :05 (not :00) to give the collect→predict-4a chain
# run-room: collect finishes ~HH:50, 4a chains off it, and predict-and-render
# only fires once s3-collect (HH+1:05) completes — comfortably after 4a.
#
# Two more chains: the Sunday weekly retrain (Hops A/B -- the noon
# previous-runs-refresh, on a Sunday success, chains retrain-python ->
# retrain-blenders), and verify -> render-site (Hop E -- the site
# redraws after each Mon/Thu verify). See src/index.ts handleWorkflowRun
# for all five hops.
[triggers]
crons = [
  "45 2,8,14,20 * * *",
  "5 3,9,15,21 * * *",
  "0 12 * * *",
  "30 9 * * MON,THU",
  # Watchdog — hourly at HH:00. Two passes:
  #  (1) cron coverage: for every cron above, was a slot expected in
  #      (HH-1:00, HH:00] and did the GH workflow actually run?
  #      Recovers dropped Cloudflare cron ticks (free-tier delivery is
  #      best-effort; the 2026-05-27 15:05Z s3-collect miss).
  #  (2) chain coverage (CHAIN_EDGES in src/index.ts): for every webhook
  #      hop A-F, did the latest completed worker-dispatched upstream
  #      get its downstream? Recovers dropped workflow_run deliveries /
  #      swallowed hop dispatches (the 2026-06-10 15:26Z predict→3f drop
  #      that left the site on its 09:44Z render for 10 hours). Only the
  #      FIRST broken link in a chain is redispatched — its completion
  #      re-chains the rest through the normal hops.
  # Handled by runWatchdog in src/index.ts; intentionally NOT in
  # WORKFLOW_FOR_CRON because it dispatches conditionally per cron in
  # the registry, not a single workflow.
  #
  # NOTE: Cloudflare free tier caps a Worker at 5 cron triggers — this
  # is the 5th. Adding any further cron requires moving to paid or
  # consolidating an existing schedule.
  "0 * * * *",
]

# Variables (non-secret). GH_REPO is intentionally a plain var rather than a
# secret because it's not sensitive — repo owner/name is public on every
# Actions run. Keeping it here means the deploy pipeline can change which
# repo to dispatch into without touching the secret store. The workflow file
# isn't here any more — it's selected per-cron in the worker, see src/index.ts.
[vars]
GH_REPO = "harry1310/WeatherBlend"
GH_REF = "main"

# Secrets are NOT defined here — they're injected via `wrangler secret put`
# (or the dashboard) and live encrypted in Cloudflare's secret store. See
# README for the required secrets:
#   GH_APP_ID                 (App ID, plain integer string)
#   GH_APP_INSTALLATION_ID    (Installation ID, plain integer string)
#   GH_APP_PRIVATE_KEY        (PEM contents — PKCS#1 or PKCS#8, both handled)
#   GH_WEBHOOK_SECRET         (HMAC secret shared with the workflow_run webhooks)
