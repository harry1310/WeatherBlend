name: render-site

env:
  # rclone hang guard — every R2 transfer in this workflow inherits these.
  # A failed/stalled transfer retries hard and a dead connection times out
  # fast, instead of hanging silently to the job ceiling (a job timeout
  # surfaces as a `cancelled` run, easy to miss).
  RCLONE_TIMEOUT: 5m
  RCLONE_CONTIMEOUT: 1m
  RCLONE_LOW_LEVEL_RETRIES: "20"
  RCLONE_RETRIES: "5"

# Renders the static site from R2-backed parquet and deploys it to Cloudflare Pages.
#
# Dispatched by the weatherblend-scheduler Cloudflare Worker after each
# `verify` run (handleWorkflowRun Hop E) so the latest MAE/Brier/drift
# numbers surface on the site as soon as they're computed — the worker
# gates that on verify succeeding. Was a GitHub-native `on: workflow_run`
# trigger; moved to the worker 2026-05-22 so every workflow-to-workflow
# hop lives in one place.
#
# Phase 3 prereq (2026-05-26): the routine 6-hourly render is in the
# process of moving from the fused predict-and-render.yml to this
# workflow, chained off predict.yml's completion (handleWorkflowRun
# new Hop F). The flip is a separate scheduler-worker commit because
# wrangler-deploy needs validation before flipping production. Until
# then predict-and-render.yml still handles the routine 6-hourly
# render, and this workflow runs ONLY on Hop E + manual dispatch.
# See docs/RAINFALL_AMOUNT_3F_PLAN.md section 3 for the chain diagram.
on:
  workflow_dispatch:
    inputs:
      window_days:
        description: "How many days of predictions to include (table + charts)."
        required: false
        default: "30"
        type: string
      rolling_window_days:
        description: "Rolling-MAE window size for verification charts."
        required: false
        default: "14"
        type: string

# Cancel an in-flight render if a newer one is queued — the older render would be
# rendering stale data by the time it finished. Scoped to the site job only so it
# can't interrupt data-writing workflows that share the weatherblend-data group.
concurrency:
  group: weatherblend-site
  cancel-in-progress: true

jobs:
  render-and-deploy:
    # Sole trigger is workflow_dispatch now (Cloudflare worker Hop E, or
    # manual). The worker gates the verify-driven render on verify
    # succeeding, so no conclusion check is needed here.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: preview

      # Pulls every tree the RenderSiteCommand reads — the canonical list
      # lives in .github/actions/sync-render-inputs so render-site.yml and the
      # render step of predict-and-render.yml share it verbatim.
      - uses: ./.github/actions/sync-render-inputs
        with:
          bucket: ${{ secrets.R2_BUCKET }}
          access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint: ${{ secrets.R2_ENDPOINT }}

      - name: Build
        run: dotnet build src/WeatherBlend/WeatherBlend.csproj -c Release --nologo

      - name: Render site
        run: |
          WINDOW="${{ github.event.inputs.window_days }}"
          ROLLING="${{ github.event.inputs.rolling_window_days }}"
          ARGS="--output data/site"
          if [ -n "$WINDOW" ]; then ARGS="$ARGS --window-days $WINDOW"; fi
          if [ -n "$ROLLING" ]; then ARGS="$ARGS --rolling-window-days $ROLLING"; fi
          dotnet run --project src/WeatherBlend --no-build -c Release -- render-site $ARGS

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch main promotes to the production URL (weatherblend.pages.dev);
          # without it the deploy would only get a preview URL.
          command: pages deploy data/site --project-name weatherblend --branch main --commit-dirty=true

      - name: Upload logs as artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: render-site-logs-${{ github.run_id }}
          path: logs/
          retention-days: 5
          if-no-files-found: ignore
