name: render-site

# Renders the static site from R2-backed parquet and deploys it to Cloudflare Pages.
#
# Auto-trigger: fires after `verify` (weekly) so the latest MAE/Brier/drift
# numbers surface on the site as soon as they're computed. The predict→render
# auto-trigger was removed when scheduled prediction moved into the combined
# `predict-and-render.yml` workflow (which renders inline every 2 hours).
# Manual dispatch supported for one-off re-renders.
on:
  workflow_run:
    workflows: ["verify"]
    types: [completed]
  workflow_dispatch:
    inputs:
      window_days:
        description: "How many days of predictions to include (table + charts)."
        required: false
        default: "30"
        type: string
      rolling_window_days:
        description: "Rolling-MAE window size for verification charts."
        required: false
        default: "14"
        type: string

# Cancel an in-flight render if a newer one is queued — the older render would be
# rendering stale data by the time it finished. Scoped to the site job only so it
# can't interrupt data-writing workflows that share the weatherblend-data group.
concurrency:
  group: weatherblend-site
  cancel-in-progress: true

jobs:
  render-and-deploy:
    # Skip the auto-run if the triggering workflow failed — a failed predict means
    # today's predictions aren't on R2 yet, so re-rendering just redeploys yesterday's
    # site with a newer timestamp, which is misleading.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: preview

      # Pulls every tree the RenderSiteCommand reads — the canonical list
      # lives in .github/actions/sync-render-inputs so render-site.yml and the
      # render step of predict-and-render.yml share it verbatim.
      - uses: ./.github/actions/sync-render-inputs
        with:
          bucket: ${{ secrets.R2_BUCKET }}
          access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint: ${{ secrets.R2_ENDPOINT }}

      - name: Build
        run: dotnet build src/WeatherBlend/WeatherBlend.csproj -c Release --nologo

      - name: Render site
        run: |
          WINDOW="${{ github.event.inputs.window_days }}"
          ROLLING="${{ github.event.inputs.rolling_window_days }}"
          ARGS="--output data/site"
          if [ -n "$WINDOW" ]; then ARGS="$ARGS --window-days $WINDOW"; fi
          if [ -n "$ROLLING" ]; then ARGS="$ARGS --rolling-window-days $ROLLING"; fi
          dotnet run --project src/WeatherBlend --no-build -c Release -- render-site $ARGS

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch main promotes to the production URL (weatherblend.pages.dev);
          # without it the deploy would only get a preview URL.
          command: pages deploy data/site --project-name weatherblend --branch main --commit-dirty=true

      - name: Upload logs as artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: render-site-logs-${{ github.run_id }}
          path: logs/
          retention-days: 5
          if-no-files-found: ignore
