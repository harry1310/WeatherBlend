name: archive-backfill

env:
  # rclone hang guard — every R2 transfer in this workflow inherits these.
  # A failed/stalled transfer retries hard and a dead connection times out
  # fast, instead of hanging silently to the job ceiling (a job timeout
  # surfaces as a `cancelled` run, easy to miss).
  RCLONE_TIMEOUT: 5m
  RCLONE_CONTIMEOUT: 1m
  RCLONE_LOW_LEVEL_RETRIES: "20"
  RCLONE_RETRIES: "5"

# Manual-dispatch workflow for the rigorous-runtime archive backfills:
# GFS from NOAA S3, ECMWF IFS/AIFS from AWS Open Data. Each row stamped
# RunTimeSource = "exact" — exact cycle init time + lead from the file
# path, no API approximation. Lives separately from `backfill.yml` (which
# pulls Open-Meteo Previous Runs at "offset_day" granularity) because the
# wgrib2 install + per-cycle GRIB Range-fetch shape is different enough
# to keep the two workflows from sharing steps cleanly.
#
# Use cases:
#   * Sample run to verify a fresh parser (small date range, one cycle).
#   * Full historical backfill (multi-year, all cycles) — chunk by year
#     to keep individual runs under the 6h max-runtime cap.

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Archive source"
        required: true
        default: "ecmwf-ifs"
        type: choice
        options: [gfs, gefs, ecmwf-ifs, ecmwf-aifs]
      start:
        description: "Start cycle date (yyyy-MM-dd, UTC)"
        required: true
      end:
        description: "End cycle date (yyyy-MM-dd, UTC) — leave blank for yesterday"
        required: false
        default: ""
      cycles:
        description: "Comma-separated cycle hours (default 0,6,12,18 — all four)"
        required: false
        default: "0,6,12,18"

concurrency:
  # Per-(source, start-date) so every chunk is its own group → all chunks
  # run in parallel without queueing.
  #
  # Why we don't queue per-source: GitHub's concurrency model only keeps
  # ONE pending + ONE running per group; any third dispatch (or beyond)
  # gets silently cancelled. Mass-dispatching 9 chunks in a per-source
  # group meant chunks 2-8 vanished. Each chunk writes to disjoint
  # R2 date partitions so parallel rclone copies are safe.
  #
  # Backfills are still off the shared `weatherblend-data` group so
  # they don't block the 3-hourly collect or daily predict/verify.
  group: archive-backfill-${{ inputs.source }}-${{ inputs.start }}
  cancel-in-progress: false

jobs:
  archive-backfill:
    runs-on: ubuntu-latest
    # 6h cap. Sample runs (one week, one stream) finish in <30 min on a
    # standard runner; multi-year full backfills should be chunked across
    # multiple invocations.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: preview

      - name: Install wgrib2 (via conda-forge)
        # Ubuntu 22.04+ apt repos don't carry wgrib2. conda-forge has a
        # well-maintained prebuilt — micromamba is the lightest installer
        # that pulls it down without dragging in full Anaconda. Adds ~30s
        # to job setup vs the failed 2s apt path. Path of resulting binary
        # exposed via $WEATHERBLEND_WGRIB2 so the C# Wgrib2 wrapper finds
        # it without hardcoding /usr/bin/wgrib2.
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: wgrib2-env
          create-args: >-
            -c conda-forge
            wgrib2
          cache-environment: true
          init-shell: bash

      - name: Resolve wgrib2 path
        shell: bash -el {0}
        run: |
          which wgrib2
          # wgrib2 -version exits non-zero on some builds (it prints to stderr
          # and returns 8 even on a successful version dump). bash -e treats
          # that as fatal, so guard with `|| true` — `which` already proved
          # the binary's there.
          wgrib2 -version || true
          echo "WEATHERBLEND_WGRIB2=$(which wgrib2)" >> "$GITHUB_ENV"

      # rclone install + R2 remote config via the shared composite action
      # (.github/actions/setup-r2) — same call shape as verify.yml. The
      # workflow-level RCLONE_* hang-guard env still applies: workflow env
      # is inherited by composite-action steps and by every rclone
      # invocation below.
      - uses: ./.github/actions/setup-r2
        with:
          access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint: ${{ secrets.R2_ENDPOINT }}

      - name: Build
        run: dotnet build src/WeatherBlend/WeatherBlend.csproj -c Release --nologo

      - name: Run backfill
        run: |
          END_ARG=""
          if [ -n "${{ inputs.end }}" ]; then
            END_ARG="--end ${{ inputs.end }}"
          fi

          case "${{ inputs.source }}" in
            gfs)
              dotnet run --project src/WeatherBlend --no-build -c Release -- \
                gfs-backfill --start ${{ inputs.start }} $END_ARG \
                --cycles ${{ inputs.cycles }}
              ;;
            gefs)
              dotnet run --project src/WeatherBlend --no-build -c Release -- \
                gefs-backfill --start ${{ inputs.start }} $END_ARG \
                --cycles ${{ inputs.cycles }}
              ;;
            ecmwf-ifs)
              dotnet run --project src/WeatherBlend --no-build -c Release -- \
                ecmwf-backfill --stream ifs --start ${{ inputs.start }} $END_ARG \
                --cycles ${{ inputs.cycles }}
              ;;
            ecmwf-aifs)
              dotnet run --project src/WeatherBlend --no-build -c Release -- \
                ecmwf-backfill --stream aifs --start ${{ inputs.start }} $END_ARG \
                --cycles ${{ inputs.cycles }}
              ;;
            *)
              echo "::error::Unknown source: ${{ inputs.source }}"
              exit 2
              ;;
          esac

      - name: Push parquet to R2
        # copy (not sync) — additive only. Each cycle goes to its own date+run
        # partition so we never overwrite existing rows with this run.
        if: always()
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [ -d ./data/forecasts ]; then
            rclone copy ./data/forecasts "r2:${R2_BUCKET}/data/forecasts" --fast-list --transfers 16 --checkers 32 --progress
          else
            echo "::warning::No data/forecasts directory — backfill produced no rows"
          fi

      - name: Upload logs as artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: archive-backfill-${{ inputs.source }}-${{ github.run_id }}
          path: logs/
          retention-days: 5
          if-no-files-found: ignore
