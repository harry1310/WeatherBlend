name: predict

# 4× daily: run the blender against the latest collected forecasts, push predictions to R2.
# 02:45, 08:45, 14:45, 20:45 UTC — 30 min after each `collect` cron (:15) so predict picks
# up the NWP run that collect just pushed. The `weatherblend-data` concurrency group
# serialises against any in-flight collect, so predict never races a mid-flight push.
# Each run produces 3 rows (lead 24/48/72) anchored to UtcNow truncated to top-of-hour.
on:
  schedule:
    - cron: "45 2,8,14,20 * * *"
  workflow_dispatch:
    inputs:
      for_date:
        description: "Retroactive fill (yyyy-MM-dd). Leave blank for live run."
        required: false
        type: string

concurrency:
  group: weatherblend-data
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: preview

      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Configure rclone for R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = ${R2_ENDPOINT}
          acl = private
          EOF

      - name: Pull model artefacts, forecasts + existing predictions from R2
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          # Blender artefacts — predict can't run without the per-lead zips + MANIFEST.
          mkdir -p data/models
          rclone copy "r2:${R2_BUCKET}/data/models" ./data/models --fast-list --transfers 16 --checkers 32 --progress

          # Forecasts — produced by the `collect` workflow on its own cron (:15),
          # consumed here 30 min later. Concurrency group `weatherblend-data` guarantees
          # predict queues behind any still-running collect, so the pull sees the pushed
          # state. We no longer re-run collect inside this workflow.
          mkdir -p data/forecasts
          rclone copy "r2:${R2_BUCKET}/data/forecasts" ./data/forecasts --fast-list --transfers 16 --checkers 32 --progress

          # Existing predictions for today's partition (read-modify-write dedupe
          # on PredictCommand side needs the current file if it exists). Pulling
          # only the predictions subtree keeps the copy small.
          mkdir -p data/predictions
          rclone copy "r2:${R2_BUCKET}/data/predictions" ./data/predictions --fast-list --transfers 16 --checkers 32 --progress

      - name: Build
        run: dotnet build src/WeatherBlend/WeatherBlend.csproj -c Release --nologo

      - name: Predict temperature
        run: |
          FOR_DATE="${{ github.event.inputs.for_date }}"
          if [ -n "$FOR_DATE" ]; then
            dotnet run --project src/WeatherBlend --no-build -c Release -- predict --target temperature --for-date "$FOR_DATE"
          else
            dotnet run --project src/WeatherBlend --no-build -c Release -- predict --target temperature
          fi

      - name: Predict precipitation
        # Runs per-station P(wet) for every station in the precipitation manifest.
        # Skipped gracefully (exit 2) when no precipitation blender is present yet —
        # e.g. on a fresh deployment before the first phase 3a train.
        run: |
          FOR_DATE="${{ github.event.inputs.for_date }}"
          if [ -n "$FOR_DATE" ]; then
            dotnet run --project src/WeatherBlend --no-build -c Release -- predict --target precipitation --truth-station all --for-date "$FOR_DATE" || code=$?
          else
            dotnet run --project src/WeatherBlend --no-build -c Release -- predict --target precipitation --truth-station all || code=$?
          fi
          # Exit 2 = no precip model yet; exit 3 = no forecast rows for targets.
          # Neither is fatal for the overall predict job.
          if [ -n "${code:-}" ] && [ "$code" != "2" ] && [ "$code" != "3" ]; then exit "$code"; fi

      - name: Predict dry-window
        # Runs P(∃ dry window ≥ N hours in target day) for every (station, window)
        # in the dry_window manifest (3/4/6h × 24/48/72h leads × Bellever + Princetown).
        # Same exit-code semantics as precipitation: 2 = no dry-window model yet,
        # 3 = no forecast rows for targets — both non-fatal for the overall predict job.
        run: |
          FOR_DATE="${{ github.event.inputs.for_date }}"
          if [ -n "$FOR_DATE" ]; then
            dotnet run --project src/WeatherBlend --no-build -c Release -- predict --target dry-window --truth-station all --window all --for-date "$FOR_DATE" || code=$?
          else
            dotnet run --project src/WeatherBlend --no-build -c Release -- predict --target dry-window --truth-station all --window all || code=$?
          fi
          if [ -n "${code:-}" ] && [ "$code" != "2" ] && [ "$code" != "3" ]; then exit "$code"; fi

      - name: Push predictions to R2
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          # copy (not sync) — additive only, never deletes remote files. Forecasts
          # are no longer modified here (the collect workflow owns that subtree).
          rclone copy ./data/predictions "r2:${R2_BUCKET}/data/predictions" --fast-list --transfers 16 --checkers 32 --progress

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: predict-logs-${{ github.run_id }}
          path: logs/
          retention-days: 14
          if-no-files-found: ignore
