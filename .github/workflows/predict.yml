name: predict

# Manual-dispatch only. The scheduled predict cycle runs as part of the
# combined `predict-and-render.yml` workflow; running predict on its own
# cron would double the work. This file is preserved for one-off manual
# reruns (e.g. retroactive --for-date fills, or re-running predict after a
# model artefact bump without immediately re-rendering the site).
#
# Note: this workflow no longer triggers `render-site` on completion — the
# auto-trigger was scoped to predict's old scheduled cadence and is now
# owned by predict-and-render. If you want the manual run to also refresh
# the site, dispatch render-site manually after this finishes.
#
# All predict targets + their order + their soft-skip codes live in
# `.github/actions/predict-all`, shared verbatim with predict-and-render.
on:
  workflow_dispatch:
    inputs:
      for_date:
        description: "Retroactive fill (yyyy-MM-dd). Leave blank for live run."
        required: false
        type: string

concurrency:
  group: weatherblend-data
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: preview

      # All R2 trees the predict targets read come via the shared composite
      # — same list predict-and-render uses, no risk of drift. The composite
      # also installs + configures rclone so a subsequent push back to R2
      # works without re-setting credentials.
      - uses: ./.github/actions/sync-render-inputs
        with:
          bucket: ${{ secrets.R2_BUCKET }}
          access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint: ${{ secrets.R2_ENDPOINT }}

      - name: Build
        run: dotnet build src/WeatherBlend/WeatherBlend.csproj -c Release --nologo

      # Every predict target in dependency order — temp / precip / dry-window /
      # elements / feels-like / start-hour. Soft-skip codes per target are
      # documented in the composite. Was previously inlined here in 6+ duplicated
      # steps that drifted (start-hour was missing) — now shared with the
      # scheduled predict-and-render workflow.
      - uses: ./.github/actions/predict-all
        with:
          for_date: ${{ github.event.inputs.for_date }}

      - name: Push predictions to R2
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        # copy (not sync) — additive only, never deletes remote files. Forecasts
        # are no longer modified here (the collect workflow owns that subtree).
        run: |
          rclone copy ./data/predictions "r2:${R2_BUCKET}/data/predictions" --fast-list --transfers 16 --checkers 32 --progress

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: predict-logs-${{ github.run_id }}
          path: logs/
          retention-days: 14
          if-no-files-found: ignore
