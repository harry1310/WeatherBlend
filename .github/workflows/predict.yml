name: predict

env:
  # rclone hang guard — every R2 transfer in this workflow inherits these.
  # A failed/stalled transfer retries hard and a dead connection times out
  # fast, instead of hanging silently to the job ceiling (a job timeout
  # surfaces as a `cancelled` run, easy to miss).
  RCLONE_TIMEOUT: 5m
  RCLONE_CONTIMEOUT: 1m
  RCLONE_LOW_LEVEL_RETRIES: "20"
  RCLONE_RETRIES: "5"

# Predict-only production workflow.
#
# Phase 3 prereq (2026-05-26): split predict-and-render.yml's fused
# predict + render so that the future Hop E (predict-3f, in
# WeatherProbabilistic) can sandwich between predict (this workflow)
# and render-site (render-site.yml) — giving the rainfall_amount card
# same-cycle site freshness rather than the one-cycle lag 4a accepts
# today. See docs/RAINFALL_AMOUNT_3F_PLAN.md section 3 for the chain
# diagram + decision rationale.
#
# The Cloudflare scheduler-worker (cloudflare/scheduler-worker/src/index.ts)
# still chains s3-collect.completed -> predict-and-render.yml today;
# this workflow is the DROP-IN replacement, ready to take over once
# the worker's handleWorkflowRun Hop D is flipped (separate commit;
# wrangler-deploy gate makes the worker change risky to bundle here).
# Manual dispatch supported in the meantime for one-off reruns (e.g.
# retroactive --for-date fills, or refreshing predictions without a
# render).
#
# All predict targets + their order + their soft-skip codes live in
# `.github/actions/predict-all`, shared verbatim with predict-and-render
# until that file is retired.
on:
  workflow_dispatch:
    inputs:
      for_date:
        description: "Retroactive fill (yyyy-MM-dd). Leave blank for live run."
        required: false
        type: string

concurrency:
  group: weatherblend-data
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    # 25 min — predict-all takes ~5-8 min across all targets, plus the
    # 4b synthesis (~30s), plus the R2 push (~1-2 min for incremental).
    # Matches predict-and-render's predict-side budget; the 5 min cut
    # is the render+deploy slice that now lives in render-site.yml.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: preview

      # All R2 trees the predict targets read come via the shared composite
      # — same list predict-and-render + render-site use, no risk of drift.
      # The composite also installs + configures rclone so the push back to
      # R2 below works without re-setting credentials.
      - uses: ./.github/actions/sync-render-inputs
        with:
          bucket: ${{ secrets.R2_BUCKET }}
          access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint: ${{ secrets.R2_ENDPOINT }}

      - name: Build
        run: dotnet build src/WeatherBlend/WeatherBlend.csproj -c Release --nologo

      # Every predict target in dependency order — temp / precip / dry-window /
      # elements / feels-like. Soft-skip codes per target are documented in
      # the composite. Shared verbatim with predict-and-render.yml until that
      # file retires.
      - uses: ./.github/actions/predict-all
        with:
          for_date: ${{ github.event.inputs.for_date }}

      # Phase 4b synthesis — 2-way arithmetic mean of phase 4a (BART) and
      # phase 3o (rich+oro) P(wet). Mirrors the step in predict-and-render.yml.
      # Exit code semantics (per-station soft-skip handled inside the
      # command):
      #   0 — at least one station wrote 4b rows.
      #   2 — no precipitation stations configured (config bug) — FATAL.
      #   3 — every station fell through (no 4b manifest entry AND no
      #       4a/3o match anywhere). Expected immediately after a fresh
      #       deploy until both 4a (WP-side cron) and 3o (Sunday auto-
      #       retrain) have run at least once.
      - name: Synthesise Phase 4b (2-way mean of 4a + 3o)
        run: |
          code=0
          dotnet run --project src/WeatherBlend --no-build -c Release -- phase4b-predict || code=$?
          if [ "$code" != "0" ] && [ "$code" != "3" ]; then exit "$code"; fi

      - name: Push predictions to R2
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        # copy (not sync) — additive only, never deletes remote files. Forecasts
        # are no longer modified here (the collect workflow owns that subtree).
        # Includes the freshly-synthesised 4b parquet from the step above.
        run: |
          rclone copy ./data/predictions "r2:${R2_BUCKET}/data/predictions" --fast-list --transfers 16 --checkers 32 --progress

      - name: Upload logs as artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: predict-logs-${{ github.run_id }}
          path: logs/
          retention-days: 5
          if-no-files-found: ignore
