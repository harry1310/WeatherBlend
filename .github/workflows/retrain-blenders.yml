name: retrain-blenders

# Phase 2 of AUTO_RETRAIN_PLAN.md — .NET-side retrain workflow.
# Mirror of WeatherProbabilistic's retrain-python.yml: same trigger
# shape (repository_dispatch from Sunday previous-runs-refresh +
# manual workflow_dispatch), same "phases=all" expansion driven by
# Config/phases.yaml impl=dotnet entries, same per-phase opt-in via
# the comma-separated phases input.
#
# Each phase runs as its own step with continue-on-error: true so
# a single guard failure on one phase doesn't cascade and skip the
# rest of the sweep. The trainers themselves carry the RetrainGuard
# (slice 1c) which writes training_summary.json on pass and bails
# with exit 4 on fail; this workflow's job-level success is gated
# on whether ANY step exited non-zero (final aggregator step).
#
# Cost ballpark on ubuntu-latest (4 vCPU):
#   - all phases sequentially: ~30-60 min total
#   - Per-phase wall: 2b/2c/2d/3a/3c/3d ~3-5 min each;
#     3b ~5-8 min (per-station per-window); 3g/3j/3n/3s ~1-3 min
#     each (MC mints, no LightGBM fit); element 4 × ~2 min.
#
# Adding a new .NET phase (e.g. 2e):
#   1. Add to Config/phases.yaml with role=challenger, impl=dotnet
#   2. Add a `Train 2e` step here mirroring the existing pattern
#   3. Add a run_2e flag emit in "Decide which phases to run"
# (Same one-place-rule applies: phases.yaml drives the "all"
# expansion + input validation; per-phase steps are unavoidable
# because each phase has its own --feature-set / --target args.)

on:
  # Sunday auto-trigger from previous-runs-refresh.yml. Same event
  # type as retrain-python's listener so a single Sunday gate fires
  # both retrains in parallel (different repos, no shared lock,
  # disjoint R2 prefixes).
  repository_dispatch:
    types: [retrain]
  workflow_dispatch:
    inputs:
      phases:
        description: "Comma-separated phases to retrain. 'all' = every impl=dotnet phase in Config/phases.yaml. Examples: '2d', '3a,3c'."
        required: false
        default: "all"
        type: string
      force:
        description: "Run regardless of trigger source (manual override). Default true."
        required: false
        default: true
        type: boolean

concurrency:
  # Distinct group from previous-runs-refresh / collect / backfill so
  # the heavy-data writers don't queue against retrain. Different R2
  # paths anyway (data/models/ vs data/forecasts/).
  group: weatherblend-retrain-${{ inputs.phases }}
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    # 120 min ceiling PER LOCATION job. Core sweep fits in 30-60 min; the
    # precipitation replay regen for the dry-window MC phases adds ~15-25 min,
    # plus padding for a slow R2 pull or runner cold-start.
    timeout-minutes: 120
    strategy:
      # One job per location. SERIAL (max-parallel: 1) is load-bearing: every
      # job pushes the shared data/models/MANIFEST.json, so a parallel job 2
      # would overwrite job 1's just-pushed manifest. Serial means job 2
      # re-pulls the manifest job 1 wrote, then merges its own entries in.
      max-parallel: 1
      # A Membury failure must not cancel the Bonehill job, or vice versa.
      fail-fast: false
      matrix:
        location: [bonehill_rocks, membury_devon]
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to proceed
        id: gate
        run: |
          EVENT="${{ github.event_name }}"
          if [ "$EVENT" = "repository_dispatch" ]; then
            echo "Triggered via repository_dispatch (Sunday auto-trigger from previous-runs-refresh) — proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "Manual dispatch with force=true — proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::workflow_dispatch with force=false — exiting cleanly (no training)."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-dotnet@v4
        if: steps.gate.outputs.proceed == 'true'
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: preview

      - name: Install rclone
        if: steps.gate.outputs.proceed == 'true'
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Configure rclone for R2
        if: steps.gate.outputs.proceed == 'true'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = ${R2_ENDPOINT}
          acl = private
          EOF

      - name: Decide which phases to run
        # phases.yaml is the single source of truth for which models run for
        # which locations. For each impl=dotnet phase this reads the optional
        # `locations:` filter (absent = every location) and emits a run_<id>
        # flag that is true only when the phase was requested AND the matrix
        # location admits it. Every train step gates purely on its run_<id>,
        # so a Bonehill-only phase auto-skips the Membury job — no location
        # string is hardcoded anywhere in this workflow.
        id: phases
        if: steps.gate.outputs.proceed == 'true'
        env:
          PHASES_DISPATCH: ${{ inputs.phases }}
          PHASES_PAYLOAD: ${{ github.event.client_payload.phases }}
          MATRIX_LOCATION: ${{ matrix.location }}
        run: |
          PHASES_YAML=src/WeatherBlend/Config/phases.yaml
          # One "id|loc1,loc2" row per impl=dotnet phase (empty = all locations).
          mapfile -t PHASE_ROWS < <(yq -r '
            .targets | to_entries[].value.phases[]
            | select(.impl == "dotnet")
            | .id + "|" + ((.locations // []) | join(","))
          ' "$PHASES_YAML")
          DOTNET_PHASES=$(printf '%s\n' "${PHASE_ROWS[@]}" | cut -d'|' -f1 | paste -sd, -)
          echo "impl=dotnet phases from phases.yaml: $DOTNET_PHASES"
          echo "Matrix location: $MATRIX_LOCATION"

          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            INPUT="${PHASES_PAYLOAD:-all}"
          else
            INPUT="${PHASES_DISPATCH:-all}"
          fi
          if [ "$INPUT" = "all" ]; then INPUT="$DOTNET_PHASES"; fi
          echo "Requested phase list: $INPUT"

          # Validate the request against phases.yaml — typo / missing-from-yaml
          # catches a pre-emptive phase before it's actually registered.
          IFS=',' read -ra REQUESTED <<< "$INPUT"
          IFS=',' read -ra KNOWN <<< "$DOTNET_PHASES"
          for p in "${REQUESTED[@]}"; do
            found=false
            for k in "${KNOWN[@]}"; do
              if [ "$p" = "$k" ]; then found=true; break; fi
            done
            if [ "$found" = "false" ]; then
              echo "::error::Phase '$p' is not in phases.yaml's impl=dotnet list (have: $DOTNET_PHASES). Add it to phases.yaml first."
              exit 1
            fi
          done

          # run_<id> = requested AND admitted by this matrix location.
          for row in "${PHASE_ROWS[@]}"; do
            id="${row%%|*}"
            locs="${row#*|}"
            requested=false
            case ",$INPUT," in *",${id},"*) requested=true ;; esac
            applies=false
            if [ -z "$locs" ]; then
              applies=true
            else
              case ",$locs," in *",${MATRIX_LOCATION},"*) applies=true ;; esac
            fi
            run=false
            if [ "$requested" = "true" ] && [ "$applies" = "true" ]; then run=true; fi
            echo "run_${id}=${run}" >> "$GITHUB_OUTPUT"
            echo "  ${id}: requested=${requested} applies(${MATRIX_LOCATION})=${applies} -> run_${id}=${run}"
          done

      - name: Pull data trees from R2
        if: steps.gate.outputs.proceed == 'true'
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          MATRIX_LOCATION: ${{ matrix.location }}
        run: |
          # Forecasts — the WHOLE per-location tree (every model= dir), not a
          # hardcoded model list. The Open-Meteo seamless models feed the
          # offset_day blenders; the raw S3 cycle models (gfs_ncep,
          # ecmwf_ifs_oper, met_office_ukv, …) feed the exact-runtime 2d/3d
          # blenders. A hardcoded 8-model list silently starved 2d/3d of
          # input (0 rows) on the first CI retrain — pull everything instead.
          # This matrix job trains one location, so pull only its tree.
          mkdir -p "data/forecasts/location=$MATRIX_LOCATION"
          rclone copy "r2:${R2_BUCKET}/data/forecasts/location=$MATRIX_LOCATION" \
            "data/forecasts/location=$MATRIX_LOCATION" \
            --fast-list --transfers 16 --checkers 32 || true
          # ERA5 truth (training) — this location.
          mkdir -p "data/truth/era5/location=$MATRIX_LOCATION"
          rclone copy "r2:${R2_BUCKET}/data/truth/era5/location=$MATRIX_LOCATION" \
            "data/truth/era5/location=$MATRIX_LOCATION" \
            --fast-list --transfers 16 --checkers 32 || true
          # METAR truth (verify) + EA rainfall truth (precip + dry-window).
          mkdir -p data/truth/metar
          rclone copy "r2:${R2_BUCKET}/data/truth/metar" data/truth/metar \
            --fast-list --transfers 16 --checkers 32 || true
          mkdir -p data/truth/rainfall
          rclone copy "r2:${R2_BUCKET}/data/truth/rainfall" data/truth/rainfall \
            --fast-list --transfers 16 --checkers 32 || true
          # Existing models tree (RetrainGuard reads previous summaries).
          mkdir -p data/models
          rclone copy "r2:${R2_BUCKET}/data/models" data/models \
            --fast-list --transfers 16 --checkers 32 || true

      - name: Build
        if: steps.gate.outputs.proceed == 'true'
        run: dotnet build src/WeatherBlend/WeatherBlend.csproj -c Release --nologo

      # ---- per-phase train steps ----------------------------------------
      # continue-on-error so a guard failure on one phase doesn't cascade.
      # Each step's exit code is captured; the aggregator at the end
      # decides the workflow's overall outcome.

      - name: Train 2b (temperature lean)
        # One step per matrix location. The bundle lands under
        # data/models/temperature/{location}/v.../ (Stations-keyed manifest);
        # RetrainGuard reads the previous summary on the same per-station
        # path, so locations don't cross-drift.
        id: train_2b
        if: steps.gate.outputs.proceed == 'true' && steps.phases.outputs.run_2b == 'true'
        continue-on-error: true
        run: |
          dotnet run --project src/WeatherBlend --no-build -c Release -- \
            train --target temperature --location ${{ matrix.location }}

      - name: Train 2c (temperature rich)
        id: train_2c
        if: steps.gate.outputs.proceed == 'true' && steps.phases.outputs.run_2c == 'true'
        continue-on-error: true
        run: |
          dotnet run --project src/WeatherBlend --no-build -c Release -- \
            train --target temperature --feature-set rich --location ${{ matrix.location }}

      - name: Train 2d (temperature exact-runtime, leads 12/24/48)
        # 2d is a SHORT-lead exact-runtime phase: its strict UKV picker
        # only resolves cycles up to ~T+54h (0/6/12/18Z cycles cap there),
        # so leads 72/96/120 throw "UKV strict picks not defined". They're
        # also pointless — 2b owns the long leads, 2d is champion at 12h.
        # The first CI retrain (2026-05-17) exposed an old 12,24,48,72 +
        # 96,120 config that always failed; trimmed to what the picker
        # supports. {12,24,48} all train cleanly.
        id: train_2d_short
        if: steps.gate.outputs.proceed == 'true' && steps.phases.outputs.run_2d == 'true'
        continue-on-error: true
        run: |
          dotnet run --project src/WeatherBlend --no-build -c Release -- \
            train --target temperature --feature-set exact --leads 12,24,48

      - name: Train 3a (precipitation lean)
        # 3a is one-station-per-call (unlike rich 3c/3d/3e which auto-iterate
        # every station of the location), so loop this location's rainfall
        # gauges via --station. The station list is read from config.yaml —
        # no hardcoded station list in the workflow.
        id: train_3a
        if: steps.gate.outputs.proceed == 'true' && steps.phases.outputs.run_3a == 'true'
        continue-on-error: true
        env:
          MATRIX_LOCATION: ${{ matrix.location }}
        run: |
          STATIONS=$(yq -r ".locations[] | select(.name == \"$MATRIX_LOCATION\") | .rainfall.stations[].name" \
            src/WeatherBlend/config.yaml)
          echo "3a stations for $MATRIX_LOCATION:"
          echo "$STATIONS"
          while IFS= read -r s; do
            [ -z "$s" ] && continue
            echo "=== 3a station: $s ==="
            dotnet run --project src/WeatherBlend --no-build -c Release -- \
              train --target precipitation --location "$MATRIX_LOCATION" --station "$s"
          done <<< "$STATIONS"

      - name: Train 3c (precipitation rich)
        # 3c auto-iterates all stations of the given location — one call
        # trains every gauge for the matrix location.
        id: train_3c
        if: steps.gate.outputs.proceed == 'true' && steps.phases.outputs.run_3c == 'true'
        continue-on-error: true
        run: |
          dotnet run --project src/WeatherBlend --no-build -c Release -- \
            train --target precipitation --feature-set rich --location ${{ matrix.location }}

      - name: Train 3e (precipitation MLP)
        # Phase 3e is a TorchSharp MLP on the same 59-feature rich set as
        # 3c — head-to-head comparable, just a different model family.
        # Dispatched via `--feature-set mlp` (see TempTrainCommand's
        # precipitation switch). Bonehill-only for now; Membury 3e waits
        # for the Phase B fanout.
        id: train_3e
        if: steps.gate.outputs.proceed == 'true' && steps.phases.outputs.run_3e == 'true'
        continue-on-error: true
        run: |
          dotnet run --project src/WeatherBlend --no-build -c Release -- \
            train --target precipitation --feature-set mlp

      - name: Train 3d (precipitation exact-runtime, leads 12/24/48/72)
        # 3d is a SHORT-lead exact-runtime phase. Its averaging UKV picker
        # resolves up to 72h but throws "UKV averaging picks not defined"
        # at 96h+ — and 3a owns the long leads anyway (3d is champion at
        # 12h). The first CI retrain (2026-05-17) exposed an old long-leads
        # 96,120 step that always failed; removed. {12,24,48,72} all train.
        id: train_3d_short
        if: steps.gate.outputs.proceed == 'true' && steps.phases.outputs.run_3d == 'true'
        continue-on-error: true
        run: |
          dotnet run --project src/WeatherBlend --no-build -c Release -- \
            train --target precipitation --feature-set exact --leads 12,24,48,72

      - name: Train 3b (dry-window)
        id: train_3b
        if: steps.gate.outputs.proceed == 'true' && steps.phases.outputs.run_3b == 'true'
        continue-on-error: true
        run: |
          dotnet run --project src/WeatherBlend --no-build -c Release -- \
            train --target dry-window

      # 3g / 3j / 3n / 3s are parameter-free MC over precipitation hourly
      # P(wet). They TRAIN by reading a replay parquet of the bound 3a / 3e
      # champion under data/predictions/precipitation_replay/. That tree is
      # neither pulled from R2 nor a by-product of 3a/3e training, so without
      # this step LoadReplayHourly throws on the missing file and every MC
      # phase fails. Regenerate it here — after 3a/3e retrain, before the MC
      # phases — for the current 3a champion (feeds 3g/3j/3n) and the latest
      # phase3e in Active (feeds 3s), per dry-window station. Each replay is
      # made non-fatal so one station's miss only skips that cell.
      - name: Generate precipitation replay for dry-window MC phases
        id: precip_replay
        if: steps.gate.outputs.proceed == 'true' && (steps.phases.outputs.run_3g == 'true' || steps.phases.outputs.run_3j == 'true' || steps.phases.outputs.run_3n == 'true' || steps.phases.outputs.run_3s == 'true')
        continue-on-error: true
        run: |
          MANIFEST=data/models/precipitation/MANIFEST.json
          for slug in ea_bellever_dartmoor ea_bovey_tracey ea_dartmoor_nr_hexworthy; do
            # 3a champion replay — feeds 3g / 3j / 3n.
            dotnet run --project src/WeatherBlend --no-build -c Release -- \
              precip-replay --truth-station "$slug" --model-version current --leads 24,48,72 \
              || echo "::warning::3a replay failed for $slug — 3g/3j/3n may skip it."
            # Latest phase3e in Active — feeds 3s.
            v3e=$(jq -r --arg s "$slug" \
              '.Stations[$s].Active | map(select(contains("phase3e"))) | sort | last // ""' \
              "$MANIFEST")
            if [ -n "$v3e" ]; then
              dotnet run --project src/WeatherBlend --no-build -c Release -- \
                precip-replay --truth-station "$slug" --model-version "$v3e" --leads 24,48,72 \
                || echo "::warning::3e replay failed for $slug — 3s may skip it."
            else
              echo "::warning::No phase3e version in $MANIFEST for $slug — 3s replay skipped."
            fi
          done

      # 3g has no LightGBM fit — it's parameter-free MC over 3a's hourly
      # P(wet) at predict time — but the bundle still BINDS one 3a champion
      # version (captured from the precipitation manifest at mint time) and
      # carries the day-of-year climatology. When 3a is retrained the bound
      # version goes stale, so 3g is re-minted every Sunday after 3a so the
      # binding tracks the current champion. Cheap (~1 min, no model fit).
      - name: Train 3g (dry-window MC over 3a)
        id: train_3g
        if: steps.gate.outputs.proceed == 'true' && steps.phases.outputs.run_3g == 'true'
        continue-on-error: true
        run: |
          dotnet run --project src/WeatherBlend --no-build -c Release -- \
            train --target dry-window --feature-set independence-mc

      - name: Train 3j (dry-window copula MC)
        id: train_3j
        if: steps.gate.outputs.proceed == 'true' && steps.phases.outputs.run_3j == 'true'
        continue-on-error: true
        run: |
          # 3j fits a 9×9 Σ per (station, lead) on observed daytime
          # binary sequences from the train slice of 3a's replay parquet.
          # Sigma evolves with each weekly retrain. The bound 3a version
          # is captured from the precipitation manifest at training time
          # (same convention as 3g).
          dotnet run --project src/WeatherBlend --no-build -c Release -- \
            train --target dry-window --feature-set copula-mc

      - name: Train 3n (dry-window regime-conditioned MC)
        id: train_3n
        if: steps.gate.outputs.proceed == 'true' && steps.phases.outputs.run_3n == 'true'
        continue-on-error: true
        run: |
          # 3n fits TWO 9×9 Σs per (station, lead) — settled vs unsettled
          # atmospheric regime, split by per-day NWP-ensemble agreement.
          # Both Σs evolve with each weekly retrain; threshold is the
          # median of the train-slice agreement scores. Bound 3a version
          # is captured the same way as 3g / 3j.
          dotnet run --project src/WeatherBlend --no-build -c Release -- \
            train --target dry-window --feature-set regime-mc

      - name: Train 3s (dry-window MC over 3e)
        id: train_3s
        if: steps.gate.outputs.proceed == 'true' && steps.phases.outputs.run_3s == 'true'
        continue-on-error: true
        run: |
          # 3s is 3g's parameter-free iid MC bound to Phase 3e's hourly
          # P(wet) instead of 3a's. Like 3g it has no model fit, but the
          # bundle binds one 3e champion version — re-minted weekly AFTER
          # 3e's train step so the binding tracks the fresh 3e champion.
          dotnet run --project src/WeatherBlend --no-build -c Release -- \
            train --target dry-window --feature-set independence-mc-3e

      # ---- Element blenders (wind / humidity / shortwave radiation /
      # cloud cover) ---- Each is a first-class phases.yaml target now, so
      # it gates on its own location-aware run flag exactly like every
      # other model — no hardcoded location or phases== check.

      - name: Train element wind
        id: train_wind
        if: steps.gate.outputs.proceed == 'true' && steps.phases.outputs.run_wind == 'true'
        continue-on-error: true
        run: |
          dotnet run --project src/WeatherBlend --no-build -c Release -- \
            train --target wind

      - name: Train element humidity
        id: train_humidity
        if: steps.gate.outputs.proceed == 'true' && steps.phases.outputs.run_humidity == 'true'
        continue-on-error: true
        run: |
          dotnet run --project src/WeatherBlend --no-build -c Release -- \
            train --target humidity

      - name: Train element shortwave-radiation
        id: train_radiation
        if: steps.gate.outputs.proceed == 'true' && steps.phases.outputs.run_shortwave_radiation == 'true'
        continue-on-error: true
        run: |
          dotnet run --project src/WeatherBlend --no-build -c Release -- \
            train --target shortwave-radiation

      - name: Train element cloud-cover
        id: train_cloud
        if: steps.gate.outputs.proceed == 'true' && steps.phases.outputs.run_cloud_cover == 'true'
        continue-on-error: true
        run: |
          dotnet run --project src/WeatherBlend --no-build -c Release -- \
            train --target cloud-cover

      - name: Mint Phase 4b bundle
        # 4b is the arithmetic mean of 4a + 3e — no training step, but
        # the bundle's metadata + test_predictions need refreshing
        # whenever 4a or 3e are retrained so the Models page Brier
        # numbers stay current. Reads the latest 4a + 3e bundles
        # already pulled from R2 at job start; ignores whether the
        # 4a side actually retrained this run (4a is retrained in the
        # WP-side workflow on the same Sunday tick — its newer bundle
        # lands on R2 via that workflow's push step, picked up at the
        # next predict-and-render's sync). Bundle re-mint is therefore
        # one-cycle-behind on 4a updates but always fresh on 3e —
        # acceptable trade for the simple flow.
        # Fires only if 3e succeeded (the binding constraint — 4a
        # refresh is a separate Sunday job).
        id: mint_4b
        if: steps.gate.outputs.proceed == 'true' && steps.phases.outputs.run_4b == 'true' && steps.train_3e.outcome == 'success'
        continue-on-error: true
        run: |
          dotnet run --project src/WeatherBlend --no-build -c Release -- phase4b-mint

      - name: Aggregate train results
        # Reads each step's outcome; if any failed, fails the job so
        # the [ci-fail] retrain-blenders issue auto-files. Phases that
        # weren't selected (run_X = false) report empty outcome — those
        # don't count as failures.
        if: steps.gate.outputs.proceed == 'true' && always()
        run: |
          declare -A outcomes=(
            [2b]="${{ steps.train_2b.outcome }}"
            [2c]="${{ steps.train_2c.outcome }}"
            [2d]="${{ steps.train_2d_short.outcome }}"
            [3a]="${{ steps.train_3a.outcome }}"
            [3c]="${{ steps.train_3c.outcome }}"
            [3d]="${{ steps.train_3d_short.outcome }}"
            [3e]="${{ steps.train_3e.outcome }}"
            [4b_mint]="${{ steps.mint_4b.outcome }}"
            [3b]="${{ steps.train_3b.outcome }}"
            [3g]="${{ steps.train_3g.outcome }}"
            [3j]="${{ steps.train_3j.outcome }}"
            [3n]="${{ steps.train_3n.outcome }}"
            [3s]="${{ steps.train_3s.outcome }}"
            [wind]="${{ steps.train_wind.outcome }}"
            [humidity]="${{ steps.train_humidity.outcome }}"
            [radiation]="${{ steps.train_radiation.outcome }}"
            [cloud]="${{ steps.train_cloud.outcome }}"
          )
          failed=()
          succeeded=()
          for phase in "${!outcomes[@]}"; do
            o="${outcomes[$phase]}"
            if [ "$o" = "failure" ]; then failed+=("$phase"); fi
            if [ "$o" = "success" ]; then succeeded+=("$phase"); fi
          done
          echo "Succeeded: ${succeeded[*]:-(none)}"
          echo "Failed:    ${failed[*]:-(none)}"
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Retrain failed for phase(s): ${failed[*]}. RetrainGuard typically blames upstream-data drift; inspect each phase's logs for breach details."
            exit 1
          fi

      - name: Push updated models to R2
        # Always push on partial success — successful phases' bundles
        # should land even if other phases failed. R2 sync is incremental
        # so this is cheap when nothing changed.
        if: steps.gate.outputs.proceed == 'true' && always()
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          rclone copy ./data/models "r2:${R2_BUCKET}/data/models" \
            --fast-list --transfers 16 --checkers 32 --s3-no-check-bucket

      - name: Upload run logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: retrain-blenders-logs-${{ github.run_id }}
          path: |
            *.log
            logs/
          retention-days: 5
          if-no-files-found: ignore
