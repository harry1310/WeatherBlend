name: retrain-blenders

env:
  # rclone hang guard — every R2 transfer in this workflow inherits these.
  # A failed/stalled transfer retries hard and a dead connection times out
  # fast, instead of hanging silently to the job ceiling (a job timeout
  # surfaces as a `cancelled` run, easy to miss).
  RCLONE_TIMEOUT: 5m
  RCLONE_CONTIMEOUT: 1m
  RCLONE_LOW_LEVEL_RETRIES: "20"
  RCLONE_RETRIES: "5"

# Phase 2 of AUTO_RETRAIN_PLAN.md — .NET-side retrain workflow.
# Sibling of WeatherProbabilistic's retrain-python.yml: same "phases=all"
# expansion driven by Config/phases.yaml impl=dotnet entries, same
# per-phase opt-in via the comma-separated phases input.
# Dispatched by the weatherblend-scheduler Cloudflare Worker on the
# Sunday retrain chain (retrain-python completion -> this) — or manually.
#
# Each phase runs as its own step with continue-on-error: true so
# a single guard failure on one phase doesn't cascade and skip the
# rest of the sweep. The trainers themselves carry the RetrainGuard
# (slice 1c) which writes training_summary.json on pass and bails
# with exit 4 on fail; this workflow's job-level success is gated
# on whether ANY step exited non-zero (final aggregator step).
#
# Cost ballpark on ubuntu-latest (4 vCPU):
#   - all phases sequentially: ~30-60 min total
#   - Per-phase wall: 2b/2c/2d/3a/3c/3d ~3-5 min each;
#     3b ~5-8 min (per-station per-window); element 4 × ~2 min.
#
# Adding a new .NET phase (e.g. 2e):
#   1. Add to Config/phases.yaml with role=challenger, impl=dotnet
#   2. Add a `Train 2e` step here mirroring the existing pattern
#   3. Add a run_2e flag emit in "Decide which phases to run"
# (Same one-place-rule applies: phases.yaml drives the "all"
# expansion + input validation; per-phase steps are unavoidable
# because each phase has its own --feature-set / --target args.)

on:
  # workflow_dispatch is the only trigger — the Cloudflare worker fires
  # this on the Sunday retrain chain (retrain-python completion, Hop B),
  # and it's the manual-run path too. (Was also repository_dispatch
  # type=retrain, from when previous-runs-refresh self-dispatched the
  # retrains; that orchestration moved wholly into the worker.)
  workflow_dispatch:
    inputs:
      phases:
        description: "Comma-separated phases to retrain. 'all' = every impl=dotnet phase in Config/phases.yaml. Examples: '2d', '3a,3c'."
        required: false
        default: "all"
        type: string
      force:
        description: "Set false to exit without training (dry run). Default true."
        required: false
        default: true
        type: boolean
      guard_rows_delta:
        description: "One-time RetrainGuard row-delta band override (e.g. 0.8 = ±80%). Empty = default ±30%. Use ONLY for a deliberate, permanent training-window change (e.g. a model moving required->optional) for the single run that resets the baseline; leave empty afterwards. Currently consumed by the Phase 2c step only."
        required: false
        default: ""
        type: string
      fit_lead_policy:
        description: "After training, refit + push LEAD_POLICY.json (per-lead 3c/3o model policy — docs/PRECIP_LEAD_POLICY_PLAN.md). Mints walk-forward study bundles on the runner (~50-70 min extra), runs precip-fit-lead-policy (margin/hysteresis/truth gates), pushes the artifact to R2. QUARTERLY cadence by design (Cloudflare sets this on the first Sunday of Jan/Apr/Jul/Oct once that tick is wired); set manually otherwise. Requires 3c AND 3o in `phases` (their pulls feed the study)."
        required: false
        default: false
        type: boolean

concurrency:
  # Distinct group from previous-runs-refresh / collect / backfill so
  # the heavy-data writers don't queue against retrain. Different R2
  # paths anyway (data/models/ vs data/forecasts/).
  group: weatherblend-retrain-${{ inputs.phases }}
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    # 180 min ceiling PER LOCATION job. Core sweep fits in 30-60 min; the
    # precipitation replay regen for the dry-window MC phases adds ~15-25 min;
    # fit_lead_policy=true (quarterly) adds ~50-70 min of study minting +
    # band scoring on the bonehill job only; plus padding for a slow R2
    # pull or runner cold-start.
    timeout-minutes: 180
    strategy:
      # One job per location. SERIAL (max-parallel: 1) is load-bearing: every
      # job pushes the shared data/models/MANIFEST.json, so a parallel job 2
      # would overwrite job 1's just-pushed manifest. Serial means job 2
      # re-pulls the manifest job 1 wrote, then merges its own entries in.
      max-parallel: 1
      # A failure in one location's job must not cancel the others.
      fail-fast: false
      matrix:
        # One entry per configured location. Each job trains only the phases
        # phases.yaml admits for that location (run_<id> gating below), so
        # Sennen — added 2026-06-06 — trains just temp 2b/2c + precip 3a/3c
        # (its bonehill/membury-only phases auto-skip). Keep this in step with
        # config.yaml's `locations:` block.
        location: [bonehill_rocks, membury_devon, sennen_cove]
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to proceed
        id: gate
        run: |
          # Sole trigger is workflow_dispatch (worker Hop B, or manual).
          # force=true — the default, and what the worker passes — proceeds;
          # force=false is a dry-run escape hatch.
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "force=true — proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::force=false — exiting cleanly (no training)."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide which phases to run
        # phases.yaml is the single source of truth for which models run for
        # which locations. For each impl=dotnet phase this reads the optional
        # `locations:` filter (absent = every location) and emits a run_<id>
        # flag that is true only when the phase was requested AND the matrix
        # location admits it. Every train step gates purely on its run_<id>,
        # so a Bonehill-only phase auto-skips the Membury job — no location
        # string is hardcoded anywhere in this workflow.
        id: phases
        if: steps.gate.outputs.proceed == 'true'
        env:
          PHASES_DISPATCH: ${{ inputs.phases }}
          MATRIX_LOCATION: ${{ matrix.location }}
        run: |
          PHASES_YAML=src/WeatherBlend/Config/phases.yaml
          # One "id|loc1,loc2" row per TRAINED impl=dotnet phase (empty = all
          # locations). retrain:none phases are composed at predict time with
          # no train/mint step (e.g. wind_blend) — exclude them so the fanout
          # doesn't try to train a thing that can't be trained.
          mapfile -t PHASE_ROWS < <(yq -r '
            .targets | to_entries[].value.phases[]
            | select(.impl == "dotnet")
            | select((.retrain // "") != "none")
            | .id + "|" + ((.locations // []) | join(","))
          ' "$PHASES_YAML")
          DOTNET_PHASES=$(printf '%s\n' "${PHASE_ROWS[@]}" | cut -d'|' -f1 | paste -sd, -)
          echo "impl=dotnet phases from phases.yaml: $DOTNET_PHASES"
          echo "Matrix location: $MATRIX_LOCATION"

          INPUT="${PHASES_DISPATCH:-all}"
          if [ "$INPUT" = "all" ]; then INPUT="$DOTNET_PHASES"; fi
          echo "Requested phase list: $INPUT"

          # Validate the request against phases.yaml — typo / missing-from-yaml
          # catches a pre-emptive phase before it's actually registered.
          IFS=',' read -ra REQUESTED <<< "$INPUT"
          IFS=',' read -ra KNOWN <<< "$DOTNET_PHASES"
          for p in "${REQUESTED[@]}"; do
            found=false
            for k in "${KNOWN[@]}"; do
              if [ "$p" = "$k" ]; then found=true; break; fi
            done
            if [ "$found" = "false" ]; then
              echo "::error::Phase '$p' is not in phases.yaml's impl=dotnet list (have: $DOTNET_PHASES). Add it to phases.yaml first."
              exit 1
            fi
          done

          # run_<id> = requested AND admitted by this matrix location.
          # Also accumulate the CSV of phases that actually run for this
          # matrix job — the Pull step downstream feeds it to
          # scripts/sync_train_data.sh so we pull exactly the data the
          # running phases need (and not, say, MIDAS for a job that's
          # only training 3a).
          resolved=()
          for row in "${PHASE_ROWS[@]}"; do
            id="${row%%|*}"
            locs="${row#*|}"
            requested=false
            case ",$INPUT," in *",${id},"*) requested=true ;; esac
            applies=false
            if [ -z "$locs" ]; then
              applies=true
            else
              case ",$locs," in *",${MATRIX_LOCATION},"*) applies=true ;; esac
            fi
            run=false
            if [ "$requested" = "true" ] && [ "$applies" = "true" ]; then run=true; fi
            echo "run_${id}=${run}" >> "$GITHUB_OUTPUT"
            echo "  ${id}: requested=${requested} applies(${MATRIX_LOCATION})=${applies} -> run_${id}=${run}"
            if [ "$run" = "true" ]; then resolved+=("$id"); fi
          done
          # Emit the resolved CSV for the Pull step. Empty when this matrix
          # job has no work (every phase resolved to run=false) — Pull step
          # treats that as a no-op rather than firing rclone for nothing.
          resolved_csv=""
          if [ "${#resolved[@]}" -gt 0 ]; then
            resolved_csv=$(IFS=,; echo "${resolved[*]}")
          fi
          echo "phases_resolved_csv=${resolved_csv}" >> "$GITHUB_OUTPUT"
          echo "Phases resolved for this matrix job: '${resolved_csv}'"

      # ---- setup steps -----------------------------------------------------
      # Moved AFTER "Decide which phases to run" so a matrix job with no
      # work skips them entirely. setup-dotnet (~30 s) + setup-r2 rclone
      # (~10 s) + Build (~60 s) all wasted on a no-op location; the
      # phases step itself uses only the checked-out phases.yaml + the
      # pre-installed yq/bash, so it doesn't depend on these.
      # phases.yaml is checked out (no R2 fetch step here, unlike WP).

      - uses: actions/setup-dotnet@v4
        if: steps.gate.outputs.proceed == 'true' && steps.phases.outputs.phases_resolved_csv != ''
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: preview

      # rclone install + R2 remote config via the shared composite action
      # (.github/actions/setup-r2) — same call shape as verify.yml, plus this
      # workflow's no-op gate. The workflow-level RCLONE_* hang-guard env
      # still applies: workflow env is inherited by composite-action steps
      # and by every rclone invocation below.
      - uses: ./.github/actions/setup-r2
        if: steps.gate.outputs.proceed == 'true' && steps.phases.outputs.phases_resolved_csv != ''
        with:
          access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint: ${{ secrets.R2_ENDPOINT }}

      - name: Pull data trees from R2
        # Delegates to scripts/sync_train_data.sh — single source of truth
        # for which trees each phase needs. Same script the smoke tests
        # call against a local fake-R2 dir, so a missing pull declaration
        # surfaces at PR time rather than as a 0-row trainer error in CI.
        # See the comment header in the script for the per-phase needs
        # table.
        #
        # No-op when phases_resolved_csv is empty (every requested phase
        # resolved to run=false for this matrix location).
        if: steps.gate.outputs.proceed == 'true' && steps.phases.outputs.phases_resolved_csv != ''
        env:
          R2_SOURCE: "r2:${{ secrets.R2_BUCKET }}"
          # LOCAL_ROOT is the data tree root — the script writes
          # forecasts/, truth/, models/, static/ under here. Workflow uses
          # repo-relative "./data/" to match the production layout the
          # trainers expect (e.g. ./data/forecasts/location=…/).
          LOCAL_ROOT: "./data"
          MATRIX_LOCATION: ${{ matrix.location }}
          RESOLVED_PHASES: ${{ steps.phases.outputs.phases_resolved_csv }}
        run: |
          bash scripts/sync_train_data.sh "$MATRIX_LOCATION" "$RESOLVED_PHASES"

      - name: Build
        if: steps.gate.outputs.proceed == 'true' && steps.phases.outputs.phases_resolved_csv != ''
        run: dotnet build src/WeatherBlend/WeatherBlend.csproj -c Release --nologo

      # ---- per-phase train steps ----------------------------------------
      # continue-on-error so a guard failure on one phase doesn't cascade.
      # Each step's exit code is captured; the aggregator at the end
      # decides the workflow's overall outcome.

      - name: Train 2b (temperature lean)
        # One step per matrix location. The bundle lands under
        # data/models/temperature/{location}/v.../ (Stations-keyed manifest);
        # RetrainGuard reads the previous summary on the same per-station
        # path, so locations don't cross-drift.
        id: train_2b
        if: steps.gate.outputs.proceed == 'true' && steps.phases.outputs.run_2b == 'true'
        continue-on-error: true
        run: |
          dotnet run --project src/WeatherBlend --no-build -c Release -- \
            train --target temperature --location ${{ matrix.location }}

      - name: Train 2c (temperature rich)
        id: train_2c
        if: steps.gate.outputs.proceed == 'true' && steps.phases.outputs.run_2c == 'true'
        continue-on-error: true
        # WB_GUARD_ROWS_DELTA_OVERRIDE: single-use RetrainGuard row-band relax
        # for a deliberate training-window change (TrainCommand.RowsDeltaOverride).
        # Empty by default -> default ±30%; only set via the guard_rows_delta
        # dispatch input for the one run that resets the 2c baseline.
        env:
          WB_GUARD_ROWS_DELTA_OVERRIDE: ${{ github.event.inputs.guard_rows_delta }}
        run: |
          dotnet run --project src/WeatherBlend --no-build -c Release -- \
            train --target temperature --feature-set rich --location ${{ matrix.location }} ${{ matrix.location == 'bonehill_rocks' && '--nowcast' || '' }}

      - name: Train 2d (temperature exact-runtime, leads 12/24/48)
        # 2d is a SHORT-lead exact-runtime phase: its strict UKV picker
        # only resolves cycles up to ~T+54h (0/6/12/18Z cycles cap there),
        # so leads 72/96/120 throw "UKV strict picks not defined". They're
        # also pointless — 2b owns the long leads, 2d is champion at 12h.
        # The first CI retrain (2026-05-17) exposed an old 12,24,48,72 +
        # 96,120 config that always failed; trimmed to what the picker
        # supports. {12,24,48} all train cleanly.
        id: train_2d_short
        if: steps.gate.outputs.proceed == 'true' && steps.phases.outputs.run_2d == 'true'
        continue-on-error: true
        run: |
          dotnet run --project src/WeatherBlend --no-build -c Release -- \
            train --target temperature --feature-set exact --leads 12,24,48

      - name: Train 3a (precipitation lean)
        # 3a is one-station-per-call (unlike rich 3c/3d which auto-iterate
        # every station of the location), so loop this location's rainfall
        # gauges via --station. The station list is read from config.yaml —
        # no hardcoded station list in the workflow.
        # Princetown is filtered out — per the 2026-05-25 cleanup plan it
        # joined the Bonehill pool ONLY for 3o (4-station rich+oro). 3a stays
        # 3-station to avoid polluting the per-station 3a champion with a
        # gauge whose pre-2024 history is thin and which the user explicitly
        # excluded from 3a's scope.
        id: train_3a
        if: steps.gate.outputs.proceed == 'true' && steps.phases.outputs.run_3a == 'true'
        continue-on-error: true
        env:
          MATRIX_LOCATION: ${{ matrix.location }}
        run: |
          STATIONS=$(yq -r ".locations[] | select(.name == \"$MATRIX_LOCATION\") | .rainfall.stations[].name" \
            src/WeatherBlend/config.yaml | grep -v "^Princetown$")
          echo "3a stations for $MATRIX_LOCATION (Princetown excluded — 3o-only per cleanup plan):"
          echo "$STATIONS"
          while IFS= read -r s; do
            [ -z "$s" ] && continue
            echo "=== 3a station: $s ==="
            dotnet run --project src/WeatherBlend --no-build -c Release -- \
              train --target precipitation --location "$MATRIX_LOCATION" --station "$s"
          done <<< "$STATIONS"

      - name: Train 3c (precipitation rich)
        # 3c auto-iterates all stations of the given location — one call
        # trains every gauge for the matrix location. Bonehill drops 3c
        # in cleanup Phase 2 via phases.yaml `locations: ["membury_devon"]`
        # so the Bonehill matrix job naturally has run_3c=false; this step
        # only fires for Membury.
        id: train_3c
        if: steps.gate.outputs.proceed == 'true' && steps.phases.outputs.run_3c == 'true'
        continue-on-error: true
        run: |
          dotnet run --project src/WeatherBlend --no-build -c Release -- \
            train --target precipitation --feature-set rich --location ${{ matrix.location }}

      - name: Train 3o (precipitation rich + orographic, 4-station Bonehill pool)
        # 3o pools all 4 Bonehill rainfall stations (Bellever + Bovey +
        # Hexworthy + Princetown) into one LightGBM per lead, with rich +
        # 9 terrain features. The same trained model is saved under each
        # station's bundle dir so the per-station predict plumbing reads
        # 3o transparently. Bonehill-only — phases.yaml's `locations:`
        # filter gates this off on the Membury matrix job (which the
        # 2026-05-25 stage-1 bake-off ruled out for terrain pooling).
        id: train_3o
        if: steps.gate.outputs.proceed == 'true' && steps.phases.outputs.run_3o == 'true'
        continue-on-error: true
        run: |
          dotnet run --project src/WeatherBlend --no-build -c Release -- \
            train --target precipitation --feature-set oro --location ${{ matrix.location }} ${{ matrix.location == 'bonehill_rocks' && '--nowcast' || '' }}

      - name: Train 3oni (precipitation rich + orographic, NO station id — tor variant)
        # 3oni = 3o minus oro_station_id. Same 4-station Bonehill pool; dropping
        # the per-station identity feature lets the pooled model be evaluated at
        # the ungauged Bonehill tor's terrain vector (predicted later). A little
        # worse than 3o at the gauges — accepted; 3o stays champion, 3oni is a
        # tor point-of-interest challenger. Bonehill-only via phases.yaml locations.
        id: train_3oni
        if: steps.gate.outputs.proceed == 'true' && steps.phases.outputs.run_3oni == 'true'
        continue-on-error: true
        run: |
          dotnet run --project src/WeatherBlend --no-build -c Release -- \
            train --target precipitation --feature-set oro-noid --location ${{ matrix.location }}

      - name: Train 3d (precipitation exact-runtime, leads 12/24/48/72)
        # 3d is a SHORT-lead exact-runtime phase. Its averaging UKV picker
        # resolves up to 72h but throws "UKV averaging picks not defined"
        # at 96h+ — and 3a owns the long leads anyway (3d is champion at
        # 12h). The first CI retrain (2026-05-17) exposed an old long-leads
        # 96,120 step that always failed; removed. {12,24,48,72} all train.
        id: train_3d_short
        if: steps.gate.outputs.proceed == 'true' && steps.phases.outputs.run_3d == 'true'
        continue-on-error: true
        run: |
          dotnet run --project src/WeatherBlend --no-build -c Release -- \
            train --target precipitation --feature-set exact --leads 12,24,48,72

      - name: Train 3b (dry-window)
        # --location added 2026-06-13 (Sennen 3b): without it the Sennen
        # matrix job would train the DEFAULT location (the elements-bug the
        # comment below describes). Bonehill-only before that, so it worked
        # by luck (default == primary == bonehill).
        id: train_3b
        if: steps.gate.outputs.proceed == 'true' && steps.phases.outputs.run_3b == 'true'
        continue-on-error: true
        run: |
          dotnet run --project src/WeatherBlend --no-build -c Release -- \
            train --target dry-window --location ${{ matrix.location }}

      - name: Train 3p (dry-window Gaussian copula MC over 3o)
        # 3p is parameter-free — no LightGBM fit, just Σ-fit from observed
        # daytime sequences + the bound 3o champion version captured at
        # training time. Σ is single per-station (NOT per-lead, per the
        # cleanup-plan bake-off). Cheap (~1 min, no model fit) but MUST
        # run AFTER 3o so the bound 3o version pointer is fresh.
        id: train_3p
        if: steps.gate.outputs.proceed == 'true' && steps.phases.outputs.run_3p == 'true'
        continue-on-error: true
        run: |
          dotnet run --project src/WeatherBlend --no-build -c Release -- \
            train --target dry-window --feature-set copula-mc --location ${{ matrix.location }}

      - name: Train 3q (dry-window Gaussian copula MC over 3c)
        # 3q — the 3p engine bound to 3c instead of 3o (Sennen, where 3o's
        # orographic features are pointless on flat coastal terrain). MUST
        # run AFTER 3c (earlier in this job) so the bound 3c version pointer
        # is fresh — same ordering contract 3p has with 3o. Parameter-free,
        # ~1 min. Gated to its phases.yaml locations (Sennen) via run_3q.
        id: train_3q
        if: steps.gate.outputs.proceed == 'true' && steps.phases.outputs.run_3q == 'true'
        continue-on-error: true
        run: |
          dotnet run --project src/WeatherBlend --no-build -c Release -- \
            train --target dry-window --feature-set copula-mc-3c --location ${{ matrix.location }}

      # ---- Element blenders (wind / humidity / shortwave radiation /
      # cloud cover) ---- Each is a first-class phases.yaml target now, so
      # it gates on its own location-aware run flag exactly like every
      # other model — no hardcoded location or phases== check.
      # --location added to every element step 2026-06-11: the steps
      # predated multi-location elements and trained the DEFAULT (primary)
      # location, which only worked because every element was Bonehill-only
      # — the first Sennen wind train loaded 0 rows (the matrix job syncs
      # only ITS location's trees) and exited 3.

      - name: Train element wind
        id: train_wind
        if: steps.gate.outputs.proceed == 'true' && steps.phases.outputs.run_wind == 'true'
        continue-on-error: true
        run: |
          dotnet run --project src/WeatherBlend --no-build -c Release -- \
            train --target wind --location ${{ matrix.location }}

      - name: Train element humidity
        id: train_humidity
        if: steps.gate.outputs.proceed == 'true' && steps.phases.outputs.run_humidity == 'true'
        continue-on-error: true
        run: |
          dotnet run --project src/WeatherBlend --no-build -c Release -- \
            train --target humidity --location ${{ matrix.location }}

      - name: Train element shortwave-radiation
        id: train_radiation
        if: steps.gate.outputs.proceed == 'true' && steps.phases.outputs.run_shortwave_radiation == 'true'
        continue-on-error: true
        run: |
          dotnet run --project src/WeatherBlend --no-build -c Release -- \
            train --target shortwave-radiation --location ${{ matrix.location }}

      - name: Train element cloud-cover
        id: train_cloud
        if: steps.gate.outputs.proceed == 'true' && steps.phases.outputs.run_cloud_cover == 'true'
        continue-on-error: true
        run: |
          dotnet run --project src/WeatherBlend --no-build -c Release -- \
            train --target cloud-cover --location ${{ matrix.location }}

      - name: Train element wind-gust
        # 4-NWP production-scope gust blender (gfs/icon/gem required + ukmo
        # optional). 10-feature minimal variant (per-NWP gust + ratio + ratio
        # mean/std). ERA5 WindGusts10m as truth. Bake-off 2026-05-27 MAE 1.04.
        # Phase id is wind_gust_lgb in phases.yaml so the gate matches.
        id: train_wind_gust
        if: steps.gate.outputs.proceed == 'true' && steps.phases.outputs.run_wind_gust_lgb == 'true'
        continue-on-error: true
        run: |
          dotnet run --project src/WeatherBlend --no-build -c Release -- \
            train --target wind-gust --location ${{ matrix.location }}

      # NOTE: wind_speed_lgb trained here until 2026-06-10 — it moved to
      # Python (Option B cutover: quantile-LGB + cross-conformal CQR in
      # WeatherProbabilistic's train_wind_speed_pi.py, retrain-python.yml).
      # phases.yaml's impl: python flip removes it from this workflow's
      # dotnet fanout automatically.

      - name: Mint Phase 4b bundle (4a + 3o mean)
        # Reads the latest 4a + 3o bundles already pulled from R2 at job
        # start. Bundle re-mint is one-cycle-behind on 4a updates (4a is
        # retrained in the WP-side workflow on the same Sunday tick) but
        # always fresh on 3o — acceptable trade for the simple flow.
        # Gated on 3o succeeding, since that's the leg we control in
        # this workflow.
        id: mint_4b
        if: steps.gate.outputs.proceed == 'true' && steps.phases.outputs.run_4b == 'true' && steps.train_3o.outcome == 'success'
        continue-on-error: true
        run: |
          dotnet run --project src/WeatherBlend --no-build -c Release -- phase4b-mint

      - name: Aggregate train results
        # Reads each step's outcome; if any failed, fails the job so
        # the [ci-fail] retrain-blenders issue auto-files. Phases that
        # weren't selected (run_X = false) report empty outcome — those
        # don't count as failures.
        if: steps.gate.outputs.proceed == 'true' && always()
        run: |
          declare -A outcomes=(
            [2b]="${{ steps.train_2b.outcome }}"
            [2c]="${{ steps.train_2c.outcome }}"
            [2d]="${{ steps.train_2d_short.outcome }}"
            [3a]="${{ steps.train_3a.outcome }}"
            [3c]="${{ steps.train_3c.outcome }}"
            [3d]="${{ steps.train_3d_short.outcome }}"
            [3o]="${{ steps.train_3o.outcome }}"
            [3oni]="${{ steps.train_3oni.outcome }}"
            [3b]="${{ steps.train_3b.outcome }}"
            [3p]="${{ steps.train_3p.outcome }}"
            [4b_mint]="${{ steps.mint_4b.outcome }}"
            [wind]="${{ steps.train_wind.outcome }}"
            [humidity]="${{ steps.train_humidity.outcome }}"
            [radiation]="${{ steps.train_radiation.outcome }}"
            [cloud]="${{ steps.train_cloud.outcome }}"
            [wind_gust_lgb]="${{ steps.train_wind_gust.outcome }}"
          )
          failed=()
          succeeded=()
          for phase in "${!outcomes[@]}"; do
            o="${outcomes[$phase]}"
            if [ "$o" = "failure" ]; then failed+=("$phase"); fi
            if [ "$o" = "success" ]; then succeeded+=("$phase"); fi
          done
          echo "Succeeded: ${succeeded[*]:-(none)}"
          echo "Failed:    ${failed[*]:-(none)}"
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Retrain failed for phase(s): ${failed[*]}. RetrainGuard typically blames upstream-data drift; inspect each phase's logs for breach details."
            exit 1
          fi

      - name: Push updated models to R2
        # Always push on partial success — successful phases' bundles
        # should land even if other phases failed. R2 sync is incremental
        # so this is cheap when nothing changed.
        # Gated on phases_resolved_csv too: a location with NO resolved phases
        # for this dispatch (e.g. a scoped Bonehill-only element retrain on the
        # membury/sennen matrix jobs) skips Build + setup-r2 + Pull, so
        # this step would otherwise fail with no rclone / no ./data/models. Those
        # jobs have nothing to push — skip cleanly instead of going red.
        if: always() && steps.gate.outputs.proceed == 'true' && steps.phases.outputs.phases_resolved_csv != ''
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          rclone copy ./data/models "r2:${R2_BUCKET}/data/models" \
            --fast-list --transfers 16 --checkers 32 --s3-no-check-bucket

      - name: Fit per-lead precip policy (study retrain + gated LEAD_POLICY.json)
        # Phase 3 of docs/PRECIP_LEAD_POLICY_PLAN.md — QUARTERLY, behind the
        # fit_lead_policy input (default false: weekly Sunday retrains never
        # touch the policy; no churn). Bonehill-only (the policy is the
        # Bonehill pooled study) and requires BOTH 3c + 3o resolved in this
        # dispatch — their sync pulls (full forecasts incl. live rows, EA
        # rainfall, static orographic) are exactly the study's inputs.
        #
        # Sequence: walk-forward study bundles at a ROLLING cutoff (today−84d:
        # ~9 weeks SELECT + the 21-day settled SCORE holdout), then the
        # producer (margin 0.75% / hysteresis 0.5% / truth-settled guard —
        # all enforced inside precip-fit-lead-policy, which exits 0 and keeps
        # the last-good artifact when truth coverage is short). The incumbent
        # LEAD_POLICY.json is pulled first so hysteresis has its reference.
        # The production bundles trained above are NOT the study subjects —
        # the policy's structure is learned on the cutoff replicas and
        # applied to the full-data bundles (see the plan doc's Phase 1).
        id: fit_lead_policy
        if: >-
          steps.gate.outputs.proceed == 'true'
          && inputs.fit_lead_policy
          && matrix.location == 'bonehill_rocks'
          && steps.phases.outputs.run_3c == 'true'
          && steps.phases.outputs.run_3o == 'true'
        continue-on-error: true
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          rclone copyto "r2:${R2_BUCKET}/data/models/precipitation/LEAD_POLICY.json" \
            ./data/models/precipitation/LEAD_POLICY.json --s3-no-check-bucket \
            || echo "::notice::No incumbent LEAD_POLICY.json on R2 — first fit, hysteresis has no reference."
          CUTOFF=$(date -ud '84 days ago' +%F)
          START=$(date -ud '80 days ago' +%F)
          echo "Study cutoff=$CUTOFF, scoring window start=$START"
          dotnet run --project src/WeatherBlend --no-build -c Release -- \
            precip-policy-retrain --as-of "$CUTOFF"
          dotnet run --project src/WeatherBlend --no-build -c Release -- \
            precip-fit-lead-policy --start "$START" --cutoff "$CUTOFF"

      - name: Push LEAD_POLICY.json to R2
        # Separate explicit push (not part of the models sync above, which
        # runs BEFORE the fit). Only on a successful fit — a failed fit
        # leaves the incumbent artifact untouched on R2.
        if: steps.fit_lead_policy.outcome == 'success'
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [ -f ./data/models/precipitation/LEAD_POLICY.json ]; then
            rclone copyto ./data/models/precipitation/LEAD_POLICY.json \
              "r2:${R2_BUCKET}/data/models/precipitation/LEAD_POLICY.json" \
              --s3-no-check-bucket
            echo "Pushed LEAD_POLICY.json to R2."
          else
            echo "::warning::fit step succeeded but no LEAD_POLICY.json on disk (truth guard skip keeps last-good) — nothing pushed."
          fi

      - name: Upload run logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: retrain-blenders-logs-${{ github.run_id }}
          path: |
            *.log
            logs/
          retention-days: 5
          if-no-files-found: ignore
