name: collect

env:
  # rclone hang guard — every R2 transfer in this workflow inherits these.
  # A failed/stalled transfer retries hard and a dead connection times out
  # fast, instead of hanging silently to the job ceiling (a job timeout
  # surfaces as a `cancelled` run, easy to miss).
  RCLONE_TIMEOUT: 5m
  RCLONE_CONTIMEOUT: 1m
  RCLONE_LOW_LEVEL_RETRIES: "20"
  RCLONE_RETRIES: "5"

on:
  # GitHub-side schedule removed 2026-05-01 — the cron now fires from the
  # weatherblend-scheduler Cloudflare Worker (cloudflare/scheduler-worker/)
  # which dispatches this workflow at 02:45, 08:45, 14:45, 20:45 UTC via a
  # GitHub App's installation token. GitHub's own scheduler routinely
  # delayed runs by 15+ minutes and occasionally skipped them entirely,
  # which meant collect cycles missed the Open-Meteo previous_day_N refresh
  # window. Cloudflare cron fires on time. The schedule expression
  # `45 2,8,14,20 * * *` lives in cloudflare/scheduler-worker/wrangler.toml
  # (was `30 2,8,14,20 * * *` until 2026-05-07; shifted 15 min later to
  # give Open-Meteo's GEM ingest more time to land — see scheduler README).
  # along with the rest of the project's schedules — see that file for the
  # full sequencing rationale (collect → s3-collect → predict-and-render).
  # **Never** add a `schedule:` block here: GH-side cron is the unreliable
  # mechanism the Worker exists to replace.
  workflow_dispatch: {}

concurrency:
  group: weatherblend-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 15 → 30 on 2026-06-11: Open-Meteo degradation (TLS retries, ~7s per
    # normally-sub-second request) made the full model×location sweep blow
    # a 15-min cap twice in one morning while every request was still
    # SUCCEEDING. 30 min lets a slow-but-alive upstream complete; the
    # weatherblend-data lock means a slow collect only delays the chain.
    # Healthy runs are ~6-10 min — the cap is a backstop, not a target.
    # Proper fix (tighter per-request client timeouts → fail fast +
    # partial-push) is on the backlog.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: preview

      # Python setup + deps removed 2026-04-29 with the Met Office AWS-archive
      # collectors. The remaining collect path is pure C# (Open-Meteo, METAR,
      # EA rainfall, MO DataHub Spot + Land Obs). ERA5 is NOT collected here —
      # it's a separate daily job (truth-refresh.yml).

      # rclone install + R2 remote config via the shared composite action
      # (.github/actions/setup-r2) — same call shape as verify.yml. The
      # workflow-level RCLONE_* hang-guard env still applies: workflow env
      # is inherited by composite-action steps and by every rclone
      # invocation below.
      - uses: ./.github/actions/setup-r2
        with:
          access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint: ${{ secrets.R2_ENDPOINT }}

      - name: Pull existing METAR + rainfall + Met Office obs from R2
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          # The forecast writer is append-only at the file level (unique
          # run=HH.parquet / date=... paths per cycle), so we don't need the
          # existing tree locally. The read-modify-write writers are
          # WriteObservationsAsync (METAR), WriteRainfallAsync (EA), and
          # WriteMetOfficeObservationsAsync — each reads the day's parquet,
          # merges new rows, dedupes by timestamp, rewrites. Those subtrees we
          # pull; everything else is wasted IO.
          #
          # Date-windowed since 2026-06-10 (incident review): each collector's
          # read-modify-write only touches a ~3-day rolling window, yet this
          # step was copying the FULL truth trees (4,056 metar + 14,029
          # rainfall + 67 met_office_obs files) every cycle, 4x/day. A 7-day
          # window (3-day collector reach + margin) pulls a few dozen files
          # instead. Same pattern as s3-collect.yml's 5-day forecast filter.
          # The includes are UNROOTED (**/date=.../**) on purpose: these
          # trees have location=/station= (or geohash=) parent segments
          # between the copy root and the date= partitions, so a rooted
          # /date=... include would match nothing.
          RECENT_INCLUDES=""
          for i in $(seq 0 7); do
            d=$(date -u -d "$i days ago" +%Y-%m-%d)
            RECENT_INCLUDES="$RECENT_INCLUDES --include **/date=$d/**"
          done

          mkdir -p data/truth/metar data/truth/rainfall data/truth/met_office_obs data/truth/waves
          rclone copy "r2:${R2_BUCKET}/data/truth/metar"           ./data/truth/metar           --fast-list --transfers 16 --checkers 32 --progress $RECENT_INCLUDES
          rclone copy "r2:${R2_BUCKET}/data/truth/rainfall"        ./data/truth/rainfall        --fast-list --transfers 16 --checkers 32 --progress $RECENT_INCLUDES
          rclone copy "r2:${R2_BUCKET}/data/truth/met_office_obs"  ./data/truth/met_office_obs  --fast-list --transfers 16 --checkers 32 --progress $RECENT_INCLUDES
          # waves: buoy realtime (WriteWaveTruthAsync) is read-modify-write
          # like the three above — without the pre-pull, a cycle's partial
          # day-file would overwrite R2's completer one (Sennen sea-state
          # Phase 0, 2026-06-11). The marine forecast tree needs NO pull:
          # its writers regenerate complete files from the API every cycle.
          rclone copy "r2:${R2_BUCKET}/data/truth/waves"           ./data/truth/waves           --fast-list --transfers 16 --checkers 32 --progress $RECENT_INCLUDES

      - name: Build
        run: dotnet build src/WeatherBlend/WeatherBlend.csproj -c Release --nologo

      - name: Collect
        id: collect
        env:
          MET_OFFICE_SPOT_API_KEY: ${{ secrets.MET_OFFICE_SPOT_API_KEY }}
          MET_OFFICE_OBS_API_KEY: ${{ secrets.MET_OFFICE_OBS_API_KEY }}
          WEATHERLINK_API_KEY: ${{ secrets.WEATHERLINK_API_KEY }}
          WEATHERLINK_API_SECRET: ${{ secrets.WEATHERLINK_API_SECRET }}
          # NOTE: WEATHERBLEND_SKIP_RAINFALL was set 2026-06-09 while the EA
          # Hydrology readings API hung server-side (cycle blew past the 15-min
          # ceiling → cancelled runs starving predict-4a). Removed after
          # re-verification 2026-06-10: all gauges HTTP 200 with current
          # readings; cold-cache responses 20-30s (inside the 60s attempt
          # timeout EaHydrologyClient's resilience handler allows), warm
          # ~1-2s. If EA hangs again, re-add `WEATHERBLEND_SKIP_RAINFALL: "1"`
          # here and re-check. (Skipping is degraded-not-broken: rainfall is
          # the training/verify truth AND feeds 4a's antecedent-rain predict
          # features, so don't leave it off longer than necessary.)
        # continue-on-error so a sub-collector failure (CollectCommand returns 1)
        # doesn't skip the R2 push below — partial data still lands. The "Fail
        # job if collect had errors" step at the end re-raises the failure so
        # GitHub still emails you / marks the run red.
        continue-on-error: true
        run: dotnet run --project src/WeatherBlend --no-build -c Release -- collect

      - name: Push new/updated data to R2
        # if: always() — run even when Collect set continue-on-error. Any data
        # that DID land on disk before the failure is pushed; remote partition
        # is never made worse than what's locally on disk.
        if: always()
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          # copy (not sync) — additive only, never deletes remote files.
          rclone copy ./data "r2:${R2_BUCKET}/data" --fast-list --transfers 16 --checkers 32 --progress

      - name: Fail job if collect had errors
        # Re-raise the failure after R2 push has run. Keeps GitHub's run
        # status / email-on-failure behaviour intact, while ensuring the
        # data side-effect ran first.
        if: steps.collect.outcome != 'success'
        run: |
          echo "Collect step exited non-zero — see 'Collect' log above for which sub-collector failed."
          echo "R2 push was attempted regardless so any successfully collected data has landed."
          exit 1

      - name: Upload logs as artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: collect-logs-${{ github.run_id }}
          path: logs/
          retention-days: 5
          if-no-files-found: ignore
