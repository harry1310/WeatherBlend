name: collect

on:
  schedule:
    # 02:15, 08:15, 14:15, 20:15 UTC — offset from top-of-hour so we're not
    # hammering Open-Meteo at :00 with every other scheduled workflow on Earth.
    - cron: "15 2,8,14,20 * * *"
  workflow_dispatch: {}

concurrency:
  group: weatherblend-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: preview

      # Python is needed by the Met Office Global Det step inside `collect` —
      # CollectCommand shells out to scripts/met_office_archive_backfill.py via
      # MetOfficeArchiveBackfillClient. NetCDF parsing in pure C# would need
      # HDF.PInvoke; the Python path is the same pattern as Wgrib2 elsewhere
      # in WeatherBlend — external tool, thin C# wrapper.
      # If this setup or the deps install fails, the MO Global collect step is
      # try/catch'd in CollectCommand so the rest of collect still succeeds.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python deps for Met Office Global Det archive
        run: pip install --no-cache-dir xarray h5netcdf pyarrow pandas requests

      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Configure rclone for R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = ${R2_ENDPOINT}
          acl = private
          EOF

      - name: Pull existing METAR + rainfall + Met Office obs from R2
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          # Forecasts/ERA5 writers are append-only at the file level (unique
          # run=HH.parquet / date=... paths per cycle), so we don't need the
          # existing tree locally. The read-modify-write writers are
          # WriteObservationsAsync (METAR), WriteRainfallAsync (EA), and
          # WriteMetOfficeObservationsAsync — each reads the day's parquet,
          # merges new rows, dedupes by timestamp, rewrites. Those subtrees we
          # pull; everything else is wasted IO.
          mkdir -p data/truth/metar data/truth/rainfall data/truth/met_office_obs
          rclone copy "r2:${R2_BUCKET}/data/truth/metar"           ./data/truth/metar           --fast-list --transfers 16 --checkers 32 --progress
          rclone copy "r2:${R2_BUCKET}/data/truth/rainfall"        ./data/truth/rainfall        --fast-list --transfers 16 --checkers 32 --progress
          rclone copy "r2:${R2_BUCKET}/data/truth/met_office_obs"  ./data/truth/met_office_obs  --fast-list --transfers 16 --checkers 32 --progress
          # Met Office Global Det archive — pull the whole tree so the
          # post-collect rclone-copy diff back to R2 is minimal. ~5 KB per
          # parquet × ~1.5k cycles ≈ 7 MB, trivial. Marked || true so a
          # transient R2 issue doesn't block the rest of collect.
          mkdir -p "data/forecasts/location=bonehill_rocks/model=met_office_global"
          rclone copy "r2:${R2_BUCKET}/data/forecasts/location=bonehill_rocks/model=met_office_global" \
            "./data/forecasts/location=bonehill_rocks/model=met_office_global" \
            --fast-list --transfers 16 --checkers 32 --progress || true

      - name: Build
        run: dotnet build src/WeatherBlend/WeatherBlend.csproj -c Release --nologo

      - name: Collect
        env:
          MET_OFFICE_SPOT_API_KEY: ${{ secrets.MET_OFFICE_SPOT_API_KEY }}
          MET_OFFICE_OBS_API_KEY: ${{ secrets.MET_OFFICE_OBS_API_KEY }}
        run: dotnet run --project src/WeatherBlend --no-build -c Release -- collect

      - name: Push new/updated data to R2
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          # copy (not sync) — additive only, never deletes remote files.
          rclone copy ./data "r2:${R2_BUCKET}/data" --fast-list --transfers 16 --checkers 32 --progress

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collect-logs-${{ github.run_id }}
          path: logs/
          retention-days: 14
          if-no-files-found: ignore
