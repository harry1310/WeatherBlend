name: truth-refresh

env:
  # rclone hang guard — every R2 transfer in this workflow inherits these.
  # A failed/stalled transfer retries hard and a dead connection times out
  # fast, instead of hanging silently to the job ceiling (a job timeout
  # surfaces as a `cancelled` run, easy to miss).
  RCLONE_TIMEOUT: 5m
  RCLONE_CONTIMEOUT: 1m
  RCLONE_LOW_LEVEL_RETRIES: "20"
  RCLONE_RETRIES: "5"

# Daily ERA5 truth refresh. Open-Meteo's ERA5 feed mirrors ECMWF's release
# cadence — roughly once a day, but the ERA5T lag is not fixed (~5 days
# typically, seen as high as ~8). We backfill a rolling 14-day window each
# refresh to catch late-arriving days without assuming a single release
# timing, and — critically — so a lag spike can't drop a boundary day out
# of the window before it publishes (that day would otherwise be a silent
# permanent gap, not just a red run).
# (Window was narrowed 14 → 7 days 2026-05-09 on a ~5-day-lag assumption;
# restored to 14 on 2026-07-18 after an ~8-day lag emptied the whole 7-day
# window and failed the refresh — see the push guard below.)
#
# Schedule moved to Cloudflare 2026-05-01 (cloudflare/scheduler-worker/);
# GitHub's `schedule:` trigger removed at the same time. The Cloudflare
# cron fires daily at 12:00 UTC — past ECMWF's CDS publication (typically
# 09–10 UTC) and past Open-Meteo's ingestion window (a few hours later),
# so the daily refresh always lands on Open-Meteo's freshest data instead
# of catching ECMWF mid-publish (which writes null partitions). The old
# 06:00 UTC slot was too early for that.
#
# `workflow_dispatch:` retained so manual dashboard runs and the
# Cloudflare scheduler's API-driven dispatches still work.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start date (yyyy-MM-dd, UTC). Default: today − 7 days."
        required: false
        default: ""
      end:
        description: "End date (yyyy-MM-dd, UTC). Default: today."
        required: false
        default: ""

concurrency:
  # truth-refresh writes only data/truth/era5/ — its own subtree, as whole
  # idempotent per-date parquet files (no read-modify-write, unlike the
  # METAR/rainfall writers). So it doesn't need the shared weatherblend-data
  # write-lock; its own group just serialises truth-refresh against itself
  # (e.g. a manual dispatch vs the noon scheduled run). Moved off
  # weatherblend-data 2026-05-22 — it was queueing ~8 min behind
  # previous-runs-refresh on the shared noon tick for no reason.
  group: weatherblend-era5
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: preview

      # rclone install + R2 remote config via the shared composite action
      # (.github/actions/setup-r2) — same call shape as verify.yml. The
      # workflow-level RCLONE_* hang-guard env still applies: workflow env
      # is inherited by composite-action steps and by every rclone
      # invocation below.
      - uses: ./.github/actions/setup-r2
        with:
          access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint: ${{ secrets.R2_ENDPOINT }}

      - name: Compute refresh window
        id: window
        run: |
          START="${{ github.event.inputs.start }}"
          END="${{ github.event.inputs.end }}"
          if [ -z "$START" ]; then
            START=$(date -u -d '14 days ago' +%Y-%m-%d)
          fi
          if [ -z "$END" ]; then
            END=$(date -u +%Y-%m-%d)
          fi
          echo "start=$START" >> "$GITHUB_OUTPUT"
          echo "end=$END"   >> "$GITHUB_OUTPUT"
          echo "ERA5 refresh window: $START .. $END"

      - name: Build
        run: dotnet build src/WeatherBlend/WeatherBlend.csproj -c Release --nologo

      - name: Refresh ERA5
        # Backfill is idempotent — ParquetWriter.WriteEra5Async rewrites per-date
        # files, so re-pulling the same days just overwrites with the latest
        # Open-Meteo data. Days Open-Meteo hasn't released yet are simply skipped.
        run: |
          dotnet run --project src/WeatherBlend --no-build -c Release -- \
            backfill --source era5 \
            --start ${{ steps.window.outputs.start }} \
            --end   ${{ steps.window.outputs.end }}

      - name: Refresh ERA5 ocean-wave truth
        # era5_ocean via the Marine API (Sennen sea-state Phase 0,
        # 2026-06-11) — same release cadence as ERA5 proper, same rolling
        # window. No-op for locations without a marine: config block, and
        # the writer regenerates complete per-day files from the API so no
        # R2 pre-pull is needed (unpublished days are skipped by the
        # all-null canary, mirroring WriteEra5Async).
        run: |
          dotnet run --project src/WeatherBlend --no-build -c Release -- \
            backfill --source era5-waves \
            --start ${{ steps.window.outputs.start }} \
            --end   ${{ steps.window.outputs.end }}

      - name: Push ERA5 tree to R2
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          # Guarded like the waves/rainfall pushes below: when ERA5T lag
          # exceeds the whole refresh window every day fails the null-canary
          # in WriteEra5Async, so no era5 tree is produced and a bare
          # `rclone copy` would 404 the source dir (exit 3). That's an
          # upstream-lag red herring, not our failure — no-op instead. The
          # 14-day window makes a fully-empty refresh rare, but tolerate it.
          if [ -d ./data/truth/era5 ]; then
            rclone copy ./data/truth/era5 "r2:${R2_BUCKET}/data/truth/era5" --fast-list --transfers 16 --checkers 32 --progress
          else
            echo "No data/truth/era5 tree produced this run (ERA5 not yet published for any day in window) — nothing to push."
          fi

      - name: Push wave-truth tree to R2
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          # --s3-no-check-bucket: first writes to a brand-new R2 prefix 403
          # without it (IAM token lacks CreateBucket).
          if [ -d ./data/truth/waves ]; then
            rclone copy ./data/truth/waves "r2:${R2_BUCKET}/data/truth/waves" --fast-list --transfers 16 --checkers 32 --progress --s3-no-check-bucket
          else
            echo "No data/truth/waves tree produced this run — nothing to push."
          fi

      - name: Refresh EA rainfall truth (FATAL — the EA canary)
        # EA Hydrology rainfall gauges: precip/dry-window TRUTH + the antecedent-
        # rain persistence feature 3c/3o/4a read at predict time. Runs AFTER the
        # ERA5/wave pushes so an EA outage can't block those. FATAL by design (no
        # continue-on-error): collect pulls EA best-effort every 3h and is
        # non-fatal there, so this DAILY run is the EA canary — if EA is
        # persistently 403ing / down this goes red and we know. Same rolling
        # window as ERA5; the dedup writer makes re-pulls cheap.
        run: |
          dotnet run --project src/WeatherBlend --no-build -c Release -- \
            backfill --source rainfall \
            --start ${{ steps.window.outputs.start }} \
            --end   ${{ steps.window.outputs.end }}

      - name: Push rainfall tree to R2
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [ -d ./data/truth/rainfall ]; then
            rclone copy ./data/truth/rainfall "r2:${R2_BUCKET}/data/truth/rainfall" --fast-list --transfers 16 --checkers 32 --progress --s3-no-check-bucket
          else
            echo "No data/truth/rainfall tree produced this run — nothing to push."
          fi

      - name: Upload logs as artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: truth-refresh-logs-${{ github.run_id }}
          path: logs/
          retention-days: 5
          if-no-files-found: ignore
