name: era5-refresh

env:
  # rclone hang guard — every R2 transfer in this workflow inherits these.
  # A failed/stalled transfer retries hard and a dead connection times out
  # fast, instead of hanging silently to the job ceiling (a job timeout
  # surfaces as a `cancelled` run, easy to miss).
  RCLONE_TIMEOUT: 5m
  RCLONE_CONTIMEOUT: 1m
  RCLONE_LOW_LEVEL_RETRIES: "20"
  RCLONE_RETRIES: "5"

# Daily ERA5 truth refresh. Open-Meteo's ERA5 feed mirrors ECMWF's release
# cadence — roughly once a day with ~5-day lag — so polling more often is
# wasted calls. We backfill a rolling 7-day window each refresh to catch
# any late-arriving days without assuming a single release timing.
# (Window narrowed from 14 → 7 days 2026-05-09 — 14 was overkill given
# Open-Meteo's typical 1-day publish cadence + ~5-day lag.)
#
# Schedule moved to Cloudflare 2026-05-01 (cloudflare/scheduler-worker/);
# GitHub's `schedule:` trigger removed at the same time. The Cloudflare
# cron fires daily at 12:00 UTC — past ECMWF's CDS publication (typically
# 09–10 UTC) and past Open-Meteo's ingestion window (a few hours later),
# so the daily refresh always lands on Open-Meteo's freshest data instead
# of catching ECMWF mid-publish (which writes null partitions). The old
# 06:00 UTC slot was too early for that.
#
# `workflow_dispatch:` retained so manual dashboard runs and the
# Cloudflare scheduler's API-driven dispatches still work.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start date (yyyy-MM-dd, UTC). Default: today − 7 days."
        required: false
        default: ""
      end:
        description: "End date (yyyy-MM-dd, UTC). Default: today."
        required: false
        default: ""

concurrency:
  # era5-refresh writes only data/truth/era5/ — its own subtree, as whole
  # idempotent per-date parquet files (no read-modify-write, unlike the
  # METAR/rainfall writers). So it doesn't need the shared weatherblend-data
  # write-lock; its own group just serialises era5-refresh against itself
  # (e.g. a manual dispatch vs the noon scheduled run). Moved off
  # weatherblend-data 2026-05-22 — it was queueing ~8 min behind
  # previous-runs-refresh on the shared noon tick for no reason.
  group: weatherblend-era5
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: preview

      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Configure rclone for R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = ${R2_ENDPOINT}
          acl = private
          EOF

      - name: Compute refresh window
        id: window
        run: |
          START="${{ github.event.inputs.start }}"
          END="${{ github.event.inputs.end }}"
          if [ -z "$START" ]; then
            START=$(date -u -d '7 days ago' +%Y-%m-%d)
          fi
          if [ -z "$END" ]; then
            END=$(date -u +%Y-%m-%d)
          fi
          echo "start=$START" >> "$GITHUB_OUTPUT"
          echo "end=$END"   >> "$GITHUB_OUTPUT"
          echo "ERA5 refresh window: $START .. $END"

      - name: Build
        run: dotnet build src/WeatherBlend/WeatherBlend.csproj -c Release --nologo

      - name: Refresh ERA5
        # Backfill is idempotent — ParquetWriter.WriteEra5Async rewrites per-date
        # files, so re-pulling the same days just overwrites with the latest
        # Open-Meteo data. Days Open-Meteo hasn't released yet are simply skipped.
        run: |
          dotnet run --project src/WeatherBlend --no-build -c Release -- \
            backfill --source era5 \
            --start ${{ steps.window.outputs.start }} \
            --end   ${{ steps.window.outputs.end }}

      - name: Push ERA5 tree to R2
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          rclone copy ./data/truth/era5 "r2:${R2_BUCKET}/data/truth/era5" --fast-list --transfers 16 --checkers 32 --progress

      - name: Upload logs as artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: era5-refresh-logs-${{ github.run_id }}
          path: logs/
          retention-days: 5
          if-no-files-found: ignore
