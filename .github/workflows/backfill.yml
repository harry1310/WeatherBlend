name: backfill

on:
  workflow_dispatch:
    inputs:
      source:
        description: "forecasts | era5 | metar | all"
        required: true
        default: "all"
        type: choice
        options: [forecasts, era5, metar, all]
      start:
        description: "Start date (yyyy-MM-dd, UTC)"
        required: true
      end:
        description: "End date (yyyy-MM-dd, UTC) — leave blank for yesterday"
        required: false
        default: ""

concurrency:
  # Share the lock with `collect` so the two can't write to R2 simultaneously.
  group: weatherblend-data
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    # Generous — a full 3y all-sources run took ~2.5h locally.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: preview

      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Configure rclone for R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = ${R2_ENDPOINT}
          acl = private
          EOF

      - name: Pull existing data from R2
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          mkdir -p data
          rclone copy "r2:${R2_BUCKET}/data" ./data --fast-list --transfers 16 --checkers 32 --progress

      - name: Build
        run: dotnet build src/WeatherBlend/WeatherBlend.csproj -c Release --nologo

      - name: Backfill
        run: |
          END_ARG=""
          if [ -n "${{ inputs.end }}" ]; then
            END_ARG="--end ${{ inputs.end }}"
          fi
          dotnet run --project src/WeatherBlend --no-build -c Release -- \
            backfill --source ${{ inputs.source }} --start ${{ inputs.start }} $END_ARG

      - name: Push data to R2
        if: always()
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          rclone copy ./data "r2:${R2_BUCKET}/data" --fast-list --transfers 16 --checkers 32 --progress

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backfill-logs-${{ github.run_id }}
          path: logs/
          retention-days: 30
          if-no-files-found: ignore
