name: backfill

env:
  # rclone hang guard — every R2 transfer in this workflow inherits these.
  # A failed/stalled transfer retries hard and a dead connection times out
  # fast, instead of hanging silently to the job ceiling (a job timeout
  # surfaces as a `cancelled` run, easy to miss).
  RCLONE_TIMEOUT: 5m
  RCLONE_CONTIMEOUT: 1m
  RCLONE_LOW_LEVEL_RETRIES: "20"
  RCLONE_RETRIES: "5"

on:
  workflow_dispatch:
    inputs:
      source:
        description: "previous-runs | era5 | metar | rainfall | era5-waves | hist-forecast | marine | buoys | all"
        required: true
        default: "all"
        type: choice
        options: [previous-runs, era5, metar, rainfall, era5-waves, hist-forecast, marine, buoys, all]
      start:
        description: "Start date (yyyy-MM-dd, UTC)"
        required: true
      end:
        description: "End date (yyyy-MM-dd, UTC) — leave blank for yesterday"
        required: false
        default: ""
      location:
        description: "Optional: backfill only this location name (e.g. membury_devon). Blank = all configured locations. Applies to previous-runs + rainfall."
        required: false
        default: ""

concurrency:
  # Per-(source, start-date) groups so yearly-chunked dispatches run in
  # PARALLEL — mass-firing 3-4 chunks at once doesn't queue them. Each
  # chunk writes to disjoint date partitions inside the R2 forecasts/
  # rainfall trees so concurrent rclone copies are safe (each parquet
  # path is unique to its (location, model, date) tuple).
  #
  # Previously this shared `weatherblend-data` with `collect` to avoid
  # any R2-write collision, but the partition disjointness means that
  # was over-cautious; the per-chunk concurrency style matches
  # archive-backfill.yml's design (see its concurrency block for the
  # GitHub-cancels-3rd-pending rationale).
  group: weatherblend-backfill-${{ inputs.source }}-${{ inputs.start }}-${{ inputs.location || 'all' }}
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    # Generous — a full 3y all-sources run took ~2.5h locally.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: preview

      # rclone install + R2 remote config via the shared composite action
      # (.github/actions/setup-r2) — same call shape as verify.yml. The
      # workflow-level RCLONE_* hang-guard env still applies: workflow env
      # is inherited by composite-action steps and by every rclone
      # invocation below.
      - uses: ./.github/actions/setup-r2
        with:
          access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint: ${{ secrets.R2_ENDPOINT }}

      - name: Pull METAR merge-target from R2 (for metar/all)
        if: ${{ inputs.source == 'metar' || inputs.source == 'all' }}
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          # WriteObservationsAsync is read-modify-write (merge + dedup by
          # ObservedTimeUtc + rewrite). Pull the subtree so existing rows
          # aren't clobbered. Forecasts / ERA5 / previous-runs are append-only
          # at the file level and don't need the existing tree locally.
          mkdir -p data/truth/metar
          rclone copy "r2:${R2_BUCKET}/data/truth/metar" ./data/truth/metar --fast-list --transfers 16 --checkers 32 --progress

      - name: Pull rainfall merge-target from R2 (for rainfall/all)
        if: ${{ inputs.source == 'rainfall' || inputs.source == 'all' }}
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          # WriteRainfallAsync is read-modify-write (merge + dedup by
          # ObservedTimeUtc + rewrite), same pattern as METAR. Only reason to
          # pull for rainfall is if the backfill window overlaps existing
          # partitions — otherwise it's all new files. Cheap insurance.
          mkdir -p data/truth/rainfall
          rclone copy "r2:${R2_BUCKET}/data/truth/rainfall" ./data/truth/rainfall --fast-list --transfers 16 --checkers 32 --progress

      - name: Pull waves merge-target from R2 (for buoys/era5-waves/all)
        if: ${{ inputs.source == 'buoys' || inputs.source == 'era5-waves' || inputs.source == 'all' }}
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          # WriteWaveTruthAsync is read-modify-write (merge + dedup by
          # ValidTimeUtc), same pattern as METAR/rainfall — pull the subtree
          # so a buoys archive chunk overlapping collect's realtime rows (or
          # an era5-waves window overlapping existing days) merges instead of
          # clobbering. Tree is small (one location, few sources).
          mkdir -p data/truth/waves
          rclone copy "r2:${R2_BUCKET}/data/truth/waves" ./data/truth/waves --fast-list --transfers 16 --checkers 32 --progress

      - name: Build
        run: dotnet build src/WeatherBlend/WeatherBlend.csproj -c Release --nologo

      - name: Backfill
        run: |
          END_ARG=""
          if [ -n "${{ inputs.end }}" ]; then
            END_ARG="--end ${{ inputs.end }}"
          fi
          LOC_ARG=""
          if [ -n "${{ inputs.location }}" ]; then
            LOC_ARG="--location ${{ inputs.location }}"
          fi
          dotnet run --project src/WeatherBlend --no-build -c Release -- \
            backfill --source ${{ inputs.source }} --start ${{ inputs.start }} $END_ARG $LOC_ARG

      - name: Push data to R2
        if: always()
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          rclone copy ./data "r2:${R2_BUCKET}/data" --fast-list --transfers 16 --checkers 32 --progress

      - name: Upload logs as artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backfill-logs-${{ github.run_id }}
          path: logs/
          retention-days: 5
          if-no-files-found: ignore
