name: predict-and-render

env:
  # rclone hang guard — every R2 transfer in this workflow inherits these.
  # A failed/stalled transfer retries hard and a dead connection times out
  # fast, instead of hanging silently to the job ceiling (a job timeout
  # surfaces as a `cancelled` run, easy to miss).
  RCLONE_TIMEOUT: 5m
  RCLONE_CONTIMEOUT: 1m
  RCLONE_LOW_LEVEL_RETRIES: "20"
  RCLONE_RETRIES: "5"

# Legacy fused predict + render. Production now runs the split
# (predict.yml -> predict-3f.yml -> render-site.yml chain — see
# cloudflare/scheduler-worker/src/index.ts hops D / F.1 / F). This
# workflow is KEPT as a fallback so a chain break can revert by
# flipping Hop D back here and disabling F.1+F. It MUST stay
# behaviourally identical to "predict.yml then render-site.yml" or
# the revert isn't a revert.
#
# Divergence proof: every step that does real work (predict-all,
# predict-tail = 4b synthesis + R2 push, render-and-deploy = render +
# Pages deploy) is a composite action under .github/actions/. The
# split workflows AND this fused one reference the exact same
# composites — there's no inline duplicated bash, so a future edit
# to (say) the 4b exit-code policy lands in predict-tail/action.yml
# and shows up in all callers automatically.
#
# Concurrency: shared `weatherblend-data` group with cancel-in-progress=false
# — a hard backstop: if anything overruns, predict queues until the lock
# frees. cancel-in-progress=false so a job mid-write to predictions is
# never interrupted.
on:
  # Schedule moved to Cloudflare 2026-05-01 (cloudflare/scheduler-worker/);
  # GitHub's `schedule:` trigger removed then. This workflow is no longer
  # cron'd at all — the Worker chains it off s3-collect's workflow_run
  # completion (see that directory's README / wrangler.toml).
  #
  # `workflow_dispatch:` retained so manual dashboard runs and the
  # Cloudflare scheduler's API-driven dispatches still work.
  workflow_dispatch:
    inputs:
      for_date:
        description: "Retroactive predict fill (yyyy-MM-dd). Leave blank for live run."
        required: false
        type: string
      window_days:
        description: "Render: how many days of predictions to include (table + charts)."
        required: false
        default: "30"
        type: string
      rolling_window_days:
        description: "Render: rolling-MAE window size for verification charts."
        required: false
        default: "14"
        type: string

concurrency:
  group: weatherblend-data
  cancel-in-progress: false

jobs:
  predict-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: preview

      # All R2 trees (incl. data/forecasts) come via the shared composite
      # action so render-site.yml and this workflow can never drift on the
      # dependency list. data/forecasts moved into the composite on
      # 2026-05-04 — render needs it for the per-NWP PoP overlay on
      # rain-skill and the Met Office Spot line on temp-skill.
      - uses: ./.github/actions/sync-render-inputs
        with:
          bucket: ${{ secrets.R2_BUCKET }}
          access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint: ${{ secrets.R2_ENDPOINT }}

      - name: Build
        run: dotnet build src/WeatherBlend/WeatherBlend.csproj -c Release --nologo

      # Predict-all composite: every predict target in dependency order.
      # Identical to predict.yml (same composite, single source of truth).
      - uses: ./.github/actions/predict-all
        with:
          for_date: ${{ github.event.inputs.for_date }}

      # 4b synthesis + R2 push. Identical to predict.yml — same composite.
      # The push happens BEFORE render so the deployed site reads the same
      # state any external R2 consumer would see.
      - uses: ./.github/actions/predict-tail
        with:
          r2_bucket: ${{ secrets.R2_BUCKET }}

      # Render-site CLI + Cloudflare Pages deploy. Identical to
      # render-site.yml — same composite.
      - uses: ./.github/actions/render-and-deploy
        with:
          window_days: ${{ github.event.inputs.window_days }}
          rolling_window_days: ${{ github.event.inputs.rolling_window_days }}
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Coverage guard runs AFTER render-and-deploy: a degraded cycle still
      # publishes what it has (better a partial site than none), but a breach
      # still reds the job → GH App files [ci-fail]. HARD-fail (exit 5, outside
      # predict-all's soft-skip set). if: always() so deploy failure doesn't
      # mask a coverage breach. Same guard as predict.yml (the split production
      # path); kept in lockstep so the two callers can't drift.
      - name: Coverage guard
        if: always()
        shell: bash
        run: |
          FOR_DATE="${{ github.event.inputs.for_date }}"
          if [ -n "$FOR_DATE" ]; then
            dotnet run --project src/WeatherBlend --no-build -c Release -- predict-coverage --for-date "$FOR_DATE"
          else
            dotnet run --project src/WeatherBlend --no-build -c Release -- predict-coverage
          fi

      - name: Upload logs as artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: predict-and-render-logs-${{ github.run_id }}
          path: logs/
          retention-days: 5
          if-no-files-found: ignore
