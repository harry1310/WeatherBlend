name: predict-and-render

# Combined predict + site render, running every 6 hours paired with collect.
# The original `predict.yml` and `render-site.yml` workflows are kept for
# manual dispatch only and no longer auto-trigger anything — see those
# files for per-step semantics. The bodies below are merged with no
# behaviour changes other than:
#   - one shared build + R2 sync
#   - predictions pushed to R2 once between predict and render so the deployed
#     site reads its own freshly-written outputs
#
# Schedule: 03:15, 09:15, 15:15, 21:15 UTC (4 runs/day, every 6h). Lives
# in cloudflare/scheduler-worker/wrangler.toml — see that file for the
# full sequencing rationale per slot:
#   HH:45    collect       (Open-Meteo + ERA5 + METAR + EA + MO DataHub)
#   HH+1:00  s3-collect    (raw S3 cycles for 2d — GFS / IFS / AIFS / MO Global / UKV)
#   HH+1:15  predict-and-render
#
# Both collects MUST finish before this fires. Enforced two ways:
# (1) dispatch ordering — predict-and-render fires 15 min after s3-collect
#     and 30 min after collect, past their typical runtimes (collect 3-5 min,
#     s3-collect 5-8 min post-2026-05-07 parallelisation);
# (2) shared `weatherblend-data` concurrency group with cancel-in-progress=false
#     so if either collect overruns, predict queues until the lock frees.
# cancel-in-progress=false because we never want to interrupt a job that's
# mid-write to predictions.
on:
  # Schedule moved to Cloudflare 2026-05-01 (cloudflare/scheduler-worker/);
  # GitHub's `schedule:` trigger removed at the same time. Cron updated
  # 2026-05-04 from `45 */2 * * *` (every 2h, 12×/day) → `45 2,8,14,20 * * *`
  # (every 6h, 4×/day, paired with collect) once temp predict moved to
  # hourly-per-lead output. Cron updated again 2026-05-05 from
  # `45 2,8,14,20` → `15 3,9,15,21` to make room for s3-collect.yml at
  # `45 2,8,14,20`. See cloudflare/scheduler-worker/wrangler.toml for the
  # full sequencing rationale.
  #
  # `workflow_dispatch:` retained so manual dashboard runs and the
  # Cloudflare scheduler's API-driven dispatches still work.
  workflow_dispatch:
    inputs:
      for_date:
        description: "Retroactive predict fill (yyyy-MM-dd). Leave blank for live run."
        required: false
        type: string
      window_days:
        description: "Render: how many days of predictions to include (table + charts)."
        required: false
        default: "30"
        type: string
      rolling_window_days:
        description: "Render: rolling-MAE window size for verification charts."
        required: false
        default: "14"
        type: string

concurrency:
  group: weatherblend-data
  cancel-in-progress: false

jobs:
  predict-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: preview

      # All R2 trees (incl. data/forecasts) come via the shared composite
      # action so render-site.yml and this workflow can never drift on the
      # dependency list. data/forecasts moved into the composite on
      # 2026-05-04 — render needs it for the per-NWP PoP overlay on
      # rain-skill and the Met Office Spot line on temp-skill.
      - uses: ./.github/actions/sync-render-inputs
        with:
          bucket: ${{ secrets.R2_BUCKET }}
          access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint: ${{ secrets.R2_ENDPOINT }}

      - name: Build
        run: dotnet build src/WeatherBlend/WeatherBlend.csproj -c Release --nologo

      # Every predict target in dependency order — temp / precip / dry-window /
      # elements / feels-like / start-hour. Soft-skip codes per target are
      # documented in the composite. Shared verbatim with predict.yml so the
      # two workflows can never drift on which targets run.
      - uses: ./.github/actions/predict-all
        with:
          for_date: ${{ github.event.inputs.for_date }}

      - name: Push predictions to R2
        # Pushed BEFORE render so the deployed site is reading the same state
        # any external consumer would see in R2. copy (not sync) — additive only.
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          rclone copy ./data/predictions "r2:${R2_BUCKET}/data/predictions" --fast-list --transfers 16 --checkers 32 --progress

      - name: Render site
        run: |
          WINDOW="${{ github.event.inputs.window_days }}"
          ROLLING="${{ github.event.inputs.rolling_window_days }}"
          ARGS="--output data/site"
          if [ -n "$WINDOW" ]; then ARGS="$ARGS --window-days $WINDOW"; fi
          if [ -n "$ROLLING" ]; then ARGS="$ARGS --rolling-window-days $ROLLING"; fi
          dotnet run --project src/WeatherBlend --no-build -c Release -- render-site $ARGS

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch main promotes to the production URL (weatherblend.pages.dev);
          # without it the deploy would only get a preview URL.
          command: pages deploy data/site --project-name weatherblend --branch main --commit-dirty=true

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: predict-and-render-logs-${{ github.run_id }}
          path: logs/
          retention-days: 14
          if-no-files-found: ignore
