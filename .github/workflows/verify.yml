name: verify

env:
  # rclone hang guard — every R2 transfer in this workflow inherits these.
  # A failed/stalled transfer retries hard and a dead connection times out
  # fast, instead of hanging silently to the job ceiling (a job timeout
  # surfaces as a `cancelled` run, easy to miss).
  RCLONE_TIMEOUT: 5m
  RCLONE_CONTIMEOUT: 1m
  RCLONE_LOW_LEVEL_RETRIES: "20"
  RCLONE_RETRIES: "5"

# Twice-weekly rolling verification. Joins the prediction tree against the ERA5
# truth tree, stratifies by (model_version, lead), and flags drift when rolling
# MAE exceeds 1.5× the training-time test MAE for that lead.
#
# Schedule moved to Cloudflare 2026-05-01 (cloudflare/scheduler-worker/);
# GitHub's `schedule:` trigger removed at the same time. Twice-weekly
# Mon + Thu 09:30 UTC (cron `30 9 * * MON,THU`, doubled from weekly-Mon
# 2026-05-04). The 3-4-3-4 cycle means a freshly retrained champion gets
# its first verify rows within 3-4 days instead of 7. Both runs land in
# the morning UTC slot when a human is most likely to read them.
#
# NB: Cloudflare cron uses 1=Sunday (not POSIX 0=Sunday). Earlier
# `* * 1,4` was firing Sun+Wed instead of Mon+Thu — fixed by using
# day-name aliases (MON, THU) which are unambiguous. The Cloudflare
# scheduler's lookup table maps the `30 9 * * MON,THU` cron to
# verify.yml.
#
# `workflow_dispatch:` retained so manual dashboard runs and the
# Cloudflare scheduler's API-driven dispatches still work.
on:
  workflow_dispatch:
    inputs:
      as_of:
        description: "Anchor date for the rolling window (yyyy-MM-dd). Leave blank for 'now'."
        required: false
        type: string
      window_days:
        description: "Rolling window size in days."
        required: false
        default: "14"
        type: string
      drift:
        description: "Drift threshold multiplier (rolling MAE vs training test MAE)."
        required: false
        default: "1.5"
        type: string

concurrency:
  group: weatherblend-data
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    # 25 min (was 15). The R2 pull grew past 15 min and the job was cancelled
    # mid-pull on 2026-06-01 (cascading skips). Real fix is the lighter models
    # pull below (excludes 4a BART artefacts); the bump is margin for continued
    # data growth.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: preview

      - uses: ./.github/actions/setup-r2
        with:
          access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint: ${{ secrets.R2_ENDPOINT }}

      - name: Pull predictions + ERA5 + model metadata + reports from R2
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          # Date-windowed since 2026-06-10 (incident review): VerifyCommand's
          # rolling windows are 14d (temp) / 30d (precip, dry-window,
          # elements), so a 90-day pull is conservative margin for
          # truth-settling lag + any as_of replay, while dropping the
          # ever-growing multi-year tail these three trees were copying on
          # every run. The predictions tree partitions uniformly as
          # .../model_version=<v>/date=<yyyy-MM-dd>/predictions.parquet
          # (every .NET predict command + the Python predictors — see
          # PredictionParquetWriter call sites and predict_4a/3f/wind_*.py),
          # and the era5 / rainfall truth trees as
          # location=...[/station=...]/date=<yyyy-MM-dd>/, so one UNROOTED
          # **/date=$d/** include set fits all three (rooted /date=...
          # would miss the parent segments — see s3-collect.yml's note).
          RECENT_INCLUDES=""
          for i in $(seq 0 90); do
            d=$(date -u -d "$i days ago" +%Y-%m-%d)
            RECENT_INCLUDES="$RECENT_INCLUDES --include **/date=$d/**"
          done

          # Predictions: the thing we're verifying.
          mkdir -p data/predictions
          rclone copy "r2:${R2_BUCKET}/data/predictions" ./data/predictions --fast-list --transfers 16 --checkers 32 --progress $RECENT_INCLUDES

          # ERA5 truth: join key for temperature verify.
          mkdir -p data/truth/era5
          rclone copy "r2:${R2_BUCKET}/data/truth/era5" ./data/truth/era5 --fast-list --transfers 16 --checkers 32 --progress $RECENT_INCLUDES

          # EA rainfall truth: join key for precipitation verify. 15-min readings
          # aggregated to hourly inside the verify command (HAVING COUNT(*)=4).
          mkdir -p data/truth/rainfall
          rclone copy "r2:${R2_BUCKET}/data/truth/rainfall" ./data/truth/rainfall --fast-list --transfers 16 --checkers 32 --progress $RECENT_INCLUDES

          # Model metadata (training_metadata.json + MANIFEST.json) for the drift
          # threshold reference. verify reads ONLY the json metadata + reports —
          # never the per-cell 4a BART artefacts (state_lead_*.rds ~452 MiB +
          # arrays_lead_*.npz ~21 MiB), which are ~80% of this tree's bytes.
          # Excluding them is what pulls the job back under the timeout — the
          # whole-tree copy had crept past the 15-min cap (2026-06-01 cancel).
          # Mirrors .github/actions/sync-render-inputs. 32/64 like that action.
          mkdir -p data/models
          rclone copy "r2:${R2_BUCKET}/data/models" ./data/models \
            --exclude '**/*.rds' --exclude '**/*.npz' \
            --fast-list --transfers 32 --checkers 64 --progress

          # Existing reports — additive-only writes land in the same tree.
          mkdir -p data/reports
          rclone copy "r2:${R2_BUCKET}/data/reports" ./data/reports --fast-list --transfers 16 --checkers 32 --progress

      - name: Build
        run: dotnet build src/WeatherBlend/WeatherBlend.csproj -c Release --nologo

      - name: Verify temperature (Bonehill, primary location)
        # Exit code 4 = drift detected. Keep the step non-fatal (|| true) but
        # propagate the exit to a separate step so the job is still visibly
        # orange in the run list. No --location → defaults to the primary.
        id: verify_run
        run: |
          AS_OF="${{ github.event.inputs.as_of }}"
          WINDOW="${{ github.event.inputs.window_days }}"
          DRIFT="${{ github.event.inputs.drift }}"
          ARGS="--target temperature"
          if [ -n "$AS_OF" ]; then ARGS="$ARGS --as-of $AS_OF"; fi
          if [ -n "$WINDOW" ]; then ARGS="$ARGS --window-days $WINDOW"; fi
          if [ -n "$DRIFT" ]; then ARGS="$ARGS --drift $DRIFT"; fi
          set +e
          dotnet run --project src/WeatherBlend --no-build -c Release -- verify $ARGS
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Verify temperature (Membury)
        # 2b/2c trained for Membury 2026-05-14. Predict wired since 2026-05-15;
        # verify wires here. --location scopes the prediction filter +
        # disambiguates the report filename (verify_temperature_membury_devon_
        # YYYY-MM-DD.md). History JSON is skipped for non-primary until the
        # multi-location Models page lands — markdown is the only deliverable
        # for now.
        id: verify_run_membury
        run: |
          AS_OF="${{ github.event.inputs.as_of }}"
          WINDOW="${{ github.event.inputs.window_days }}"
          DRIFT="${{ github.event.inputs.drift }}"
          ARGS="--target temperature --location membury_devon"
          if [ -n "$AS_OF" ]; then ARGS="$ARGS --as-of $AS_OF"; fi
          if [ -n "$WINDOW" ]; then ARGS="$ARGS --window-days $WINDOW"; fi
          if [ -n "$DRIFT" ]; then ARGS="$ARGS --drift $DRIFT"; fi
          set +e
          dotnet run --project src/WeatherBlend --no-build -c Release -- verify $ARGS
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Verify temperature (Sennen)
        # Sennen surfaced on the site 2026-06-11; 2b/2c trained at the
        # 2026-06-07 Sunday retrain. Same shape + semantics as the Membury
        # step above (markdown report only; exit not propagated — drift on
        # a non-primary location is triaged from the site, mirroring the
        # Membury precedent).
        id: verify_run_sennen
        run: |
          AS_OF="${{ github.event.inputs.as_of }}"
          WINDOW="${{ github.event.inputs.window_days }}"
          DRIFT="${{ github.event.inputs.drift }}"
          ARGS="--target temperature --location sennen_cove"
          if [ -n "$AS_OF" ]; then ARGS="$ARGS --as-of $AS_OF"; fi
          if [ -n "$WINDOW" ]; then ARGS="$ARGS --window-days $WINDOW"; fi
          if [ -n "$DRIFT" ]; then ARGS="$ARGS --drift $DRIFT"; fi
          set +e
          dotnet run --project src/WeatherBlend --no-build -c Release -- verify $ARGS
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Verify precipitation
        # Independent exit code from the temperature verify. Uses the precip-specific
        # default window (30d) unless the workflow_dispatch window_days override is set.
        id: verify_precip_run
        run: |
          AS_OF="${{ github.event.inputs.as_of }}"
          WINDOW="${{ github.event.inputs.window_days }}"
          DRIFT="${{ github.event.inputs.drift }}"
          ARGS="--target precipitation --truth-station all"
          if [ -n "$AS_OF" ]; then ARGS="$ARGS --as-of $AS_OF"; fi
          if [ -n "$WINDOW" ]; then ARGS="$ARGS --window-days $WINDOW"; fi
          if [ -n "$DRIFT" ]; then ARGS="$ARGS --drift $DRIFT"; fi
          set +e
          dotnet run --project src/WeatherBlend --no-build -c Release -- verify $ARGS
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Verify dry-window
        # Independent exit code. 30-day default window matches precip; same drift
        # semantics. --window all walks every (station, window) entry in the
        # dry_window manifest (every active station × 3/4/6h).
        id: verify_dry_window_run
        run: |
          AS_OF="${{ github.event.inputs.as_of }}"
          WINDOW="${{ github.event.inputs.window_days }}"
          DRIFT="${{ github.event.inputs.drift }}"
          ARGS="--target dry-window --truth-station all --window all"
          if [ -n "$AS_OF" ]; then ARGS="$ARGS --as-of $AS_OF"; fi
          if [ -n "$WINDOW" ]; then ARGS="$ARGS --window-days $WINDOW"; fi
          if [ -n "$DRIFT" ]; then ARGS="$ARGS --drift $DRIFT"; fi
          set +e
          dotnet run --project src/WeatherBlend --no-build -c Release -- verify $ARGS
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Verify rainfall amount (Phase 3f, Membury-only at present)
        # Distributional verify for 3f. Scores the mixed
        # (1-π)·δ_0 + π·LogNormal(μ,σ) against EA hourly rainfall truth and
        # emits CRPS / PIT / coverage / per-threshold exceedance Brier. Same
        # 30-day window + 1.5× drift threshold as the precip step (CRPS sits
        # in the same scale as Brier on this data). Soft-exit 2 when no 3f
        # bundles exist yet (fresh deploy without a Sunday retrain) so the
        # workflow doesn't go red for a no-op slice.
        id: verify_rainfall_amount_run
        run: |
          AS_OF="${{ github.event.inputs.as_of }}"
          WINDOW="${{ github.event.inputs.window_days }}"
          DRIFT="${{ github.event.inputs.drift }}"
          ARGS="--target rainfall-amount --truth-station all"
          if [ -n "$AS_OF" ]; then ARGS="$ARGS --as-of $AS_OF"; fi
          if [ -n "$WINDOW" ]; then ARGS="$ARGS --window-days $WINDOW"; fi
          if [ -n "$DRIFT" ]; then ARGS="$ARGS --drift $DRIFT"; fi
          set +e
          dotnet run --project src/WeatherBlend --no-build -c Release -- verify $ARGS
          code=$?
          set -e
          # exit 2 = "no rainfall_amount artefacts" — expected during initial
          # rollout before train_3f has run anywhere. Surface as a soft skip,
          # not a job failure.
          case "$code" in
            2) echo "::notice::No 3f bundles yet — skipping rainfall_amount verify."; code=0 ;;
          esac
          echo "exit=$code" >> "$GITHUB_OUTPUT"

      - name: Verify dry-window start-hour curves (all configured locations)
        # Scores the per-start-hour curves derived from precip + dry-window
        # blender outputs. No drift threshold — the curve is a derivation, not
        # a model, so the negative-skill warning in the report itself is the
        # signal. 30-day window matches the dry-window verify default.
        # Phase C commit 3c: location list comes from `list-locations` so
        # adding a third location is a config.yaml edit, not a YAML edit.
        id: verify_start_hour_run
        run: |
          AS_OF="${{ github.event.inputs.as_of }}"
          WINDOW="${{ github.event.inputs.window_days }}"
          LOCS=$(dotnet run --project src/WeatherBlend --no-build -c Release -- list-locations)
          fail=0
          for loc in $LOCS; do
            ARGS="--target start-hour --location $loc"
            if [ -n "$AS_OF" ]; then ARGS="$ARGS --as-of $AS_OF"; fi
            if [ -n "$WINDOW" ]; then ARGS="$ARGS --window-days $WINDOW"; fi
            set +e
            dotnet run --project src/WeatherBlend --no-build -c Release -- verify $ARGS
            code=$?
            set -e
            case "$code" in
              0) ;;
              *) echo "::error::Start-hour verify $loc exited $code."; fail=1 ;;
            esac
          done
          echo "exit=$fail" >> "$GITHUB_OUTPUT"

      - name: Verify element blenders (wind / humidity / shortwave-radiation / cloud-cover / wind-gust, all configured locations)
        # One verify step per (location, element). Independent exit codes —
        # drift on any element surfaces in the job summary. Empty windows
        # (no predictions yet — typical for Membury element blenders that
        # aren't trained yet) exit 0. Phase C commit 3c: location list from
        # `list-locations` — single source of truth, `_cfg.Locations`.
        # wind-gust added 2026-05-27.
        id: verify_elements_run
        run: |
          AS_OF="${{ github.event.inputs.as_of }}"
          WINDOW="${{ github.event.inputs.window_days }}"
          DRIFT="${{ github.event.inputs.drift }}"
          LOCS=$(dotnet run --project src/WeatherBlend --no-build -c Release -- list-locations)
          drift=0
          fail=0
          for loc in $LOCS; do
            for tgt in wind humidity shortwave-radiation cloud-cover wind-gust; do
              ARGS="--target $tgt --location $loc"
              if [ -n "$AS_OF" ]; then ARGS="$ARGS --as-of $AS_OF"; fi
              if [ -n "$WINDOW" ]; then ARGS="$ARGS --window-days $WINDOW"; fi
              if [ -n "$DRIFT" ]; then ARGS="$ARGS --drift $DRIFT"; fi
              set +e
              dotnet run --project src/WeatherBlend --no-build -c Release -- verify $ARGS
              code=$?
              set -e
              case "$code" in
                0) ;;
                4) echo "::warning::Element drift on $loc/$tgt — see verify report."; drift=1 ;;
                *) echo "::error::Element verify $loc/$tgt exited $code (non-drift failure)."; fail=1 ;;
              esac
            done
          done
          echo "drift=$drift" >> "$GITHUB_OUTPUT"
          echo "fail=$fail" >> "$GITHUB_OUTPUT"

      - name: Push refreshed reports to R2
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          rclone copy ./data/reports "r2:${R2_BUCKET}/data/reports" --fast-list --transfers 16 --checkers 32 --progress

      - name: Upload logs + report as artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-output-${{ github.run_id }}
          path: |
            logs/
            data/reports/verify_*.md
          retention-days: 5
          if-no-files-found: ignore

      - name: Flag drift in job summary + alert
        # Drift is informational, not a pipeline failure. As of 2026-05-11
        # all drift signals (temp / precip / dry-window / element) emit
        # ::warning:: + a summary block and the workflow exits 0 if every
        # verify step actually ran cleanly. Two reasons:
        #   1. Drift is a MODEL signal, not a PIPELINE signal — the cron
        #      did its job; the model has a regime/sample-size issue the
        #      Sunday retrain will absorb. Failing the workflow muddles
        #      the two AND silently blocks render-site.yml from running
        #      that day (its workflow_run trigger is gated on
        #      `conclusion == 'success'`), so the user can't even see the
        #      fresh drift numbers on the site until the next clean run.
        #   2. The user reads the site to triage drift; a [ci-fail]
        #      verify issue per drift-day is noise, not signal.
        # Hard step failures (compile error, missing data, anything not
        # 0 or 4) still exit 1.
        #
        # Pre-2026-05-11 drift exited 4 → fired the [ci-fail] verify
        # issue via the GH App webhook + skipped render-site auto-trigger.
        # Both undesirable.
        if: always()
        run: |
          T_EXIT="${{ steps.verify_run.outputs.exit }}"
          P_EXIT="${{ steps.verify_precip_run.outputs.exit }}"
          R_EXIT="${{ steps.verify_rainfall_amount_run.outputs.exit }}"
          D_EXIT="${{ steps.verify_dry_window_run.outputs.exit }}"
          E_DRIFT="${{ steps.verify_elements_run.outputs.drift }}"
          E_FAIL="${{ steps.verify_elements_run.outputs.fail }}"
          fail=0
          drifted_targets=()
          case "$T_EXIT" in
            0) ;;
            4) echo "::warning::Temperature drift detected — see verify report."; drifted_targets+=("temperature") ;;
            *) echo "::error::Temperature verify step exited $T_EXIT (non-drift failure)."; fail=1 ;;
          esac
          case "$P_EXIT" in
            0) ;;
            4) echo "::warning::Precipitation drift detected — see verify report."; drifted_targets+=("precipitation") ;;
            *) echo "::error::Precipitation verify step exited $P_EXIT (non-drift failure)."; fail=1 ;;
          esac
          case "$R_EXIT" in
            0) ;;
            4) echo "::warning::Rainfall-amount drift detected — see verify report."; drifted_targets+=("rainfall_amount") ;;
            *) echo "::error::Rainfall-amount verify step exited $R_EXIT (non-drift failure)."; fail=1 ;;
          esac
          case "$D_EXIT" in
            0) ;;
            4) echo "::warning::Dry-window drift detected — see verify report."; drifted_targets+=("dry-window") ;;
            *) echo "::error::Dry-window verify step exited $D_EXIT (non-drift failure)."; fail=1 ;;
          esac
          if [ "$E_DRIFT" = "1" ]; then
            echo "::warning::Element drift detected — see verify report."
            drifted_targets+=("element")
          fi
          if [ "$E_FAIL" = "1" ]; then fail=1; fi

          if [ "${#drifted_targets[@]}" -gt 0 ]; then
            {
              echo "## Drift detected (informational, not a build failure)"
              echo ""
              echo "Drifted target(s): ${drifted_targets[*]}"
              echo ""
              echo "Per-cell (station × lead) breakdown is in the \`verify_*.md\` reports under \`data/reports/\` (uploaded as a workflow artifact and pushed to R2 for the site to render)."
              echo ""
              echo "Action: open the per-target report on the site, identify the cells, and triage. Common causes:"
              echo "  - upstream model dropping rows / changing schema → look at the matching RetrainGuard last-run log"
              echo "  - truth-source change (gauge clog, ERA5 schema bump) → check the truth tree's Pull step in the latest collect run"
              echo "  - real climate / regime shift → wait for next retrain (Sunday) to absorb"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$fail" = "1" ]; then exit 1; fi
