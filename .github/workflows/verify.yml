name: verify

# Twice-weekly rolling verification. Joins the prediction tree against the ERA5
# truth tree, stratifies by (model_version, lead), and flags drift when rolling
# MAE exceeds 1.5× the training-time test MAE for that lead.
#
# Schedule moved to Cloudflare 2026-05-01 (cloudflare/scheduler-worker/);
# GitHub's `schedule:` trigger removed at the same time. Twice-weekly
# Mon + Thu 09:30 UTC (cron `30 9 * * MON,THU`, doubled from weekly-Mon
# 2026-05-04). The 3-4-3-4 cycle means a freshly retrained champion gets
# its first verify rows within 3-4 days instead of 7. Both runs land in
# the morning UTC slot when a human is most likely to read them.
#
# NB: Cloudflare cron uses 1=Sunday (not POSIX 0=Sunday). Earlier
# `* * 1,4` was firing Sun+Wed instead of Mon+Thu — fixed by using
# day-name aliases (MON, THU) which are unambiguous. The Cloudflare
# scheduler's lookup table maps the `30 9 * * MON,THU` cron to
# verify.yml.
#
# `workflow_dispatch:` retained so manual dashboard runs and the
# Cloudflare scheduler's API-driven dispatches still work.
on:
  workflow_dispatch:
    inputs:
      as_of:
        description: "Anchor date for the rolling window (yyyy-MM-dd). Leave blank for 'now'."
        required: false
        type: string
      window_days:
        description: "Rolling window size in days."
        required: false
        default: "14"
        type: string
      drift:
        description: "Drift threshold multiplier (rolling MAE vs training test MAE)."
        required: false
        default: "1.5"
        type: string

concurrency:
  group: weatherblend-data
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: preview

      - uses: ./.github/actions/setup-r2
        with:
          access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint: ${{ secrets.R2_ENDPOINT }}

      - name: Pull predictions + ERA5 + model metadata + reports from R2
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          # Predictions: the thing we're verifying.
          mkdir -p data/predictions
          rclone copy "r2:${R2_BUCKET}/data/predictions" ./data/predictions --fast-list --transfers 16 --checkers 32 --progress

          # ERA5 truth: join key for temperature verify. Pulling the whole tree is fine at PoC scale.
          mkdir -p data/truth/era5
          rclone copy "r2:${R2_BUCKET}/data/truth/era5" ./data/truth/era5 --fast-list --transfers 16 --checkers 32 --progress

          # EA rainfall truth: join key for precipitation verify. 15-min readings
          # aggregated to hourly inside the verify command (HAVING COUNT(*)=4).
          mkdir -p data/truth/rainfall
          rclone copy "r2:${R2_BUCKET}/data/truth/rainfall" ./data/truth/rainfall --fast-list --transfers 16 --checkers 32 --progress

          # Model metadata (training_metadata.json + MANIFEST.json) for the drift
          # threshold reference. We don't need the .zip artefacts for verify but
          # copying the whole models tree is simpler than filtering.
          mkdir -p data/models
          rclone copy "r2:${R2_BUCKET}/data/models" ./data/models --fast-list --transfers 16 --checkers 32 --progress

          # Existing reports — additive-only writes land in the same tree.
          mkdir -p data/reports
          rclone copy "r2:${R2_BUCKET}/data/reports" ./data/reports --fast-list --transfers 16 --checkers 32 --progress

      - name: Build
        run: dotnet build src/WeatherBlend/WeatherBlend.csproj -c Release --nologo

      - name: Verify temperature
        # Exit code 4 = drift detected. Keep the step non-fatal (|| true) but
        # propagate the exit to a separate step so the job is still visibly
        # orange in the run list.
        id: verify_run
        run: |
          AS_OF="${{ github.event.inputs.as_of }}"
          WINDOW="${{ github.event.inputs.window_days }}"
          DRIFT="${{ github.event.inputs.drift }}"
          ARGS="--target temperature"
          if [ -n "$AS_OF" ]; then ARGS="$ARGS --as-of $AS_OF"; fi
          if [ -n "$WINDOW" ]; then ARGS="$ARGS --window-days $WINDOW"; fi
          if [ -n "$DRIFT" ]; then ARGS="$ARGS --drift $DRIFT"; fi
          set +e
          dotnet run --project src/WeatherBlend --no-build -c Release -- verify $ARGS
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Verify precipitation
        # Independent exit code from the temperature verify. Uses the precip-specific
        # default window (30d) unless the workflow_dispatch window_days override is set.
        id: verify_precip_run
        run: |
          AS_OF="${{ github.event.inputs.as_of }}"
          WINDOW="${{ github.event.inputs.window_days }}"
          DRIFT="${{ github.event.inputs.drift }}"
          ARGS="--target precipitation --truth-station all"
          if [ -n "$AS_OF" ]; then ARGS="$ARGS --as-of $AS_OF"; fi
          if [ -n "$WINDOW" ]; then ARGS="$ARGS --window-days $WINDOW"; fi
          if [ -n "$DRIFT" ]; then ARGS="$ARGS --drift $DRIFT"; fi
          set +e
          dotnet run --project src/WeatherBlend --no-build -c Release -- verify $ARGS
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Verify dry-window
        # Independent exit code. 30-day default window matches precip; same drift
        # semantics. --window all walks every (station, window) entry in the
        # dry_window manifest (Bellever + Princetown × 3/4/6h).
        id: verify_dry_window_run
        run: |
          AS_OF="${{ github.event.inputs.as_of }}"
          WINDOW="${{ github.event.inputs.window_days }}"
          DRIFT="${{ github.event.inputs.drift }}"
          ARGS="--target dry-window --truth-station all --window all"
          if [ -n "$AS_OF" ]; then ARGS="$ARGS --as-of $AS_OF"; fi
          if [ -n "$WINDOW" ]; then ARGS="$ARGS --window-days $WINDOW"; fi
          if [ -n "$DRIFT" ]; then ARGS="$ARGS --drift $DRIFT"; fi
          set +e
          dotnet run --project src/WeatherBlend --no-build -c Release -- verify $ARGS
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Verify dry-window start-hour curves
        # Scores the per-start-hour curves derived from precip + dry-window
        # blender outputs. No drift threshold — the curve is a derivation, not
        # a model, so the negative-skill warning in the report itself is the
        # signal. 30-day window matches the dry-window verify default.
        id: verify_start_hour_run
        run: |
          AS_OF="${{ github.event.inputs.as_of }}"
          WINDOW="${{ github.event.inputs.window_days }}"
          ARGS="--target start-hour"
          if [ -n "$AS_OF" ]; then ARGS="$ARGS --as-of $AS_OF"; fi
          if [ -n "$WINDOW" ]; then ARGS="$ARGS --window-days $WINDOW"; fi
          set +e
          dotnet run --project src/WeatherBlend --no-build -c Release -- verify $ARGS
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Verify element blenders (wind / humidity / shortwave-radiation / cloud-cover)
        # One verify step per element. Independent exit codes — drift on any element
        # surfaces in the job summary. Empty windows (no predictions yet) exit 0.
        id: verify_elements_run
        run: |
          AS_OF="${{ github.event.inputs.as_of }}"
          WINDOW="${{ github.event.inputs.window_days }}"
          DRIFT="${{ github.event.inputs.drift }}"
          drift=0
          fail=0
          for tgt in wind humidity shortwave-radiation cloud-cover; do
            ARGS="--target $tgt"
            if [ -n "$AS_OF" ]; then ARGS="$ARGS --as-of $AS_OF"; fi
            if [ -n "$WINDOW" ]; then ARGS="$ARGS --window-days $WINDOW"; fi
            if [ -n "$DRIFT" ]; then ARGS="$ARGS --drift $DRIFT"; fi
            set +e
            dotnet run --project src/WeatherBlend --no-build -c Release -- verify $ARGS
            code=$?
            set -e
            case "$code" in
              0) ;;
              4) echo "::warning::Element drift on $tgt — see verify report."; drift=1 ;;
              *) echo "::error::Element verify $tgt exited $code (non-drift failure)."; fail=1 ;;
            esac
          done
          echo "drift=$drift" >> "$GITHUB_OUTPUT"
          echo "fail=$fail" >> "$GITHUB_OUTPUT"

      - name: Push refreshed reports to R2
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          rclone copy ./data/reports "r2:${R2_BUCKET}/data/reports" --fast-list --transfers 16 --checkers 32 --progress

      - name: Upload logs + report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-output-${{ github.run_id }}
          path: |
            logs/
            data/reports/verify_*.md
          retention-days: 30
          if-no-files-found: ignore

      - name: Flag drift in job summary
        if: always()
        run: |
          T_EXIT="${{ steps.verify_run.outputs.exit }}"
          P_EXIT="${{ steps.verify_precip_run.outputs.exit }}"
          D_EXIT="${{ steps.verify_dry_window_run.outputs.exit }}"
          E_DRIFT="${{ steps.verify_elements_run.outputs.drift }}"
          E_FAIL="${{ steps.verify_elements_run.outputs.fail }}"
          drift=0
          fail=0
          case "$T_EXIT" in
            0) ;;
            4) echo "::warning::Temperature drift detected — see verify report."; drift=1 ;;
            *) echo "::error::Temperature verify step exited $T_EXIT (non-drift failure)."; fail=1 ;;
          esac
          case "$P_EXIT" in
            0) ;;
            4) echo "::warning::Precipitation drift detected — see verify report."; drift=1 ;;
            *) echo "::error::Precipitation verify step exited $P_EXIT (non-drift failure)."; fail=1 ;;
          esac
          case "$D_EXIT" in
            0) ;;
            4) echo "::warning::Dry-window drift detected — see verify report."; drift=1 ;;
            *) echo "::error::Dry-window verify step exited $D_EXIT (non-drift failure)."; fail=1 ;;
          esac
          if [ "$E_DRIFT" = "1" ]; then drift=1; fi
          if [ "$E_FAIL" = "1" ]; then fail=1; fi
          if [ "$drift" = "1" ]; then
            echo "**Drift detected.** See attached \`verify_*.md\` report(s)." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$fail" = "1" ]; then exit 1; fi
