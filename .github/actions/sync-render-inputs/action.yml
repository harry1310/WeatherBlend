name: Sync render-site inputs from R2
description: Pulls every R2 tree the `render-site` command reads. Single source of truth so render-site.yml and predict-and-render.yml can never drift on the dependency list (the missing-`data/reports` regression on 2026-05-01 was exactly that drift).

inputs:
  bucket:
    description: R2 bucket name (typically secrets.R2_BUCKET).
    required: true
  access_key_id:
    description: R2 access key ID.
    required: true
  secret_access_key:
    description: R2 secret access key.
    required: true
  endpoint:
    description: R2 S3 endpoint URL.
    required: true

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-r2
      with:
        access_key_id: ${{ inputs.access_key_id }}
        secret_access_key: ${{ inputs.secret_access_key }}
        endpoint: ${{ inputs.endpoint }}

    - name: Sync render-site input trees from R2
      shell: bash
      env:
        R2_BUCKET: ${{ inputs.bucket }}
      # The list below is THE canonical render-site dependency set. Add any
      # new tree the RenderSiteCommand starts reading here, in this single
      # place. Both render-site.yml (manual + post-verify auto) and the
      # render step of predict-and-render.yml (every 2h) consume it.
      #
      # Tree purposes:
      #   data/predictions     — the prediction parquet the home page + per-lead
      #                          forecasts + skill charts read. NB this whole-tree
      #                          pull covers every element subtree, including
      #                          data/predictions/wave_height (the Sea state page's
      #                          source, added 2026-06-11) — its layout is the same
      #                          model_version=*/date=* shape, so the 40-day
      #                          date-window include below applies verbatim.
      #   data/truth/era5      — temperature truth for skill charts.
      #   data/truth/metar     — METAR comparison line for the temp skill page.
      #   data/truth/rainfall  — EA gauge truth for precip + rain-skill charts.
      #   data/truth/met_office_obs — Met Office DataHub Land Obs (geohash gcj0z3
      #                          ≈ Taw Green / North Wyke). Read by
      #                          TruthRepository.GetMetOfficeObsTemperature for
      #                          the second cross-check line on temp-skill.
      #                          Missing this tree was the silent-empty bug on
      #                          2026-05-04 (when the obs line first shipped).
      #   data/models          — training_metadata.json (Models page metrics +
      #                          phase labels) and MANIFEST.json (champion
      #                          filter for home-page forecast cards).
      #   data/reports         — verify_*.json sidecars feed the Models page's
      #                          per-card "Verify history" table. Missing this
      #                          tree was the silent-empty bug on 2026-05-01.
      #   data/forecasts       — RenderSiteCommand.QueryNwpPrecipProbabilities
      #                          + QueryMetOfficeSpotForecasts read raw NWP
      #                          forecast rows for the per-NWP PoP overlay on
      #                          rain-skill and the Met Office Spot temp / PoP
      #                          comparison line on temp-skill. Missing this
      #                          tree was the silent-empty bug on 2026-05-04
      #                          (standalone render-site only — predict-and-
      #                          render had it incidentally because predict
      #                          step pulls forecasts directly).
      run: |
        # data/forecasts is by far the biggest tree: ~800 historical date
        # partitions × 8 NWP models × multiple cycles each = ~23k parquets,
        # ~215 MiB, taking ~3.5 min of the sync step. RenderSiteCommand
        # only reads it through Query{NwpPrecipProbabilities,
        # MetOfficeSpotForecasts}, both filtered to ValidTimeUtc ∈
        # [now-windowDays, now+6d] (windowDays defaults to 30). So we
        # restrict the copy to the last 40 cycle dates — covers the render
        # window plus a 168h lead + 1d headroom. ~25-30x fewer files.
        # Predict-and-render's predict step shares this workspace and also
        # only needs recent cycles (lead ≤ 168h), so a 40-day forecast slice
        # covers it too. Training (which needs multi-year history) runs from
        # a different workflow and pulls without filters.
        #
        # data/truth/rainfall is the same shape of problem: ~10.5k tiny
        # parquets (one day of 15-min totals each, location=/station=/date=
        # hive layout) — only ~27 MiB but ~2.2 min, because the cost is
        # per-object round-trips, not bytes. It's read in this workflow by
        # exactly two consumers, both of which only need recent data:
        #   - RenderSiteCommand via LoadRainfallTruth(now-windowDays, now);
        #     every TruthRepository rainfall query is SQL-filtered on
        #     ObservedTimeUtc, so only the last windowDays of partitions
        #     are touched.
        #   - PrecipPredictCommand's rich/3d persistence features
        #     (PrecipRichFeatureBuilder.LoadHourlyRain) — Prev24hMm /
        #     Prev72hMm etc., a ≤72h lookback before the live run anchor.
        # verify (deep history) runs from a different workflow and pulls
        # unfiltered. The date= partition key is ObservedTimeUtc.Date, so
        # the same 40-day date-window include used for forecasts applies
        # verbatim and covers both consumers with wide margin.
        #
        # data/truth/era5 + data/truth/metar (2026-05-20): same trick. Both
        # are hive-partitioned by `date=<yyyy-MM-dd>` (era5 = ValidTimeUtc
        # day, metar = ObservedTimeUtc day) and read in this workflow only
        # by RenderSiteCommand — Era5 via GetEra5Hourly(windowStart-3d, now)
        # for the temp truth chart, METAR via GetMetarTemperature(windowStart,
        # now) for the temp skill comparison line. Both DuckDB queries are
        # SQL-filtered on the timestamp so partitions outside the window are
        # never touched. verify (deep history) runs from verify.yml's own R2
        # pull, unfiltered. era5/metar were 43s + 31s pre-filter (2,240 +
        # 2,234 files); ~40 days × ≤2 locations cuts to ~80 files each.
        #
        # NB the 40-day slice assumes the workflow's window_days input is
        # not pushed far past ~34 — the same pre-existing assumption the
        # forecasts slice already bakes in. A retroactive for_date older
        # than ~40 days is likewise unsupported by this workflow's sync
        # (the forecast NWP inputs wouldn't be present either).
        #
        # data/models is the other heavy tree (~585 MiB) — but ~474 MiB of
        # that is Phase 4a's per-cell BART artefacts (state_lead_*.rds +
        # arrays_lead_*.npz), excluded below since nothing here reads them.
        # Remaining ~111 MiB across 5,851 small files is round-trip-bound
        # (~53 files/s at --transfers 16). Bumped to --transfers 32
        # --checkers 64 on the data/models pull only (other trees stay at
        # 16/32 to spare the runner's IO when the bottleneck is bytes not
        # files). The remaining trees (predictions / reports) are tens of
        # MiB each and stay full-copy.
        DATE_WINDOW_INCLUDES=""
        # 40 → 55 days (2026-06-12): the Met Office Spot skill-chart lines
        # replay Spot forecasts over the render window (~30d) PLUS
        # RenderSiteCommand.SpotVerifyLookbackExtraDays (21d) of lookback —
        # a 40-day pull silently thinned the Spot lines' early weeks in CI
        # while local renders (full tree on disk) looked complete.
        for i in $(seq 0 55); do
          d=$(date -u -d "$i days ago" +%Y-%m-%d)
          DATE_WINDOW_INCLUDES="$DATE_WINDOW_INCLUDES --include **/date=$d/**"
        done

        for tree in \
            data/predictions \
            data/truth/era5 \
            data/truth/metar \
            data/truth/rainfall \
            data/truth/met_office_obs \
            data/models \
            data/reports \
            data/forecasts \
            data/marine; do
          mkdir -p "${tree}"
          echo "::group::sync ${tree}"
          # Per-tree extra rclone flags (word-split, same as DATE_WINDOW_INCLUDES).
          EXTRA=""
          TRANSFERS=16
          CHECKERS=32
          case "$tree" in
            # data/marine joined 2026-06-13: the rock-surface predict's S4
            # sea-longwave term reads best_match SST from it (Sennen
            # cliff-face mode, docs/SENNEN_ROCK_TEMP_PLAN.md); without the
            # tree the SST query silently falls back to neutral
            # surroundings. Same location=/model=/date= hive layout, so the
            # window include applies verbatim; tiny tree (one location,
            # 6 wave models, ~2 files/date).
            data/forecasts|data/truth/rainfall|data/truth/era5|data/truth/metar|data/predictions|data/marine)
              # Date-window-filtered trees — see the comment above the
              # DATE_WINDOW_INCLUDES builder for the per-tree rationale.
              #
              # data/predictions joined the windowed set 2026-06-11: it was
              # left full-copy when it was "tens of MiB", but every cycle
              # adds partitions and RETIRED model_version dirs keep theirs
              # forever, so it had grown to ~77 MiB of tiny parquets at
              # ~0.55 MiB/s (~140 s, round-trip-bound). Layout is
              # model_version=*/date=<yyyy-MM-dd>/ everywhere (incl. the
              # per-station precip/dry-window trees), so the same 40-day
              # include applies verbatim; RenderSiteCommand reads
              # predictions through the same windowDays-bounded queries as
              # the other windowed trees, and verify (90-day depth) does
              # its own pull in verify.yml. Old-version dirs fall out
              # automatically because their newest partitions age past the
              # window.
              EXTRA="$DATE_WINDOW_INCLUDES" ;;
            data/models)
              # Manifest-driven ACTIVE-ONLY pull (2026-06-11). The old
              # whole-tree-minus-artefacts copy was 233 MiB and grows by a
              # full bundle generation every retrain because R2 never prunes
              # old version dirs (it was ~111 MiB when first annotated here;
              # two manual retrains this week alone re-doubled the predict
              # sync to 502s). Predict + render only ever open ACTIVE
              # bundles' artefacts, and version dir names are TIMESTAMPED
              # AND GLOBALLY UNIQUE, so one include list built from every
              # target's MANIFEST Active arrays covers all tree shapes
              # (station-keyed, location-keyed, dry_window's window_Nh
              # level) without per-target path logic. This bounds the pull
              # at ~one bundle generation regardless of R2 growth.
              #
              # **/training_metadata.json is pulled for EVERY version (tiny
              # files): the charts render recently-RETIRED versions still
              # inside the predictions window and GetPhaseByVersion needs
              # their Phase stamps — metadata is the one artefact consumers
              # read for non-Active versions.
              #
              # rds/npz excludes kept for the Active dirs themselves (4a's
              # BART state lives inside Active bundle dirs and only
              # WeatherProbabilistic's own workflows read it).
              echo "::group::sync ${tree} (manifests first)"
              rclone copy "r2:${R2_BUCKET}/${tree}" "./${tree}" \
                --include '**/MANIFEST.json' --include '**/LEAD_POLICY.json' \
                --fast-list --checkers 16
              echo "::endgroup::"
              ACTIVE_VERSIONS=$(jq -r '.Stations[]?.Active[]?' ${tree}/*/MANIFEST.json 2>/dev/null | sort -u)
              if [ -z "$ACTIVE_VERSIONS" ]; then
                # No manifests yet (fresh deploy) — fall back to the old
                # whole-tree-minus-artefacts behaviour rather than pulling
                # nothing and starving predict.
                echo "::warning::no Active versions found in any models MANIFEST — falling back to full models pull."
                EXTRA="--exclude **/*.rds --exclude **/*.npz"
              else
                # Excludes FIRST: rclone filters are first-match-wins, so the
                # rds/npz rules must outrank the Active-dir includes or 4a's
                # BART state inside an Active dir would be pulled after all.
                EXTRA="--exclude **/*.rds --exclude **/*.npz --include **/training_metadata.json"
                for v in $ACTIVE_VERSIONS; do
                  EXTRA="$EXTRA --include **/$v/**"
                done
                echo "models pull scoped to $(echo "$ACTIVE_VERSIONS" | wc -l) Active version dirs (+ all training_metadata.json)."
              fi
              # Round-trip-bound (many small files) — high concurrency.
              TRANSFERS=32
              CHECKERS=64 ;;
          esac
          rclone copy "r2:${R2_BUCKET}/${tree}" "./${tree}" \
            --fast-list --transfers "$TRANSFERS" --checkers "$CHECKERS" --progress $EXTRA
          echo "::endgroup::"
        done
