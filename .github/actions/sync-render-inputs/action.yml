name: Sync render-site inputs from R2
description: Pulls every R2 tree the `render-site` command reads. Single source of truth so render-site.yml and predict-and-render.yml can never drift on the dependency list (the missing-`data/reports` regression on 2026-05-01 was exactly that drift).

inputs:
  bucket:
    description: R2 bucket name (typically secrets.R2_BUCKET).
    required: true
  access_key_id:
    description: R2 access key ID.
    required: true
  secret_access_key:
    description: R2 secret access key.
    required: true
  endpoint:
    description: R2 S3 endpoint URL.
    required: true

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-r2
      with:
        access_key_id: ${{ inputs.access_key_id }}
        secret_access_key: ${{ inputs.secret_access_key }}
        endpoint: ${{ inputs.endpoint }}

    - name: Sync render-site input trees from R2
      shell: bash
      env:
        R2_BUCKET: ${{ inputs.bucket }}
      # The list below is THE canonical render-site dependency set. Add any
      # new tree the RenderSiteCommand starts reading here, in this single
      # place. Both render-site.yml (manual + post-verify auto) and the
      # render step of predict-and-render.yml (every 2h) consume it.
      #
      # Tree purposes:
      #   data/predictions     — the prediction parquet the home page + per-lead
      #                          forecasts + skill charts read.
      #   data/truth/era5      — temperature truth for skill charts.
      #   data/truth/metar     — METAR comparison line for the temp skill page.
      #   data/truth/rainfall  — EA gauge truth for precip + rain-skill charts.
      #   data/truth/met_office_obs — Met Office DataHub Land Obs (geohash gcj0z3
      #                          ≈ Taw Green / North Wyke). Read by
      #                          TruthRepository.GetMetOfficeObsTemperature for
      #                          the second cross-check line on temp-skill.
      #                          Missing this tree was the silent-empty bug on
      #                          2026-05-04 (when the obs line first shipped).
      #   data/models          — training_metadata.json (Models page metrics +
      #                          phase labels) and MANIFEST.json (champion
      #                          filter for home-page forecast cards).
      #   data/reports         — verify_*.json sidecars feed the Models page's
      #                          per-card "Verify history" table. Missing this
      #                          tree was the silent-empty bug on 2026-05-01.
      #   data/forecasts       — RenderSiteCommand.QueryNwpPrecipProbabilities
      #                          + QueryMetOfficeSpotForecasts read raw NWP
      #                          forecast rows for the per-NWP PoP overlay on
      #                          rain-skill and the Met Office Spot temp / PoP
      #                          comparison line on temp-skill. Missing this
      #                          tree was the silent-empty bug on 2026-05-04
      #                          (standalone render-site only — predict-and-
      #                          render had it incidentally because predict
      #                          step pulls forecasts directly).
      run: |
        # data/forecasts is by far the biggest tree: ~800 historical date
        # partitions × 8 NWP models × multiple cycles each = ~23k parquets,
        # ~215 MiB, taking ~3.5 min of the sync step. RenderSiteCommand
        # only reads it through Query{NwpPrecipProbabilities,
        # MetOfficeSpotForecasts}, both filtered to ValidTimeUtc ∈
        # [now-windowDays, now+6d] (windowDays defaults to 30). So we
        # restrict the copy to the last 40 cycle dates — covers the render
        # window plus a 168h lead + 1d headroom. ~25-30x fewer files.
        # Predict-and-render's predict step shares this workspace and also
        # only needs recent cycles (lead ≤ 168h), so a 40-day forecast slice
        # covers it too. Training (which needs multi-year history) runs from
        # a different workflow and pulls without filters.
        #
        # data/models is the other heavy tree (~585 MiB) — but ~474 MiB of
        # that is Phase 4a's per-cell BART artefacts (state_lead_*.rds +
        # arrays_lead_*.npz), excluded below since nothing here reads them.
        # The remaining trees (predictions / era5 / metar / rainfall /
        # reports) are tens of MiB each and stay full-copy.
        FORECAST_INCLUDES=""
        for i in $(seq 0 40); do
          d=$(date -u -d "$i days ago" +%Y-%m-%d)
          FORECAST_INCLUDES="$FORECAST_INCLUDES --include **/date=$d/**"
        done

        for tree in \
            data/predictions \
            data/truth/era5 \
            data/truth/metar \
            data/truth/rainfall \
            data/truth/met_office_obs \
            data/models \
            data/reports \
            data/forecasts; do
          mkdir -p "${tree}"
          echo "::group::sync ${tree}"
          # Per-tree extra rclone flags (word-split, same as FORECAST_INCLUDES).
          EXTRA=""
          if [ "$tree" = "data/forecasts" ]; then
            EXTRA="$FORECAST_INCLUDES"
          elif [ "$tree" = "data/models" ]; then
            # Phase 4a's per-cell BART artefacts — state_lead_*.rds (~452 MiB)
            # + arrays_lead_*.npz (~21 MiB) — are consumed ONLY by
            # WeatherProbabilistic's predict-4a workflow (its own bundle pull).
            # Neither the .NET predict step nor RenderSiteCommand here opens an
            # R .rds or numpy .npz, so excluding them drops ~474 MiB — most of
            # data/models, and most of this sync's runtime.
            EXTRA="--exclude **/*.rds --exclude **/*.npz"
          fi
          rclone copy "r2:${R2_BUCKET}/${tree}" "./${tree}" \
            --fast-list --transfers 16 --checkers 32 --progress $EXTRA
          echo "::endgroup::"
        done
